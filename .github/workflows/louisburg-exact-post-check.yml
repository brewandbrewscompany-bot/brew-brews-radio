name: Louisburg exact post recovery check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/louisburg-exact-post-check.yml'

permissions:
  contents: read

jobs:
  recover-exact-post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LL_SOCIAL_ENDPOINT: https://script.google.com/macros/s/AKfycbxw9gJBH50L_VZbgp6i_mHHnfPXAkraIqv63BA2XqWtb-XaaczXxdf89WveFkAOwV-azw/exec
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install worker
        working-directory: louisburg-local/social-browser-worker
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: louisburg-local/social-browser-worker
        run: npx playwright install --with-deps chromium
      - name: Test exact recovery
        working-directory: louisburg-local/social-browser-worker
        run: node --test exact-post-recovery.test.mjs
      - name: Recover exact post
        working-directory: louisburg-local/social-browser-worker
        run: node exact-post-recovery.mjs
