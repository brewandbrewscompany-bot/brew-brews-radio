name: Witch Ride 3D Check

on:
  push:
    paths:
      - 'halloween-radio/games/witch-ride-3d/**'
      - '.github/workflows/witch-ride-3d-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game3d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          cp halloween-radio/games/witch-ride-3d/game.js /tmp/witch-ride-3d.mjs
          node --check /tmp/witch-ride-3d.mjs
          grep -q "playcanvas@2.22.0" halloween-radio/games/witch-ride-3d/index.html
          grep -q "new pc.Application" halloween-radio/games/witch-ride-3d/game.js
      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Run 3D renderer smoke test
        run: |
          python3 -m http.server 8000 --directory . >/tmp/wr3d-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--mute-audio','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
            const page=await browser.newPage();await page.setViewport({width:430,height:932,deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/halloween-radio/games/witch-ride-3d/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.WitchRide3D?.ready&&document.body.classList.contains('ready'),{timeout:30000});
            const before=await page.evaluate(()=>({canvas:!!document.querySelector('canvas'),title:document.querySelector('#title').classList.contains('open'),engine:window.WitchRide3D.engine}));
            if(!before.canvas||!before.title||before.engine!=='PlayCanvas')throw new Error('3D boot failed '+JSON.stringify(before));
            await page.click('#play');await sleep(2400);
            const running=await page.evaluate(()=>({score:Number((document.querySelector('#score').textContent||'0').replace(/,/g,'')),distance:document.querySelector('#distance').textContent,hud:!document.querySelector('#hud').classList.contains('hidden'),mode:window.WitchRide3D.state.mode}));
            if(!running.hud||running.mode!=='playing'||!(running.score>0))throw new Error('3D ride did not advance '+JSON.stringify(running));
            await page.keyboard.down('ArrowRight');await sleep(500);await page.keyboard.up('ArrowRight');await sleep(250);
            const moved=await page.evaluate(()=>Math.abs(window.WitchRide3D.state.x)>.03);if(!moved)throw new Error('3D steering did not move witch');
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            console.log('Witch Ride 3D passed',JSON.stringify(running));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
