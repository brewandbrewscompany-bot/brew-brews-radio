name: Witch Ride 3D Check

on:
  push:
    paths:
      - 'halloween-radio/games/witch-ride-3d/**'
      - '.github/workflows/witch-ride-3d-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game3d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and realism assets
        run: |
          cp halloween-radio/games/witch-ride-3d/game.js /tmp/witch-ride-3d.mjs
          cp halloween-radio/games/witch-ride-3d/realism-pass.js /tmp/witch-ride-realism.mjs
          cp halloween-radio/games/witch-ride-3d/atmosphere-pass.js /tmp/witch-ride-atmosphere.mjs
          node --check /tmp/witch-ride-3d.mjs
          node --check /tmp/witch-ride-realism.mjs
          node --check /tmp/witch-ride-atmosphere.mjs
          grep -q "playcanvas@2.22.0" halloween-radio/games/witch-ride-3d/index.html
          grep -q "realism-pass.js" halloween-radio/games/witch-ride-3d/index.html
          grep -q "atmosphere-pass.js" halloween-radio/games/witch-ride-3d/index.html
          grep -q "new pc.Application" halloween-radio/games/witch-ride-3d/game.js
          grep -q "cinematic-detail-v2" halloween-radio/games/witch-ride-3d/game.js
          grep -q "realism-pass-v1" halloween-radio/games/witch-ride-3d/realism-pass.js
          grep -q "atmosphere-pass-v5" halloween-radio/games/witch-ride-3d/atmosphere-pass.js
          grep -q "Fog Headlight Volume" halloween-radio/games/witch-ride-3d/atmosphere-pass.js
          grep -q "Drifting Leaf" halloween-radio/games/witch-ride-3d/atmosphere-pass.js
          grep -q "Restrained Broom Ember" halloween-radio/games/witch-ride-3d/atmosphere-pass.js
          test -s halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/vintage-car.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/dead-tree.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/coffee-bean.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/haunted-fence.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/jack-o-lantern.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/haunted-roastery.glb
          grep -a -q 'coat_back_seam' halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
          grep -a -q 'hood_center_ridge' halloween-radio/games/witch-ride-3d/assets/models/vintage-car.glb
          grep -a -q 'root_flare_bark_knot_combined' halloween-radio/games/witch-ride-3d/assets/models/dead-tree.glb
          grep -a -q 'broken_splinter_wood_combined' halloween-radio/games/witch-ride-3d/assets/models/haunted-fence.glb
          grep -a -q 'pumpkin_lobe_combined' halloween-radio/games/witch-ride-3d/assets/models/jack-o-lantern.glb
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-albedo.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-normal.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-gloss.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-puddles.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/shoulder-mud-albedo.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/shoulder-mud-normal.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/fog-sheet.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/cinematic-backdrop.jpg
          grep -q 'cinematic-detail-v2' halloween-radio/games/witch-ride-3d/assets/manifest.json
          grep -q 'realism-pass-v1' halloween-radio/games/witch-ride-3d/assets/realism-manifest.json
          grep -q 'witch-material-pass-v2' halloween-radio/games/witch-ride-3d/assets/witch-material-pass.json
          grep -q 'vehicle-material-pass-v3' halloween-radio/games/witch-ride-3d/assets/vehicle-material-pass.json
          grep -q 'environment-material-pass-v4' halloween-radio/games/witch-ride-3d/assets/environment-material-pass.json
          grep -q 'merged-static-material-batches' halloween-radio/games/witch-ride-3d/assets/environment-material-pass.json
      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Run atmosphere 3D renderer smoke test
        run: |
          python3 -m http.server 8000 --directory . >/tmp/wr3d-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--mute-audio','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/halloween-radio/games/witch-ride-3d/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.WitchRide3D?.ready&&document.body.classList.contains('ready'),{timeout:30000});
            await page.waitForFunction(()=>window.WitchRide3D?.atmospherePass==='atmosphere-pass-v5'&&document.body.classList.contains('atmosphere-pass-ready'),{timeout:30000});
            const before=await page.evaluate(()=>({canvas:!!document.querySelector('canvas'),title:document.querySelector('#title').classList.contains('open'),engine:window.WitchRide3D.engine,assetMode:window.WitchRide3D.assetMode,detailMode:window.WitchRide3D.detailMode,realismPass:window.WitchRide3D.realismPass,materialPass:window.WitchRide3D.materialPass,vehiclePass:window.WitchRide3D.vehiclePass,environmentPass:window.WitchRide3D.environmentPass,environmentDetail:window.WitchRide3D.environmentDetail,atmospherePass:window.WitchRide3D.atmospherePass,atmosphereDetail:window.WitchRide3D.atmosphereDetail}));
            if(!before.canvas||!before.title||before.engine!=='PlayCanvas')throw new Error('3D boot failed '+JSON.stringify(before));
            if(before.assetMode!=='glb-pbr')throw new Error('Production GLB/PBR assets did not fully load '+JSON.stringify(before));
            if(before.detailMode!=='cinematic-detail-v2'||before.realismPass!=='realism-pass-v1'||before.materialPass!=='witch-material-pass-v2'||before.vehiclePass!=='vehicle-material-pass-v3'||before.environmentPass!=='environment-material-pass-v4'||before.atmospherePass!=='atmosphere-pass-v5')throw new Error('Atmosphere pass chain did not boot '+JSON.stringify(before));
            const env=before.environmentDetail||{};if(env.segments!==9||env.roadMaterials!==9||env.shoulderMaterials!==18||env.puddles!==9)throw new Error('Environment materials missing '+JSON.stringify(env));
            const a=before.atmosphereDetail||{};const expected={groundMist:8,distanceFog:4,headlightBeams:7,headlightSpills:7,leaves:10,embers:7,roasterySmoke:5};for(const [k,v] of Object.entries(expected))if(a[k]!==v)throw new Error('Atmosphere layer count '+k+' expected '+v+' got '+a[k]+' '+JSON.stringify(a));
            if(errors.length)throw new Error('Browser errors during atmosphere boot: '+errors.join(' | '));
            await page.click('#play');
            await page.waitForFunction(()=>window.WitchRide3D?.state?.mode==='playing'&&Number((document.querySelector('#score').textContent||'0').replace(/,/g,''))>0,{timeout:3500});
            const running=await page.evaluate(()=>({score:Number((document.querySelector('#score').textContent||'0').replace(/,/g,'')),distance:document.querySelector('#distance').textContent,hud:!document.querySelector('#hud').classList.contains('hidden'),mode:window.WitchRide3D.state.mode,x:window.WitchRide3D.state.x,targetX:window.WitchRide3D.state.targetX,speed:window.WitchRide3D.state.speed}));
            if(!running.hud||running.mode!=='playing'||!(running.score>0)||!(running.speed>=1))throw new Error('3D ride did not advance '+JSON.stringify(running));
            const box=await page.$eval('#game-canvas',e=>{const r=e.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height}});
            await page.mouse.move(box.x+box.w*.84,box.y+box.h*.64);await page.mouse.down();
            await page.waitForFunction(()=>window.WitchRide3D.state.targetX>.5&&window.WitchRide3D.state.x>.03,{timeout:1800});await page.mouse.up();
            const pointerMove=await page.evaluate(()=>({mode:window.WitchRide3D.state.mode,x:window.WitchRide3D.state.x,targetX:window.WitchRide3D.state.targetX}));
            const keyStart=await page.evaluate(()=>window.WitchRide3D.state.targetX);await page.evaluate(()=>window.dispatchEvent(new KeyboardEvent('keydown',{code:'ArrowLeft',key:'ArrowLeft',bubbles:true})));await page.waitForFunction(start=>window.WitchRide3D.state.targetX<start-.15,{timeout:1800},keyStart);await page.evaluate(()=>window.dispatchEvent(new KeyboardEvent('keyup',{code:'ArrowLeft',key:'ArrowLeft',bubbles:true})));
            const keyboardMove=await page.evaluate(()=>({mode:window.WitchRide3D.state.mode,x:window.WitchRide3D.state.x,targetX:window.WitchRide3D.state.targetX}));
            await page.click('#pause');await sleep(120);const paused=await page.evaluate(()=>({mode:window.WitchRide3D.state.mode,open:document.querySelector('#paused').classList.contains('open')}));if(paused.mode!=='paused'||!paused.open)throw new Error('Pause failed '+JSON.stringify(paused));
            await page.click('#resume');await sleep(120);const resumed=await page.evaluate(()=>({mode:window.WitchRide3D.state.mode,pausedOpen:document.querySelector('#paused').classList.contains('open')}));if(resumed.mode!=='playing'||resumed.pausedOpen)throw new Error('Resume failed '+JSON.stringify(resumed));
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:10000}),page.evaluate(()=>document.querySelector('#paused .back').click())]);if(!page.url().endsWith('/halloween-radio/'))throw new Error('Back to Radio failed '+page.url());
            console.log('Witch Ride 3D atmosphere pass passed',JSON.stringify({before,running,pointerMove,keyboardMove,paused,resumed,backUrl:page.url()}));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
