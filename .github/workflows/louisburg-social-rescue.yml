name: Louisburg Local social rescue

on:
  workflow_run:
    workflows:
      - Louisburg Local public social browser
      - Louisburg Local social fast pass
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: louisburg-local-social-rescue
  cancel-in-progress: false

jobs:
  rescue-public-sources:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LL_SOCIAL_ENDPOINT: https://script.google.com/macros/s/AKfycbxw9gJBH50L_VZbgp6i_mHHnfPXAkraIqv63BA2XqWtb-XaaczXxdf89WveFkAOwV-azw/exec
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      LL_MAX_WORKERS: '60'
      LL_FORCE_SCAN: 'true'
      LL_MAX_POSTS_PER_PAGE: '8'
      TZ: America/Chicago

    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install worker dependencies
        working-directory: louisburg-local/social-browser-worker
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        run: npx playwright install --with-deps chromium

      - name: Reliability regression test
        id: reliability
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        run: node --test apps-script-fetch-retry.test.mjs

      - name: Rescue exact Facebook posts
        id: exact
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node exact-post-recovery.mjs

      - name: Rescue Facebook Relay timeline
        id: relay
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node facebook-relay-recovery.mjs

      - name: Rescue Relay lookback
        id: lookback
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node facebook-relay-lookback.mjs

      - name: Rescue USD 416 first-party feeds
        id: schools
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node school-first-party.mjs

      - name: Rescue first-party business fallbacks
        id: firstparty
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node first-party-fallback.mjs

      - name: Verify rescue health after all lanes
        if: always()
        env:
          RELIABILITY: ${{ steps.reliability.outcome }}
          EXACT: ${{ steps.exact.outcome }}
          RELAY: ${{ steps.relay.outcome }}
          LOOKBACK: ${{ steps.lookback.outcome }}
          SCHOOLS: ${{ steps.schools.outcome }}
          FIRSTPARTY: ${{ steps.firstparty.outcome }}
        run: |
          echo "reliability=$RELIABILITY exact=$EXACT relay=$RELAY lookback=$LOOKBACK schools=$SCHOOLS firstparty=$FIRSTPARTY"
          healthy=0
          for outcome in "$EXACT" "$RELAY" "$LOOKBACK" "$SCHOOLS" "$FIRSTPARTY"; do
            if [ "$outcome" = "success" ]; then healthy=$((healthy+1)); fi
          done
          if [ "$RELIABILITY" != "success" ]; then
            echo "Reliability regression test failed during rescue."
            exit 1
          fi
          if [ "$healthy" -lt 2 ]; then
            echo "Rescue did not recover enough independent lanes: $healthy"
            exit 1
          fi
          echo "Rescue healthy: $healthy independent lanes succeeded."
