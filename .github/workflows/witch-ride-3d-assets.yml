name: Witch Ride 3D Asset Build

on:
  push:
    branches:
      - witch-ride-3d-pbr
    paths:
      - halloween-radio/games/witch-ride-3d/tools/**
      - .github/workflows/witch-ride-3d-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PBR branch
        uses: actions/checkout@v4
        with:
          ref: witch-ride-3d-pbr
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset builder
        run: python -m pip install --disable-pip-version-check numpy pillow trimesh
      - name: Build GLB and PBR assets
        run: python halloween-radio/games/witch-ride-3d/tools/build_pbr_assets.py
      - name: Validate generated pack
        run: |
          test -s halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/vintage-car.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/dead-tree.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/coffee-bean.glb
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-albedo.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-normal.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-gloss.png
      - name: Commit generated production assets
        run: |
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add halloween-radio/games/witch-ride-3d/assets
          if git diff --cached --quiet; then
            echo "Asset pack already current"
          else
            git commit -m "Build Witch Ride 3D GLB and PBR asset pack"
            git push origin HEAD:witch-ride-3d-pbr
          fi
