name: Witch Ride 3D Asset Build

on:
  push:
    branches:
      - witch-ride-3d-pbr
      - witch-ride-3d-cinematic-detail
      - witch-ride-3d-realism-pass-1
      - witch-ride-3d-material-pass-2
      - witch-ride-3d-vehicle-pass-3
      - witch-ride-3d-environment-pass-4
    paths:
      - halloween-radio/games/witch-ride-3d/tools/**
      - .github/workflows/witch-ride-3d-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current 3D branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset builder
        run: python -m pip install --disable-pip-version-check numpy pillow trimesh
      - name: Build GLB and PBR assets
        run: python halloween-radio/games/witch-ride-3d/tools/build_pbr_assets.py
      - name: Build textured witch material pass
        run: |
          if [ -f halloween-radio/games/witch-ride-3d/tools/build_witch_pass2.py ]; then python halloween-radio/games/witch-ride-3d/tools/build_witch_pass2.py; fi
      - name: Build period vehicle material pass
        run: |
          if [ -f halloween-radio/games/witch-ride-3d/tools/build_vehicle_pass3.py ]; then python halloween-radio/games/witch-ride-3d/tools/build_vehicle_pass3.py; fi
      - name: Build road and environment material pass
        run: |
          if [ -f halloween-radio/games/witch-ride-3d/tools/build_environment_pass4.py ]; then python halloween-radio/games/witch-ride-3d/tools/build_environment_pass4.py; fi
      - name: Build realism matte and fog assets
        run: python halloween-radio/games/witch-ride-3d/tools/build_realism_assets.py
      - name: Validate generated cinematic pack
        run: |
          test -s halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/vintage-car.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/dead-tree.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/coffee-bean.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/haunted-fence.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/jack-o-lantern.glb
          test -s halloween-radio/games/witch-ride-3d/assets/models/haunted-roastery.glb
          grep -a -q 'hair_05' halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
          grep -a -q 'cape_lining' halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
          grep -a -q 'whitewall' halloween-radio/games/witch-ride-3d/assets/models/vintage-car.glb
          grep -a -q 'jack_eye' halloween-radio/games/witch-ride-3d/assets/models/jack-o-lantern.glb
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-albedo.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-normal.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-gloss.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/asphalt-puddles.png
          test -s halloween-radio/games/witch-ride-3d/assets/textures/cinematic-backdrop.jpg
          test -s halloween-radio/games/witch-ride-3d/assets/textures/fog-sheet.png
          grep -q 'cinematic-detail-v2' halloween-radio/games/witch-ride-3d/assets/manifest.json
          grep -q 'realism-pass-v1' halloween-radio/games/witch-ride-3d/assets/realism-manifest.json
          if [ -f halloween-radio/games/witch-ride-3d/assets/witch-material-pass.json ]; then
            grep -q 'witch-material-pass-v2' halloween-radio/games/witch-ride-3d/assets/witch-material-pass.json
            grep -a -q 'coat_back_seam' halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
            test -s halloween-radio/games/witch-ride-3d/assets/textures/witch-cloth-normal.png
            test -s halloween-radio/games/witch-ride-3d/assets/textures/witch-hair-normal.png
          fi
          if [ -f halloween-radio/games/witch-ride-3d/assets/vehicle-material-pass.json ]; then
            grep -q 'vehicle-material-pass-v3' halloween-radio/games/witch-ride-3d/assets/vehicle-material-pass.json
            grep -a -q 'hood_center_ridge' halloween-radio/games/witch-ride-3d/assets/models/vintage-car.glb
            grep -a -q 'spokes_' halloween-radio/games/witch-ride-3d/assets/models/vintage-car.glb
            test -s halloween-radio/games/witch-ride-3d/assets/textures/car-paint-normal.png
            test -s halloween-radio/games/witch-ride-3d/assets/textures/car-chrome-normal.png
          fi
          if [ -f halloween-radio/games/witch-ride-3d/assets/environment-material-pass.json ]; then
            grep -q 'environment-material-pass-v4' halloween-radio/games/witch-ride-3d/assets/environment-material-pass.json
            grep -a -q 'root_flare_' halloween-radio/games/witch-ride-3d/assets/models/dead-tree.glb
            grep -a -q 'broken_splinter' halloween-radio/games/witch-ride-3d/assets/models/haunted-fence.glb
            grep -a -q 'pumpkin_lobe_' halloween-radio/games/witch-ride-3d/assets/models/jack-o-lantern.glb
            test -s halloween-radio/games/witch-ride-3d/assets/textures/shoulder-mud-albedo.png
            test -s halloween-radio/games/witch-ride-3d/assets/textures/shoulder-mud-normal.png
            test -s halloween-radio/games/witch-ride-3d/assets/textures/dead-bark-normal.png
            test -s halloween-radio/games/witch-ride-3d/assets/textures/fence-wood-normal.png
            test -s halloween-radio/games/witch-ride-3d/assets/textures/pumpkin-skin-normal.png
          fi
      - name: Commit generated production assets
        run: |
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add halloween-radio/games/witch-ride-3d/assets
          if git diff --cached --quiet; then echo "Asset pack already current"; else git commit -m "Build Witch Ride 3D production material assets" && git push origin HEAD:${{ github.ref_name }}; fi
