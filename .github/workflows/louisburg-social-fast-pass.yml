name: Louisburg Local social fast pass

on:
  push:
    branches:
      - main
    paths:
      - 'louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs'
      - 'louisburg-local/social-browser-worker/apps-script-fetch-retry.test.mjs'
      - 'louisburg-local/social-browser-worker/package.json'
      - '.github/workflows/louisburg-social-fast-pass.yml'
  workflow_dispatch:
  schedule:
    # Full public-browser scan runs at :27. These recovery passes fill
    # gaps between full scans and also provide a fast verification lane
    # for newly approved exact-source workers and post-deployment verification.
    - cron: '7,47 * * * *'

permissions:
  contents: read

concurrency:
  group: louisburg-local-social-fast-pass
  cancel-in-progress: false

jobs:
  fast-public-source-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      LL_SOCIAL_ENDPOINT: https://script.google.com/macros/s/AKfycbxw9gJBH50L_VZbgp6i_mHHnfPXAkraIqv63BA2XqWtb-XaaczXxdf89WveFkAOwV-azw/exec
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      LL_MAX_WORKERS: '60'
      LL_FORCE_SCAN: 'true'
      LL_MAX_POSTS_PER_PAGE: '8'
      TZ: America/Chicago

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install worker dependencies
        working-directory: louisburg-local/social-browser-worker
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        id: chromium
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        run: npx playwright install --with-deps chromium

      - name: Fast reliability classifier smoke test
        id: reliability
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        run: node --test apps-script-fetch-retry.test.mjs

      - name: Recover configured exact public Facebook posts
        id: exact
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node exact-post-recovery.mjs

      - name: Recover signed-out public Facebook Relay timeline
        id: relay
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node facebook-relay-recovery.mjs

      - name: Recover alternate Relay shapes and lookback
        id: lookback
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node facebook-relay-lookback.mjs

      - name: Scan rendered USD 416 first-party school feeds
        id: schools
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node school-first-party.mjs

      - name: Run verified first-party business fallbacks
        id: firstparty
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node first-party-fallback.mjs

      - name: Probe deployed cross-source semantic dedupe
        id: semantic_probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          payload=$(cat <<'JSON'
          {
            "action":"social_intake",
            "organization":"Captain Cook's Treasure Chest",
            "platform":"WEBSITE",
            "profileUrl":"https://www.captaincookstreasurechest.com/",
            "postUrl":"https://www.captaincookstreasurechest.com/",
            "postId":"LL-SEMANTIC-DEPLOY-PROBE-20260917",
            "postDate":"2026-09-17T20:30:00-05:00",
            "postText":"Fall Outdoor Flea Market at Captain Cook's Treasure Chest is Saturday, October 10, 2026 from 9:00 AM to 2:00 PM.",
            "activityType":"Event / Activity",
            "louisburgMatch":"VERIFIED"
          }
          JSON
          )
          response=$(curl --fail-with-body --silent --show-error --location \\
            -H 'Content-Type: application/json' \\
            --data "$(node -e 'const p=JSON.parse(process.argv[1]);p.ingestKey=process.env.LL_SOCIAL_INGEST_KEY;process.stdout.write(JSON.stringify(p));' "$payload")" \\
            "$LL_SOCIAL_ENDPOINT")
          echo "$response"
          node -e 'const r=JSON.parse(process.argv[1]); if(!r.ok||!r.received) process.exit(1)' "$response"

      - name: Verify fast-pass health after all recovery lanes
        if: always()
        env:
          RELIABILITY: ${{ steps.reliability.outcome }}
          EXACT: ${{ steps.exact.outcome }}
          RELAY: ${{ steps.relay.outcome }}
          LOOKBACK: ${{ steps.lookback.outcome }}
          SCHOOLS: ${{ steps.schools.outcome }}
          FIRSTPARTY: ${{ steps.firstparty.outcome }}
        run: |
          echo "reliability=$RELIABILITY exact=$EXACT relay=$RELAY lookback=$LOOKBACK schools=$SCHOOLS firstparty=$FIRSTPARTY"
          healthy=0
          for outcome in "$EXACT" "$RELAY" "$LOOKBACK" "$SCHOOLS" "$FIRSTPARTY"; do
            if [ "$outcome" = "success" ]; then healthy=$((healthy+1)); fi
          done
          if [ "$RELIABILITY" != "success" ]; then
            echo "Reliability regression test failed. Recovery lanes still ran, but the job is unhealthy."
            exit 1
          fi
          if [ "$healthy" -lt 2 ]; then
            echo "Too few independent recovery lanes succeeded: $healthy"
            exit 1
          fi
          echo "Fast pass healthy: $healthy independent recovery lanes succeeded."
