name: Louisburg Local social fast pass

on:
  push:
    branches:
      - main
    paths:
      - 'louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs'
      - 'louisburg-local/social-browser-worker/apps-script-fetch-retry.test.mjs'
      - 'louisburg-local/social-browser-worker/package.json'
      - '.github/workflows/louisburg-social-fast-pass.yml'
  workflow_dispatch:
  schedule:
    # HIGH-priority public social recovery runs every 10 minutes.
    # The full public-browser scan remains hourly and covers the complete roster.
    # Duplicate fingerprints prevent already-published posts from creating repeat cards.
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: louisburg-local-social-fast-pass
  cancel-in-progress: false

jobs:
  fast-public-source-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LL_SOCIAL_ENDPOINT: https://script.google.com/macros/s/AKfycbxw9gJBH50L_VZbgp6i_mHHnfPXAkraIqv63BA2XqWtb-XaaczXxdf89WveFkAOwV-azw/exec
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      LL_MAX_WORKERS: '30'
      LL_FORCE_SCAN: 'true'
      LL_PRIORITY_FILTER: 'HIGH'
      LL_MAX_POSTS_PER_PAGE: '8'
      TZ: America/Chicago

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install worker dependencies
        working-directory: louisburg-local/social-browser-worker
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        id: chromium
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        run: npx playwright install --with-deps chromium

      - name: Fast reliability classifier smoke test
        id: reliability
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        run: node --test apps-script-fetch-retry.test.mjs


      - name: Recover signed-out public Facebook Relay timeline
        id: relay
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node facebook-relay-recovery.mjs

      - name: Recover alternate Relay shapes and lookback
        id: lookback
        continue-on-error: true
        working-directory: louisburg-local/social-browser-worker
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/louisburg-local/social-browser-worker/apps-script-fetch-retry.mjs
        run: node facebook-relay-lookback.mjs



      - name: Verify fast-pass health after all recovery lanes
        if: always()
        env:
          RELIABILITY: ${{ steps.reliability.outcome }}
          RELAY: ${{ steps.relay.outcome }}
          LOOKBACK: ${{ steps.lookback.outcome }}
        run: |
          echo "reliability=$RELIABILITY relay=$RELAY lookback=$LOOKBACK"
          healthy=0
          for outcome in "$RELAY" "$LOOKBACK"; do
            if [ "$outcome" = "success" ]; then healthy=$((healthy+1)); fi
          done
          if [ "$RELIABILITY" != "success" ]; then
            echo "Reliability regression test failed. Recovery lanes still ran, but the job is unhealthy."
            exit 1
          fi
          if [ "$healthy" -lt 1 ]; then
            echo "Too few independent recovery lanes succeeded: $healthy"
            exit 1
          fi
          echo "High-priority fast pass healthy: $healthy social recovery lanes succeeded."
