name: Louisburg Local Wildcats schedule

on:
  push:
    branches:
      - main
    paths:
      - 'louisburg-local/wildcats-schedule-worker/**'
      - '.github/workflows/louisburg-wildcats-schedule.yml'
  workflow_dispatch:
  schedule:
    - cron: '13 11,20 * * *'

permissions:
  contents: write

concurrency:
  group: louisburg-local-wildcats-schedule
  cancel-in-progress: true

jobs:
  scan-official-wildcats-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LL_SOCIAL_ENDPOINT: https://script.google.com/macros/s/AKfycbxw9gJBH50L_VZbgp6i_mHHnfPXAkraIqv63BA2XqWtb-XaaczXxdf89WveFkAOwV-azw/exec
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      TZ: America/Chicago
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install worker dependencies
        working-directory: louisburg-local/wildcats-schedule-worker
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: louisburg-local/wildcats-schedule-worker
        run: npx playwright install --with-deps chromium

      - name: Test schedule parser
        working-directory: louisburg-local/wildcats-schedule-worker
        run: npm test

      - name: Resolve Louisburg in ArbiterLive
        working-directory: louisburg-local/wildcats-schedule-worker
        run: node arbiter-discovery.mjs

      - name: Scan official Louisburg Wildcats calendar
        working-directory: louisburg-local/wildcats-schedule-worker
        run: npm start

      - name: Publish Wildcat Territory schedule snapshot
        run: |
          if [ -z "$(git status --porcelain -- louisburg-local/web-v4/wildcats-schedule.json)" ]; then
            echo "Wildcats schedule snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add louisburg-local/web-v4/wildcats-schedule.json
          git commit -m "Update Wildcats schedule snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Wildcats schedule snapshot published."
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Unable to publish Wildcats schedule snapshot after 3 rebased attempts."
          exit 1
