name: Louisburg WoolWorks Image Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'louisburg-local/social-browser-worker/run-markers/woolworks-image-production-trigger.txt'

permissions:
  contents: read

concurrency:
  group: louisburg-woolworks-image-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: louisburg-local/social-browser-worker
    env:
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Publish verified WoolWorks flyer classes
        run: node image-production-woolworks-publish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woolworks-image-live-publish-results
          path: louisburg-local/social-browser-worker/woolworks-image-publish-results.json
          if-no-files-found: warn
          retention-days: 7
