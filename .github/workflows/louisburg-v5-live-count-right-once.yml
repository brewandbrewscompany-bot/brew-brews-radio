name: Louisburg V5 live count right once

on:
  push:
    paths:
      - '.github/workflows/louisburg-v5-live-count-right-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move live count to far right
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('louisburg-local/web-v5/index.html')
          s=p.read_text()
          replacements = {
            "h.style.setProperty('flex','0 1 auto','important');": "h.style.setProperty('flex','1 1 auto','important');",
            "bar.style.setProperty('justify-content','flex-start','important');": "bar.style.setProperty('justify-content','space-between','important');",
            "bar.style.setProperty('gap','6px','important');": "bar.style.setProperty('gap','18px','important');",
            "status.style.setProperty('margin-left','0','important');": "status.style.setProperty('margin-left','auto','important');",
            "status.style.setProperty('margin-right','auto','important');": "status.style.setProperty('margin-right','0','important');",
            "status.style.setProperty('text-align','left','important');": "status.style.setProperty('text-align','right','important');",
            "const avail=Math.max(0,bar.clientWidth-status.getBoundingClientRect().width-12);let size=max;": "const avail=Math.max(0,bar.clientWidth-status.getBoundingClientRect().width-24);let size=max;"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('missing marker: '+old)
              s=s.replace(old,new,1)
          for marker in [
              "justify-content','space-between",
              "margin-left','auto",
              "text-align','right",
              "gap','18px"
          ]:
              if marker not in s:
                  raise SystemExit('missing result marker: '+marker)
          p.write_text(s)
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('louisburg-local/web-v5/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/v5.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/v5.js

      - name: Commit V5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add louisburg-local/web-v5/index.html
          git commit -m "Move V5 live count to far right" || exit 0
          git push
