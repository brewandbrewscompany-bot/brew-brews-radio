name: Regular Radio Final Website Ready

on:
  push:
    branches: [regular-radio-final-website-ready-pass]
    paths:
      - 'index.html'
      - 'style.css'
      - 'player.js'
      - 'playlist.js'
      - 'manifest.json'
      - 'service-worker.js'
      - '*.mp3'
      - '.github/workflows/regular-radio-final-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-regular-radio-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Isolation and source preservation
        shell: bash
        run: |
          git fetch origin main regular-radio-stabilization-pass-1 regular-radio-final-website-ready-pass
          SOURCE=2d19f9aee83d264f376f9985c94639ea8f7552a1
          git merge-base --is-ancestor "$SOURCE" HEAD
          ! git diff --name-only "$SOURCE" HEAD | grep -Eq '^(halloween-radio|christmas-radio|louisburg-local)/'
          ! git diff --name-only "$SOURCE" HEAD | grep -Eq '^halloween-radio/'
          git diff --name-only "$SOURCE" HEAD

      - name: Static production checks
        shell: bash
        run: |
          node --check player.js
          node --check playlist.js
          node --check service-worker.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),crypto=require('crypto');
          const sandbox={window:{}};vm.createContext(sandbox);vm.runInContext(fs.readFileSync('playlist.js','utf8'),sandbox);
          const tracks=sandbox.window.BB_PLAYLIST;const assert=(v,m)=>{if(!v)throw new Error(m)};
          assert(Array.isArray(tracks)&&tracks.length===18,`expected 18 tracks, got ${tracks?.length}`);
          const ids=new Set(),files=new Set();
          for(const t of tracks){assert(t.id&&t.title&&t.audio,`incomplete track ${JSON.stringify(t)}`);assert(!ids.has(t.id),`duplicate id ${t.id}`);ids.add(t.id);assert(!files.has(t.audio),`duplicate audio path ${t.audio}`);files.add(t.audio);assert(fs.existsSync(t.audio),`missing ${t.audio}`)}
          const rootMp3=fs.readdirSync('.').filter(x=>x.toLowerCase().endsWith('.mp3')).sort();
          const listed=[...files].sort();assert(JSON.stringify(rootMp3)===JSON.stringify(listed),`unexplained/missing root MP3s\nroot=${rootMp3}\nplaylist=${listed}`);
          const html=fs.readFileSync('index.html','utf8');const js=fs.readFileSync('player.js','utf8');
          assert((html.match(/class="tuner__needle"/g)||[]).length===1,'must have exactly one tuner needle');
          assert(!/baked-needle|hotspot|Witching Hour|Dead Air|Graveyard/i.test(html+js),'seasonal/hotspot regression detected');
          assert(html.includes('preload="none"'),'audio must stream with preload none');
          assert(js.includes('playbackIntent:false'),'explicit playback intent state missing');
          assert(js.includes("if(!state.playbackIntent){audio.pause();return}"),'playback safety listener missing');
          assert(html.includes('COFFEE ROASTERY'),'roastery positioning missing');
          NODE

      - name: Full audio integrity audit
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          node <<'NODE' > /tmp/regular-audio-files.txt
          const fs=require('fs'),vm=require('vm');const s={window:{}};vm.createContext(s);vm.runInContext(fs.readFileSync('playlist.js','utf8'),s);for(const t of s.window.BB_PLAYLIST) console.log(t.audio)
          NODE
          : > regular-radio-audio-audit.tsv
          printf 'file\tcodec\tduration_seconds\tbytes\tsha256\n' >> regular-radio-audio-audit.tsv
          while IFS= read -r f; do
            ffmpeg -nostdin -hide_banner -v error -xerror -i "$f" -f null -
            codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$f")
            duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")
            bytes=$(stat -c%s "$f")
            hash=$(sha256sum "$f"|awk '{print $1}')
            test "$codec" = mp3
            awk -v d="$duration" 'BEGIN{exit !(d>10)}'
            printf '%s\t%s\t%s\t%s\t%s\n' "$f" "$codec" "$duration" "$bytes" "$hash" >> regular-radio-audio-audit.tsv
          done < /tmp/regular-audio-files.txt
          test "$(tail -n +2 regular-radio-audio-audit.tsv|wc -l)" -eq 18
          dupes=$(tail -n +2 regular-radio-audio-audit.tsv|cut -f5|sort|uniq -d); test -z "$dupes"
          cat regular-radio-audio-audit.tsv

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser functional and visual gate
        shell: bash
        run: |
          mkdir -p regular-radio-proof
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/radio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');const assert=require('assert');
          (async()=>{const browser=await chromium.launch({headless:true,args:['--mute-audio']});
          for(const vp of [{name:'mobile-430x932',width:430,height:932},{name:'desktop-1280x900',width:1280,height:900}]){
            const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});const errors=[],requests=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('request',r=>requests.push(r.url()));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            const dims=await page.evaluate(()=>({w:innerWidth,scroll:document.documentElement.scrollWidth,h:innerHeight,bodyH:document.body.scrollHeight}));assert(dims.scroll<=dims.w+2,`horizontal overflow ${vp.name}`);
            assert.strictEqual(await page.locator('[data-testid="tuner-needle"]').count(),1,'needle count');
            assert.strictEqual(await page.locator('#audio').getAttribute('preload'),'none','audio preload');
            assert((await page.locator('#audio').evaluate(a=>a.paused)),'autoplayed');
            await page.locator('#nextBtn').click();assert((await page.locator('#audio').evaluate(a=>a.paused)),'NEXT started while paused');
            await page.locator('#prevBtn').click();assert((await page.locator('#audio').evaluate(a=>a.paused)),'PREV started while paused');
            await page.locator('#volumeRange').evaluate(e=>{e.value=.35;e.dispatchEvent(new Event('input',{bubbles:true}))});assert((await page.locator('#audio').evaluate(a=>a.paused)),'volume started audio');
            await page.locator('#tuneRange').evaluate(e=>{e.value=99.5;e.dispatchEvent(new Event('input',{bubbles:true}))});assert((await page.locator('#audio').evaluate(a=>a.paused)),'tuning started audio');assert.strictEqual(await page.locator('#frequencyValue').textContent(),'99.5 FM');
            await page.locator('#tunerRange').evaluate(e=>{e.value=103.1;e.dispatchEvent(new Event('input',{bubbles:true}))});assert((await page.locator('#audio').evaluate(a=>a.paused)),'tuner glass started audio');
            await page.locator('#playBtn').click();await page.waitForFunction(()=>!document.querySelector('#audio').paused);assert.strictEqual(await page.evaluate(()=>window.__BB_RADIO__.state.playbackIntent),true);
            await page.locator('#playBtn').click();await page.waitForFunction(()=>document.querySelector('#audio').paused);assert.strictEqual(await page.evaluate(()=>window.__BB_RADIO__.state.playbackIntent),false);
            await page.locator('#audio').evaluate(a=>a.dispatchEvent(new Event('play')));await page.waitForTimeout(50);assert((await page.locator('#audio').evaluate(a=>a.paused)),'safety listener failed');
            assert(!requests.some(u=>/\.png($|\?)/i.test(u)&&!/icon-/i.test(u)),'cover art loaded during initial radio shell');
            assert.deepStrictEqual(errors.filter(x=>!x.includes('favicon')),[],'browser errors');
            await page.screenshot({path:`regular-radio-proof/${vp.name}.png`,fullPage:true});await page.close();
          }
          await browser.close();console.log('REGULAR_RADIO_FINAL_GATE_PASS')})().catch(e=>{console.error(e);process.exit(1)})
          NODE

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regular-radio-final-proof
          if-no-files-found: error
          path: |
            regular-radio-proof/
            regular-radio-audio-audit.tsv
