name: Louisburg Facebook seed recovery patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/louisburg-facebook-seed-recovery-patch.yml'

permissions:
  contents: write

jobs:
  patch-seed-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add exact-post seed recovery support
        run: |
          python - <<'PY'
          from pathlib import Path

          worker=Path('louisburg-local/social-browser-worker/worker-v2.mjs')
          s=worker.read_text()

          if 'export function facebookSeedPost(notes)' not in s:
              marker="""export function shouldScanWorker(worker,now=new Date(),force=false){
            if(force||String(worker.scanMode||'').toUpperCase()!=='BROWSER_PUBLIC_PREVIEW')return true;
            const d=new Date(String(worker.lastScanAtIso||worker.lastScanAt||''));if(Number.isNaN(d.getTime()))return true;
            const interval=/DAILY/i.test(String(worker.scanFrequency||''))?20*3600000:45*60000;return now-d>=interval;
          }
          """
              marker='\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines())+'\n'
              addition=marker+"""
          export function facebookSeedPost(notes){
            const value=(String(notes||'').match(/(?:^|\\s)FACEBOOK_SEED_POST=(https?:\\/\\/\\S+)/i)||[])[1]||'';
            return canonicalPostUrl(value);
          }
          """
              addition='\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())+'\n'
              if marker not in s: raise SystemExit('shouldScanWorker target not found')
              s=s.replace(marker,addition,1)

          if 'PUBLIC SEED CONTENT OPENED' not in s:
              needle="  try{\n    for(const candidate of publicFacebookPageCandidates(worker.profileUrl)){"
              replacement="""  try{
            const seed=facebookSeedPost(worker.notes);
            if(seed){
              const captured=await extractContentLink(context,seed,worker,now);
              if(!captured.skip)return {result:'PUBLIC SEED CONTENT OPENED; captured=1',posts:[captured]};
            }
            for(const candidate of publicFacebookPageCandidates(worker.profileUrl)){"""
              replacement='\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
              if needle not in s: raise SystemExit('scanWorker target not found')
              s=s.replace(needle,replacement,1)

          worker.write_text(s)

          test=Path('louisburg-local/social-browser-worker/worker-v2.test.mjs')
          t=test.read_text()
          old="import {canonicalPostUrl,facebookPostBelongsToProfile,findFacebookDateLabel,parseFacebookDateLabel,publicFacebookPageCandidates} from './worker-v2.mjs';"
          new="import {canonicalPostUrl,facebookPostBelongsToProfile,facebookSeedPost,findFacebookDateLabel,parseFacebookDateLabel,publicFacebookPageCandidates} from './worker-v2.mjs';"
          if old in t: t=t.replace(old,new,1)
          if "exact Facebook seed post is read from worker notes" not in t:
              t += """

          test('exact Facebook seed post is read from worker notes',()=>{
            const notes='FIRST_PARTY_MODE=AUTO_CURRENT FACEBOOK_SEED_POST=https://www.facebook.com/100063646776157/posts/pfbidExample/';
            assert.equal(facebookSeedPost(notes),'https://www.facebook.com/100063646776157/posts/pfbidExample');
          });
          """
          test.write_text(t)
          PY
          cd louisburg-local/social-browser-worker
          npm test
          git diff --check
          cd ../..
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add louisburg-local/social-browser-worker/worker-v2.mjs louisburg-local/social-browser-worker/worker-v2.test.mjs
          git commit -m 'Support exact Facebook seed post recovery'
          git push
