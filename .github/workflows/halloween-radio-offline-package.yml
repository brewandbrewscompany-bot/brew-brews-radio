name: Halloween Radio Offline Package

on:
  push:
    branches: [main]
    paths:
      - 'halloween-radio/**'
      - '.github/workflows/halloween-radio-offline-package.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build offline package
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          src = Path('halloween-radio')
          out = Path('offline-radio')
          if out.exists():
              shutil.rmtree(out)

          (out/'assets/css').mkdir(parents=True)
          (out/'assets/js').mkdir(parents=True)
          (out/'artwork').mkdir(parents=True)

          shutil.copy2(src/'index.html', out/'index.html')
          shutil.copy2(src/'assets/css/skin-radio.css', out/'assets/css/skin-radio.css')
          shutil.copy2(src/'artwork/desktop-skin.webp', out/'artwork/desktop-skin.webp')
          shutil.copy2(src/'artwork/phone-skin.webp', out/'artwork/phone-skin.webp')
          shutil.copytree(src/'audio', out/'audio')

          js = (src/'assets/js/skin-radio.js').read_text(encoding='utf-8')
          live_audio = 'https://brewandbrewscompany-bot.github.io/brew-brews-radio/halloween-radio/audio/'
          js = js.replace(live_audio, 'audio/')
          start = "function trackUrl(file){const liveBase='https://brewandbrewscompany-bot.github.io/brew-brews-radio/halloween-radio/';return location.protocol==='file:'&&!/^https?:/i.test(file)?liveBase+file:file}"
          js = js.replace(start, 'function trackUrl(file){return file}')
          (out/'assets/js/skin-radio.js').write_text(js, encoding='utf-8')

          (out/'README.txt').write_text(
              'Brew & Brews Halloween Radio — offline package\n'
              'Unzip the entire folder, then open index.html in Chrome or Edge.\n'
              'The approved desktop/phone skins and all 34 rotation tracks are included.\n'
              'Playback still begins silent; press Play to start the radio.\n',
              encoding='utf-8'
          )
          PY

      - name: Verify package
        run: |
          test -s offline-radio/index.html
          test -s offline-radio/assets/css/skin-radio.css
          test -s offline-radio/assets/js/skin-radio.js
          test -s offline-radio/artwork/desktop-skin.webp
          test -s offline-radio/artwork/phone-skin.webp
          test -s offline-radio/audio/ironclad.mp3
          python - <<'PY'
          from pathlib import Path
          import json, re

          src = Path('halloween-radio')
          out = Path('offline-radio')
          manifest = json.loads((src/'data/tracks.json').read_text(encoding='utf-8'))
          assert len(manifest['tracks']) == 34
          missing = [t['file'] for t in manifest['tracks'] if not (out/t['file']).is_file()]
          assert not missing, f'Missing packaged tracks: {missing}'

          html = (out/'index.html').read_text(encoding='utf-8')
          js = (out/'assets/js/skin-radio.js').read_text(encoding='utf-8')
          css = (out/'assets/css/skin-radio.css').read_text(encoding='utf-8')
          assert 'assets/css/skin-radio.css' in html
          assert 'assets/js/skin-radio.js' in html
          assert 'desktop-skin.webp' in css and 'phone-skin.webp' in css
          assert 'github.io/brew-brews-radio/halloween-radio/audio/' not in js
          assert "function trackUrl(file){return file}" in js
          assert len(re.findall(r"file:'audio/[^']+\.mp3'", js)) == 34
          assert html.count('class="overlay tuner-needle"') == 2
          print('Offline skin package verified: 34 tracks, two responsive skins, no remote audio dependency.')
          PY

      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: Brew-Brews-Halloween-Radio-Offline
          path: offline-radio/
          compression-level: 0
          retention-days: 7
