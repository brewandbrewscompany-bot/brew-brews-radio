name: Louisburg Social Intake hardening once

on:
  push:
    paths:
      - '.github/workflows/louisburg-social-intake-hardening-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-social-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply validated SocialIntake hardening
        run: python louisburg-local/tools/harden_social_intake_once.py

      - name: Syntax check Apps Script as JavaScript
        run: |
          cp louisburg-local/collector-v1/SocialIntake.gs /tmp/SocialIntake.js
          node --check /tmp/SocialIntake.js

      - name: Verify critical hardening markers
        run: |
          grep -q "function processSocialPostIntakeUnlocked_" louisburg-local/collector-v1/SocialIntake.gs
          grep -q "function attemptImmediateSocialProcess_" louisburg-local/collector-v1/SocialIntake.gs
          grep -q "free coffee current offering" louisburg-local/collector-v1/SocialIntake.gs
          grep -q "ERROR - RETRY PENDING" louisburg-local/collector-v1/SocialIntake.gs

      - name: Commit hardened SocialIntake
        run: |
          if git diff --quiet -- louisburg-local/collector-v1/SocialIntake.gs; then
            echo "No SocialIntake changes needed."
            exit 0
          fi
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add louisburg-local/collector-v1/SocialIntake.gs
          git commit -m "Harden Louisburg social intake publishing"
          git push origin HEAD:main
