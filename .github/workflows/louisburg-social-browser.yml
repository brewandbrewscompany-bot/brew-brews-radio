name: Louisburg Local public social browser

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: read

concurrency:
  group: louisburg-local-public-social-browser
  cancel-in-progress: false

jobs:
  scan-public-facebook-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LL_SOCIAL_ENDPOINT: https://script.google.com/macros/s/AKfycbxw9gJBH50L_VZbgp6i_mHHnfPXAkraIqv63BA2XqWtb-XaaczXxdf89WveFkAOwV-azw/exec
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      LL_MAX_WORKERS: '25'
      LL_FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      LL_MAX_POSTS_PER_PAGE: ${{ github.event_name == 'workflow_dispatch' && '5' || '2' }}
      TZ: America/Chicago
    steps:
      - name: Check out the existing project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the browser worker
        working-directory: louisburg-local/social-browser-worker
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: louisburg-local/social-browser-worker
        run: npx playwright install --with-deps chromium

      - name: Test Facebook extraction rules
        working-directory: louisburg-local/social-browser-worker
        run: npm test

      - name: Test first-party fallback rules
        working-directory: louisburg-local/social-browser-worker
        run: node --test first-party-fallback.test.mjs

      - name: Scan public Facebook Pages
        working-directory: louisburg-local/social-browser-worker
        run: npm start

      - name: Scan verified first-party fallbacks
        working-directory: louisburg-local/social-browser-worker
        run: node first-party-fallback.mjs
