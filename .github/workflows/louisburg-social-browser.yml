name: Louisburg Local public social browser

on:
  push:
    branches:
      - main
    paths:
      - 'louisburg-local/social-browser-worker/**'
      - '.github/workflows/louisburg-social-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: read

concurrency:
  group: louisburg-local-public-social-browser
  cancel-in-progress: true

jobs:
  scan-public-facebook-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LL_SOCIAL_ENDPOINT: https://script.google.com/macros/s/AKfycbxw9gJBH50L_VZbgp6i_mHHnfPXAkraIqv63BA2XqWtb-XaaczXxdf89WveFkAOwV-azw/exec
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      LL_MAX_WORKERS: '25'
      LL_FORCE_SCAN: 'true'
      LL_MAX_POSTS_PER_PAGE: '8'
      TZ: America/Chicago
    steps:
      - name: Check out the existing project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the browser worker
        working-directory: louisburg-local/social-browser-worker
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: louisburg-local/social-browser-worker
        run: npx playwright install --with-deps chromium

      - name: Test extraction rules
        working-directory: louisburg-local/social-browser-worker
        run: npm test

      - name: Recover configured exact public Facebook posts
        working-directory: louisburg-local/social-browser-worker
        run: node exact-post-recovery.mjs

      - name: Scan public Facebook Pages
        working-directory: louisburg-local/social-browser-worker
        run: npm start

      - name: Run verified first-party fallbacks
        working-directory: louisburg-local/social-browser-worker
        run: node first-party-fallback.mjs

      - name: Scan rendered USD 416 first-party school feeds
        working-directory: louisburg-local/social-browser-worker
        run: node school-first-party.mjs
