name: Christmas Radio Phase 7 Reconstruct Approved JPEG

on:
  push:
    branches:
      - christmas-radio-phase-7-visual-phone-polish
    paths:
      - .github/workflows/christmas-radio-phase-7-reconstruct-jpeg.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Phase 7
        uses: actions/checkout@v4
        with:
          ref: christmas-radio-phase-7-visual-phone-polish

      - name: Reconstruct and verify approved artwork
        run: |
          cat \
            christmas-radio/artwork/.phase7-jpg25-b64/part-01.txt \
            christmas-radio/artwork/.phase7-jpg25-b64/part-02.txt \
            christmas-radio/artwork/.phase7-jpg25-b64/part-03.txt \
            christmas-radio/artwork/.phase7-jpg25-b64/part-04.txt \
            christmas-radio/artwork/.phase7-jpg25-b64/part-05a.txt \
            christmas-radio/artwork/.phase7-jpg25-b64/part-05b.txt \
            christmas-radio/artwork/.phase7-jpg25-b64/part-06.txt \
            > /tmp/phase7-stage.b64

          test "$(wc -c < /tmp/phase7-stage.b64)" -eq 52728
          base64 -d /tmp/phase7-stage.b64 > christmas-radio/artwork/flagship-roastery-stage.jpg
          test "$(wc -c < christmas-radio/artwork/flagship-roastery-stage.jpg)" -eq 39546
          echo "23869c1bf1af28c20e1f44def0605a7a7aee73a50a61d64a44e1df1479754b9d  christmas-radio/artwork/flagship-roastery-stage.jpg" | sha256sum -c -
          file christmas-radio/artwork/flagship-roastery-stage.jpg

      - name: Commit reconstructed binary
        run: |
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add christmas-radio/artwork/flagship-roastery-stage.jpg
          git commit -m "Restore approved Christmas Radio stage artwork as JPEG"
          git push origin HEAD:christmas-radio-phase-7-visual-phone-polish
