name: Louisburg Brew Facebook identity fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/louisburg-brew-facebook-id-fix.yml'

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Teach browser worker alternate numeric Page identity and exact recovery URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('louisburg-local/social-browser-worker/worker-v2.mjs')
          s=p.read_text()

          marker="export function facebookOwnerKey(url){\n"
          insert="""export function parseFacebookScanHints(notes){
            const text=String(notes||'');
            const altId=(text.match(/(?:^|\\s)FACEBOOK_ALT_ID=(\\d+)/i)||[])[1]||'';
            const exactRaw=(text.match(/(?:^|\\s)EXACT_POST_URL=(https?:\\/\\/\\S+)/i)||[])[1]||'';
            return {altId,exactPostUrl:canonicalPostUrl(exactRaw.replace(/[),.;]+$/,''))};
          }
          function workerOwnerKeys(worker){
            const keys=new Set();const primary=facebookOwnerKey(worker.profileUrl);if(primary)keys.add(primary);
            const hints=parseFacebookScanHints(worker.notes);if(hints.altId)keys.add(`id:${hints.altId}`);
            return keys;
          }
          export function facebookPostBelongsToWorker(postUrl,worker){const key=facebookOwnerKey(postUrl);return !!key&&workerOwnerKeys(worker).has(key);}

          """
          if 'export function parseFacebookScanHints(notes)' not in s:
            if marker not in s: raise SystemExit('facebookOwnerKey marker missing')
            s=s.replace(marker,insert+marker,1)

          old="const postOwner=facebookOwnerKey(canonical),profileOwner=facebookOwnerKey(worker.profileUrl);if(postOwner&&profileOwner&&postOwner!==profileOwner)return {skip:'CONTENT OWNER DOES NOT MATCH VERIFIED PAGE'};"
          new="const postOwner=facebookOwnerKey(canonical);if(postOwner&&!workerOwnerKeys(worker).has(postOwner))return {skip:'CONTENT OWNER DOES NOT MATCH VERIFIED PAGE'};"
          if old in s: s=s.replace(old,new,1)

          old="if(exact&&!facebookPostBelongsToProfile(exact,worker.profileUrl))continue;"
          new="if(exact&&!facebookPostBelongsToWorker(exact,worker))continue;"
          if old in s: s=s.replace(old,new,1)

          old="""async function scanWorker(context,worker,settings){
            const page=await context.newPage();const now=new Date();let sawLogin=false,sawAgeGate=false,sawReadable=false,pageIdentity='';
            try{
              for(const candidate of publicFacebookPageCandidates(worker.profileUrl)){
          """
          new="""async function scanWorker(context,worker,settings){
            const page=await context.newPage();const now=new Date();let sawLogin=false,sawAgeGate=false,sawReadable=false,pageIdentity='';
            try{
              const hints=parseFacebookScanHints(worker.notes);
              if(hints.exactPostUrl){
                const direct=await extractContentLink(context,hints.exactPostUrl,worker,now);
                if(!direct.skip)return {result:'EXACT PUBLIC POST RECOVERY TARGET OPENED; numeric/vanity ownership verified',posts:[direct]};
              }
              const candidates=[...publicFacebookPageCandidates(worker.profileUrl)];
              if(hints.altId){for(const c of publicFacebookPageCandidates(`https://www.facebook.com/${hints.altId}`))if(!candidates.includes(c))candidates.push(c);}
              for(const candidate of candidates){
          """
          if old not in s: raise SystemExit('scanWorker block not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('louisburg-local/social-browser-worker/worker-v2.test.mjs')
          ts=t.read_text()
          ts=ts.replace("import {canonicalPostUrl,facebookPostBelongsToProfile,findFacebookDateLabel,parseFacebookDateLabel,publicFacebookPageCandidates} from './worker-v2.mjs';","import {canonicalPostUrl,facebookPostBelongsToProfile,facebookPostBelongsToWorker,findFacebookDateLabel,parseFacebookDateLabel,parseFacebookScanHints,publicFacebookPageCandidates} from './worker-v2.mjs';")
          if "alternate numeric Page identity" not in ts:
            ts += """

test('alternate numeric Page identity accepts the same verified business post',()=>{
  const worker={profileUrl:'https://www.facebook.com/BB.Coffee.Tea',notes:'FACEBOOK_ALT_ID=100063452718081 EXACT_POST_URL=https://www.facebook.com/100063452718081/posts/pfbid123/'};
  assert.equal(parseFacebookScanHints(worker.notes).altId,'100063452718081');
  assert.equal(facebookPostBelongsToWorker('https://www.facebook.com/100063452718081/posts/pfbid123',worker),true);
  assert.equal(facebookPostBelongsToWorker('https://www.facebook.com/999999/posts/pfbid123',worker),false);
});
"""
          t.write_text(ts)
          PY
          cd louisburg-local/social-browser-worker
          node --check worker-v2.mjs
          npm install --no-audit --no-fund
          npm test
          cd ../..
          git diff --check
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add louisburg-local/social-browser-worker/worker-v2.mjs louisburg-local/social-browser-worker/worker-v2.test.mjs
          git commit -m 'Support alternate Facebook Page IDs and exact recovery posts'
          git push
