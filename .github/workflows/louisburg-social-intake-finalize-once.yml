name: Louisburg Social Intake finalize once

on:
  push:
    paths:
      - '.github/workflows/louisburg-social-intake-finalize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-social-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final concurrency and observability patch
        run: python louisburg-local/tools/finalize_social_intake_lock_once.py

      - name: Syntax check Apps Script files
        run: |
          cp louisburg-local/collector-v1/SocialIntake.gs /tmp/SocialIntake.js
          cp louisburg-local/collector-v1/WebApp.gs /tmp/WebApp.js
          node --check /tmp/SocialIntake.js
          node --check /tmp/WebApp.js

      - name: Verify final markers
        run: |
          grep -q "const ingestLock=LockService.getScriptLock" louisburg-local/collector-v1/SocialIntake.gs
          grep -q "immediateProcess:result.immediateProcess" louisburg-local/collector-v1/WebApp.gs
          grep -q "function attemptImmediateSocialProcess_" louisburg-local/collector-v1/SocialIntake.gs

      - name: Commit final intake hardening
        run: |
          if git diff --quiet -- louisburg-local/collector-v1/SocialIntake.gs louisburg-local/collector-v1/WebApp.gs; then
            echo "No final changes needed."
            exit 0
          fi
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add louisburg-local/collector-v1/SocialIntake.gs louisburg-local/collector-v1/WebApp.gs
          git commit -m "Finalize Louisburg social intake reliability"
          git push origin HEAD:main
