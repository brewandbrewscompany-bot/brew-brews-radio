name: Louisburg V5 live count left once

on:
  push:
    paths:
      - '.github/workflows/louisburg-v5-live-count-left-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tuck live count left
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('louisburg-local/web-v5/index.html')
          s=p.read_text()
          old="""  h.style.setProperty('min-width','0','important');
  h.style.setProperty('flex','1 1 auto','important');
  const max=25,min=14;h.style.setProperty('font-size',max+'px','important');"""
          new="""  h.style.setProperty('min-width','0','important');
  h.style.setProperty('flex','0 1 auto','important');
  bar.style.setProperty('justify-content','flex-start','important');
  bar.style.setProperty('gap','6px','important');
  status.style.setProperty('margin-left','0','important');
  status.style.setProperty('margin-right','auto','important');
  status.style.setProperty('text-align','left','important');
  status.style.setProperty('flex','0 0 auto','important');
  const max=25,min=14;h.style.setProperty('font-size',max+'px','important');"""
          if old not in s:
              raise SystemExit('fitHomeHeading marker missing')
          s=s.replace(old,new,1)
          for marker in [
              "h.style.setProperty('flex','0 1 auto','important')",
              "bar.style.setProperty('justify-content','flex-start','important')",
              "status.style.setProperty('text-align','left','important')"
          ]:
              if marker not in s:
                  raise SystemExit('missing '+marker)
          p.write_text(s)
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('louisburg-local/web-v5/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/v5.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/v5.js

      - name: Commit V5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add louisburg-local/web-v5/index.html
          git commit -m "Tuck V5 live listing count left" || exit 0
          git push
