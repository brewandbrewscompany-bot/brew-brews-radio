name: Louisburg V5 cleanup once

on:
  push:
    paths:
      - .github/workflows/louisburg-v5-cleanup-once.yml
      - .github/scripts/louisburg_v5_cleanup.py

permissions:
  contents: write

jobs:
  refresh-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V5 cleanup patch
        run: python .github/scripts/louisburg_v5_cleanup.py

      - name: Validate V5 script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('louisburg-local/web-v5/index.html').read_text()
          assert 'function installRefresh(x)' in s
          assert 'Happening in Louisburg' in s
          assert '#directoryQuick{display:none!important}' in s
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/v5.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/v5.js

      - name: Commit V5 website cleanup
        shell: bash
        run: |
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add louisburg-local/web-v5/index.html
          git commit -m "Clean up Louisburg Local V5 website UX" || exit 0
          git push origin HEAD:main
