name: Louisburg V5 cleanup once

on:
  push:
    paths:
      - .github/workflows/louisburg-v5-cleanup-once.yml
      - .github/scripts/louisburg_v5_cleanup.py

permissions:
  contents: write

jobs:
  refresh-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch only V5 and patch script
        shell: bash
        run: |
          mkdir -p louisburg-local/web-v5
          curl -fsSL https://raw.githubusercontent.com/brewandbrewscompany-bot/brew-brews-radio/main/louisburg-local/web-v5/index.html -o louisburg-local/web-v5/index.html
          curl -fsSL https://raw.githubusercontent.com/brewandbrewscompany-bot/brew-brews-radio/main/.github/scripts/louisburg_v5_cleanup.py -o /tmp/v5_cleanup.py

      - name: Apply V5 cleanup patch
        run: python /tmp/v5_cleanup.py

      - name: Validate V5 script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('louisburg-local/web-v5/index.html').read_text()
          assert 'function installRefresh(x)' in s
          assert 'Happening in Louisburg' in s
          assert '#directoryQuick{display:none!important}' in s
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/v5.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/v5.js

      - name: Update only V5 index on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha=$(gh api repos/${{ github.repository }}/contents/louisburg-local/web-v5/index.html --jq .sha)
          content=$(base64 -w0 louisburg-local/web-v5/index.html)
          gh api --method PUT repos/${{ github.repository }}/contents/louisburg-local/web-v5/index.html \
            -f message='Clean up Louisburg Local V5 website UX' \
            -f content="$content" \
            -f sha="$sha" >/dev/null
