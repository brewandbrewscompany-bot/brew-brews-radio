name: Christmas Radio Phase 7 Switch To Verified JPEG

on:
  push:
    branches:
      - christmas-radio-phase-7-visual-phone-polish
    paths:
      - .github/workflows/christmas-radio-phase-7-switch-jpeg.yml

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Phase 7
        uses: actions/checkout@v4
        with:
          ref: christmas-radio-phase-7-visual-phone-polish

      - name: Switch only the approved artwork delivery format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              Path('christmas-radio/assets/css/art-skin.css'),
              Path('.github/workflows/christmas-radio-phase-7-visual-probe.yml'),
          ]
          expected = {targets[0]: 2, targets[1]: 3}
          for path in targets:
              text = path.read_text()
              count = text.count('flagship-roastery-stage.webp')
              if count != expected[path]:
                  raise SystemExit(f'{path}: expected {expected[path]} WebP references, found {count}')
              path.write_text(text.replace('flagship-roastery-stage.webp','flagship-roastery-stage.jpg'))
          PY
          git diff --check
          test "$(grep -o 'flagship-roastery-stage.jpg' christmas-radio/assets/css/art-skin.css | wc -l)" -eq 2
          test "$(grep -o 'flagship-roastery-stage.jpg' .github/workflows/christmas-radio-phase-7-visual-probe.yml | wc -l)" -eq 3

      - name: Commit JPEG wiring
        run: |
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add christmas-radio/assets/css/art-skin.css .github/workflows/christmas-radio-phase-7-visual-probe.yml
          git commit -m "Use verified JPEG for Christmas Radio stage artwork"
          git push origin HEAD:christmas-radio-phase-7-visual-phone-polish
