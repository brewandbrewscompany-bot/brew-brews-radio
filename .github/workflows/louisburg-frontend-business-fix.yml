name: Louisburg frontend business visibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/louisburg-frontend-business-fix.yml'

permissions:
  contents: write

jobs:
  patch-business-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore business visibility in existing frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('louisburg-local/web-v3/index.html')
          s=p.read_text()

          s=s.replace('<button type="button" data-quick-section="TODAY">☀️ Today</button>\n        <button type="button" data-quick-cat="DEALS">🔥 Deals</button>', '<button type="button" data-quick-section="TODAY">☀️ Today</button>\n        <button type="button" data-quick-cat="BUSINESS">🏪 Local Businesses</button>\n        <button type="button" data-quick-cat="DEALS">🔥 Deals</button>')

          s=s.replace('<div class="tags" id="tags" aria-label="Activity filters">\n      <button class="tag" type="button" data-filter-cat="DEALS">🔥 Deals & Specials</button>', '<div class="tags" id="tags" aria-label="Activity filters">\n      <button class="tag" type="button" data-filter-cat="BUSINESS">🏪 Local Businesses</button>\n      <button class="tag" type="button" data-filter-cat="DEALS">🔥 Deals & Specials</button>')

          s=s.replace("['RIGHT NOW','Right Now','Active updates and things happening today.','RIGHT_NOW'],\n      ['EAT LOCAL'", "['RIGHT NOW','Right Now','Active updates and things happening today.','RIGHT_NOW'],\n      ['LOCAL BUSINESS','Local Businesses','Current specials, products, hiring and updates from Louisburg businesses.','BUSINESS'],\n      ['EAT LOCAL'")

          old="    function activityType(i){return String(i.activityType||'').trim().toLowerCase()}\n"
          new="""    function activityType(i){return String(i.activityType||'').trim().toLowerCase()}\n    function isBusinessSource(i){\n      const org=String(i.organization||'').toLowerCase();\n      const nonBusiness=/city of louisburg|louisburg recreation commission|louisburg library|usd 416|chamber of commerce|aquatic center|senior citizens|united methodist|first christian church|faith chapel|first baptist church|thechurch louisburg|american legion|lions club|rotary club|powell observatory|astronomical society|sports zone/;\n      return !nonBusiness.test(org);\n    }\n"""
          s=s.replace(old,new,1)
          s=s.replace("      if(cat==='RIGHT_NOW')return sectionMatches(i,'TODAY');\n      if(cat==='DEALS')", "      if(cat==='RIGHT_NOW')return sectionMatches(i,'TODAY');\n      if(cat==='BUSINESS')return isBusinessSource(i);\n      if(cat==='DEALS')",1)

          old_render="""    function render(){\n      const items=S.items.filter(match);\n      ui.feed.innerHTML=items.length?items.map(card).join(''):'<div class=\"empty\">Nothing current matches that view right now.</div>';\n      ui.status.textContent='live · '+S.items.filter(isFresh).length+' current items';\n    }\n"""
          new_render="""    function ensureBusinessVisibility(items){\n      if(S.section!=='ALL'||S.cat!=='ALL'||S.q||items.length<3)return items;\n      const out=items.slice();\n      let first=out.findIndex(isBusinessSource);\n      if(first>2){const [b]=out.splice(first,1);out.splice(1,0,b)}\n      const topSix=out.slice(0,6).filter(isBusinessSource).length;\n      if(topSix<2){\n        const second=out.findIndex((i,idx)=>idx>=3&&isBusinessSource(i));\n        if(second>5){const [b]=out.splice(second,1);out.splice(Math.min(4,out.length),0,b)}\n      }\n      return out;\n    }\n    function render(){\n      const filtered=S.items.filter(match);\n      const items=ensureBusinessVisibility(filtered);\n      ui.feed.innerHTML=items.length?items.map(card).join(''):'<div class=\"empty\">Nothing current matches that view right now.</div>';\n      const fresh=S.items.filter(isFresh);\n      const businesses=fresh.filter(isBusinessSource).length;\n      ui.status.textContent='live · '+fresh.length+' current · '+businesses+' business';\n    }\n"""
          if old_render not in s:
              raise SystemExit('Expected render block not found; refusing broad rewrite')
          s=s.replace(old_render,new_render,1)
          p.write_text(s)
          PY
          node --check <(python - <<'PY'
          from pathlib import Path
          import re
          s=Path('louisburg-local/web-v3/index.html').read_text()
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          print(m.group(1))
          PY
          )
          git diff --check
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add louisburg-local/web-v3/index.html
          git commit -m 'Restore local business visibility in feed'
          git push
