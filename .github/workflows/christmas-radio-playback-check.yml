name: Christmas Radio Phase 6 Playback Check

on:
  push:
    branches: [christmas-radio-phase-6-playback-validation]
    paths:
      - 'christmas-radio/**'
      - '.github/workflows/christmas-radio-playback-check.yml'
  workflow_dispatch:

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate library and source
        run: |
          node --input-type=module --check < christmas-radio/assets/js/audio-engine.js
          node --input-type=module --check < christmas-radio/assets/js/christmas-radio.js
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import hashlib, json
          root=Path('christmas-radio')
          tracks=json.loads((root/'data/tracks.json').read_text(encoding='utf-8'))
          mastering=json.loads((root/'data/mastering.json').read_text(encoding='utf-8'))
          stations=json.loads((root/'data/stations.json').read_text(encoding='utf-8'))
          rows=tracks['tracks']
          expected={'snowfall-am':4,'fireside':5,'sleigh-bell-rock':3,'candlelight':6,'bb-christmas-radio':13,'north-pole-after-hours':4}
          assert tracks['status']=='phase-5-playable-library'
          assert tracks['audioPolicy']=={'initialPreload':'none','prepareNextAfterPlaybackStarts':True,'crossfadeMs':280,'rotationMode':'curated-loop'}
          assert len(rows)==35
          assert Counter(r['stationId'] for r in rows)==Counter(expected)
          assert len(stations['stations'])==6 and stations['defaultStationId']=='bb-christmas-radio'
          masters={m['catalogId']:m for m in mastering['masters']}
          assert len(masters)==13 and {r['masterId'] for r in rows}==set(masters)
          for master in masters.values():
              path=root/'audio'/master['file']
              assert path.exists() and path.stat().st_size==master['sizeBytes'], path
              assert hashlib.sha256(path.read_bytes()).hexdigest()==master['sha256'], path
          html=(root/'index.html').read_text(encoding='utf-8')
          engine=(root/'assets/js/audio-engine.js').read_text(encoding='utf-8')
          assert 'preload="none"' in html
          assert "this.preloader.preload='none'" in engine and "this.audio.preload='none'" in engine
          print('Source gate passed: 13 masters, 35 placements, 6 stations, hashes verified.')
          PY

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Browser playback regression at 430x932
        run: |
          mkdir -p phase6-output
          python3 -m http.server 8000 --directory . >/tmp/christmas-radio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME_BIN,
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--mute-audio']
            });
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:1});

            const pageErrors=[],mp3Requests=[],httpErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('request',r=>{if(/\.mp3(?:\?|$)/i.test(r.url()))mp3Requests.push(r.url())});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});

            const started=Date.now();
            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            await page.waitForFunction(()=>document.querySelector('#frequencyLabel')?.textContent.trim()==='103.1',{timeout:10000});
            const domReadyMs=Date.now()-started;

            const audioState=()=>page.$eval('#christmasRadioAudio',a=>({
              paused:a.paused,src:a.getAttribute('src'),currentSrc:a.currentSrc,volume:a.volume,
              readyState:a.readyState,networkState:a.networkState,currentTime:a.currentTime,duration:a.duration,playbackRate:a.playbackRate
            }));
            const title=()=>page.$eval('#nowPlayingTitle',e=>e.textContent.trim());
            const freq=()=>page.$eval('#frequencyLabel',e=>e.textContent.trim());
            const tune=index=>page.$eval('#stationTuner',(el,index)=>{el.value=String(index);el.dispatchEvent(new Event('input',{bubbles:true}))},index);
            const waitTitle=t=>page.waitForFunction(t=>document.querySelector('#nowPlayingTitle')?.textContent.trim()===t,{timeout:12000},t);
            const waitAudioFile=async file=>{
              await page.waitForFunction(file=>document.querySelector('#christmasRadioAudio')?.getAttribute('src')===`audio/${file}`,{timeout:12000},file);
              await sleep(300);
              const state=await audioState();
              if(!mp3Requests.some(u=>u.includes(file)))throw new Error(`MP3 request missing for ${file}: ${JSON.stringify({state,mp3Requests})}`);
              return state;
            };
            const advanceNaturally=async nextTitle=>{
              await page.waitForFunction(()=>{const a=document.querySelector('#christmasRadioAudio');return !a.paused&&Number.isFinite(a.duration)&&a.duration>3&&a.readyState>=2},{timeout:15000});
              await page.$eval('#christmasRadioAudio',async a=>{
                a.playbackRate=16;
                a.currentTime=Math.max(0,a.duration-2);
                if(a.paused)await a.play();
              });
              await waitTitle(nextTitle);
              await page.$eval('#christmasRadioAudio',a=>{a.playbackRate=1});
            };

            let state=await audioState();
            if(!state.paused)throw new Error('Audio autoplayed on boot');
            if(Math.abs(state.volume-.8)>.02)throw new Error('First-visit volume is not 80%: '+JSON.stringify(state));
            if(mp3Requests.length)throw new Error('MP3 requested before explicit Play: '+mp3Requests.join(' | '));
            if(await title()!=='Christmas Morning on Amity')throw new Error('Wrong flagship opener: '+await title());

            const expected=[
              ['88.7','Christmas ’49'],['92.5','Lights in the Roastery'],['96.9','Christmas on the County Line'],
              ['100.3','Winter Highway Lights'],['103.1','Christmas Morning on Amity'],['106.7','Midnight Roast']
            ];
            for(let i=0;i<expected.length;i++){
              await tune(i);
              await page.waitForFunction(f=>document.querySelector('#frequencyLabel')?.textContent.trim()===f,{timeout:5000},expected[i][0]);
              await waitTitle(expected[i][1]);
              if(!(await audioState()).paused)throw new Error('Paused tuning started playback at '+expected[i][0]);
            }
            if(mp3Requests.length)throw new Error('Paused tuning requested audio: '+mp3Requests.join(' | '));

            await tune(4);await waitTitle('Christmas Morning on Amity');
            await page.click('#playButton');
            await page.waitForFunction(()=>!document.querySelector('#christmasRadioAudio').paused,{timeout:15000});
            if(await page.$eval('#signalLabel',e=>e.textContent.trim())!=='ON AIR')throw new Error('ON AIR state did not engage');
            state=await waitAudioFile('bbxmas-x04-christmas-morning-on-amity.mp3');
            if(state.paused)throw new Error('Flagship is paused after Play');

            await advanceNaturally('Lights in the Roastery');
            state=await waitAudioFile('bbxmas-m02-lights-in-the-roastery.mp3');
            if(state.paused)throw new Error('Playback stopped after natural end');
            await sleep(400);

            await tune(2);await waitTitle('Christmas on the County Line');
            state=await waitAudioFile('bbxmas-m03-christmas-on-the-county-line.mp3');
            if(state.paused||await freq()!=='96.9')throw new Error('Live station switch failed: '+JSON.stringify(state));

            await page.click('#playButton');await sleep(150);
            if(!(await audioState()).paused)throw new Error('Pause failed');
            const beforePausedTune=mp3Requests.length;
            await tune(0);await waitTitle('Christmas ’49');await sleep(250);
            if(!(await audioState()).paused)throw new Error('Paused retune restarted audio');
            if(mp3Requests.length!==beforePausedTune)throw new Error('Paused retune fetched a new MP3');

            await page.click('#playButton');
            await page.waitForFunction(()=>!document.querySelector('#christmasRadioAudio').paused,{timeout:15000});
            await waitAudioFile('bbxmas-m18-christmas-49.mp3');
            const loop=[
              ['Christmas at Our House','bbxmas-x03-christmas-at-our-house.mp3'],
              ['All Through Louisburg','bbxmas-m09-all-through-louisburg.mp3'],
              ['Snowfall Waltz','bbxmas-i01-snowfall-waltz.mp3'],
              ['Christmas ’49','bbxmas-m18-christmas-49.mp3']
            ];
            for(const [nextTitle,file] of loop){
              await advanceNaturally(nextTitle);
              state=await waitAudioFile(file);
              if(state.paused)throw new Error(`Loop stopped at ${nextTitle}`);
            }

            await page.$eval('#volumeControl',el=>{el.value='0.35';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await sleep(100);
            const beforeReloadRequests=mp3Requests.length;
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            await waitTitle('Christmas ’49');await sleep(250);
            state=await audioState();
            if(!state.paused)throw new Error('Reload restored playback intent');
            if(Math.abs(state.volume-.35)>.02)throw new Error('Saved volume did not restore: '+state.volume);
            if(mp3Requests.length!==beforeReloadRequests)throw new Error('Reload requested MP3 before Play');

            const geometry=await page.evaluate(()=>{
              const nav=document.querySelector('.bottom-nav').getBoundingClientRect();
              const play=document.querySelector('#playButton').getBoundingClientRect();
              const dial=document.querySelector('.dial-bezel').getBoundingClientRect();
              return {
                innerWidth,innerHeight,scrollWidth:document.documentElement.scrollWidth,
                nav:{left:nav.left,right:nav.right,top:nav.top,bottom:nav.bottom},
                play:{left:play.left,right:play.right,top:play.top,bottom:play.bottom,width:play.width,height:play.height},
                dial:{left:dial.left,right:dial.right,top:dial.top,bottom:dial.bottom,width:dial.width,height:dial.height}
              };
            });
            if(geometry.scrollWidth>geometry.innerWidth+2)throw new Error('Horizontal page overflow: '+JSON.stringify(geometry));
            if(geometry.nav.left<0||geometry.nav.right>geometry.innerWidth+1||geometry.nav.top<0||geometry.nav.bottom>geometry.innerHeight+1)throw new Error('Bottom nav not viewport-safe: '+JSON.stringify(geometry));
            if(geometry.play.width<44||geometry.play.height<44||geometry.play.left<0||geometry.play.right>geometry.innerWidth||geometry.play.top<0||geometry.play.bottom>geometry.innerHeight)throw new Error('Play target fails phone geometry: '+JSON.stringify(geometry));
            if(geometry.dial.width<100||geometry.dial.left<0||geometry.dial.right>geometry.innerWidth||geometry.dial.top<0||geometry.dial.bottom>geometry.innerHeight)throw new Error('Tuner fails phone geometry: '+JSON.stringify(geometry));
            if(domReadyMs>3000)throw new Error('Local DOM-ready gate exceeded 3s: '+domReadyMs+'ms');

            await page.click('.bottom-nav button[data-panel="stationsPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#stationsPanel').hidden,{timeout:3000});
            if(await page.$$eval('#stationsPanel .station-card',els=>els.length)!==6)throw new Error('Stations panel missing stations');
            await page.click('#stationsPanel .panel-close');

            const criticalHttp=httpErrors.filter(x=>!x.url.endsWith('/favicon.ico'));
            if(criticalHttp.length)throw new Error('HTTP resource errors: '+JSON.stringify(criticalHttp));
            if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '));

            await page.screenshot({path:'phase6-output/christmas-radio-430x932.png',fullPage:true});
            const report={
              status:'PASS',viewport:'430x932',domReadyMs,mp3RequestCount:mp3Requests.length,httpErrors,geometry,
              tests:['default volume','no autoplay/no MP3 prefetch','six paused station tunes','explicit Play','accelerated natural end auto-advance','live station switch','pause/retune','full natural loop wrap','volume persistence without autoplay','phone control geometry','stations panel']
            };
            fs.writeFileSync('phase6-output/report.json',JSON.stringify(report,null,2));
            console.log('CHRISTMAS PHASE 6 PLAYBACK GATE PASSED',report);
            await browser.close();
          })().catch(e=>{
            console.error(e);
            fs.writeFileSync('phase6-output/failure.txt',String(e.stack||e));
            process.exit(1);
          });
          NODE

      - name: Upload Phase 6 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-radio-phase-6-playback-evidence
          path: phase6-output/
          if-no-files-found: warn
          retention-days: 14
