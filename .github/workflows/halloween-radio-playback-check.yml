name: Halloween Radio Playback Check

on:
  push:
    branches: [main]
    paths:
      - 'halloween-radio/**'
      - '.github/workflows/halloween-radio-playback-check.yml'
  workflow_dispatch:

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        run: |
          node --check halloween-radio/assets/js/skin-radio.js
          node --check halloween-radio/assets/js/radio-enhancements.js
          node --check halloween-radio/assets/js/library-panels.js
          python - <<'PY'
          from pathlib import Path
          html=Path('halloween-radio/index.html').read_text()
          css=Path('halloween-radio/assets/css/skin-radio.css').read_text()
          js=Path('halloween-radio/assets/js/skin-radio.js').read_text()
          extra=Path('halloween-radio/assets/js/radio-enhancements.js').read_text()
          library=Path('halloween-radio/assets/js/library-panels.js').read_text()
          assert 'id="shuffleSwitch"' in html
          assert 'id="repeatSwitch"' in html
          assert 'id="schedulePanel"' in html
          assert 'id="showsPanel"' in html
          assert 'assets/js/radio-enhancements.js' in html
          assert 'assets/js/library-panels.js' in html
          assert 'assets/css/library-panels.css' in html
          assert '.desktop .play-symbol{left:48.95%' in css
          assert '.desktop [data-hit="play"]{left:48.55%' in css
          assert 'window.BBRadio={' in js
          assert js.count('state.playbackIntent=true') == 1
          assert "changeTrack(1,{announce:false})" in js
          assert "if(isFinalSignoff(t))" in js
          assert "state.repeat&&state.playbackIntent" in js
          assert "ending=base.find(t=>t.id==='the-town-goes-quiet')" in js
          assert "STORAGE_KEY='bb-halloween-radio-state-v1'" in extra
          assert 'mediaSession.setActionHandler' in extra
          assert "set('previoustrack'" in extra and "set('nexttrack'" in extra
          assert "FAVORITES_KEY='bb-halloween-radio-favorites-v1'" in library
          assert 'data-start-track' in library and 'data-play-track' in library and 'data-favorite' in library
          print('Halloween Radio playback source checks passed.')
          PY

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Browser playback and persistence regression
        run: |
          python3 -m http.server 8000 --directory . >/tmp/halloween-playback-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME_BIN,
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--mute-audio']
            });
            const page=await browser.newPage();
            await page.setViewport({width:1105,height:1024,deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/halloween-radio/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.BBRadio&&document.querySelector('.desktop [data-title]')?.textContent.trim()==='IRONCLAD',{timeout:15000});

            const audioState=()=>page.$eval('#radioAudio',a=>({paused:a.paused,volume:a.volume}));
            const title=()=>page.$eval('.desktop [data-title]',e=>e.textContent.trim());
            const toggle=id=>page.$eval(id,b=>b.click());
            const ended=()=>page.$eval('#radioAudio',a=>a.dispatchEvent(new Event('ended')));
            const station=async freq=>page.evaluate(freq=>{
              const b=[...document.querySelectorAll('.desktop .station-label')].find(x=>x.textContent.includes(freq));
              if(!b)throw new Error('Missing station '+freq);
              b.click();
            },freq);

            if(!(await audioState()).paused)throw new Error('Audio autoplayed on load');
            if(await page.$eval('#shuffleSwitch',b=>b.getAttribute('aria-pressed')!=='false'))throw new Error('Shuffle must default off');
            if(await page.$eval('#repeatSwitch',b=>b.getAttribute('aria-pressed')!=='false'))throw new Error('Repeat must default off');
            if(await page.$eval('#autoSwitch',b=>b.getAttribute('aria-pressed')==='true'))await toggle('#autoSwitch');

            // Schedule shows all frequencies and all 34 songs, and choosing START HERE stays silent.
            await page.click('.desktop [data-hit="schedule"]');
            await page.waitForSelector('#schedulePanel.open',{timeout:5000});
            await page.waitForFunction(()=>document.querySelectorAll('#schedulePanel .station-block').length===6&&document.querySelectorAll('#schedulePanel .schedule-track').length===34,{timeout:5000});
            await page.click('#schedulePanel [data-start-track="dead-of-night"]');
            await sleep(250);
            if(await title()!=='Dead of Night')throw new Error('Schedule START HERE did not select the requested song');
            if(!(await audioState()).paused)throw new Error('Schedule START HERE violated no-autoplay');
            await page.click('#schedulePanel [data-library-close]');

            // Shows stays open while playing a selected song and favorites survive a reload.
            await page.click('.desktop [data-hit="shows"]');
            await page.waitForSelector('#showsPanel.open',{timeout:5000});
            await page.click('#showsPanel [data-favorite="dead-of-night"]');
            await sleep(120);
            let favs=await page.evaluate(()=>JSON.parse(localStorage.getItem('bb-halloween-radio-favorites-v1')||'[]'));
            if(!favs.includes('dead-of-night'))throw new Error('Favorite was not saved');
            await page.click('#showsPanel [data-play-track="midnight-static"]');
            await page.waitForFunction(()=>!document.querySelector('#radioAudio').paused,{timeout:15000});
            if(await title()!=='Midnight Static')throw new Error('Shows PLAY did not select requested song');
            if(!await page.$eval('#showsPanel',p=>p.classList.contains('open')))throw new Error('Shows panel closed during playback');
            await page.click('#showsPanel [data-show-play]');
            await sleep(100);
            if(!(await audioState()).paused)throw new Error('Shows pause control failed');
            await page.click('#showsPanel [data-shows-tab="favorites"]');
            if(!await page.$('#showsPanel [data-play-track="dead-of-night"]'))throw new Error('Favorites tab did not show saved track');
            await page.click('#showsPanel [data-library-close]');

            // Put the ordered 88.3 opener back in place for the original playback regression.
            await page.evaluate(()=>window.BBRadio.restore({currentFreq:88.3,trackId:'welcome-to-the-haunted-roast',volume:.78,autoTune:false,shuffle:false,repeat:false}));
            await sleep(120);

            await station('88.3');
            await sleep(250);
            if(await title()!=='Welcome to the Haunted Roast')throw new Error('88.3 ordered start is wrong');
            if(!(await audioState()).paused)throw new Error('Tuning while paused started playback');

            await page.click('.desktop [data-hit="play"]');
            await page.waitForFunction(()=>!document.querySelector('#radioAudio').paused,{timeout:15000});
            await ended();
            await sleep(350);
            if(await title()!=='Midnight Static')throw new Error('Song end did not auto-advance');

            await toggle('#repeatSwitch');
            const repeatTitle=await title();
            await ended();
            await sleep(300);
            if(await title()!==repeatTitle)throw new Error('Repeat did not retain current song');
            await toggle('#repeatSwitch');

            await page.click('.desktop [data-hit="play"]');
            await sleep(150);
            if(!(await audioState()).paused)throw new Error('Pause failed');

            await station('103.1');
            await sleep(250);
            await toggle('#shuffleSwitch');
            const shuffled=[await title()];
            for(let i=0;i<5;i++){
              await page.click('.desktop [data-hit="next"]');
              await sleep(80);
              shuffled.push(await title());
            }
            if(shuffled.at(-1)!=='The Town Goes Quiet')throw new Error('Final signoff was not pinned last: '+shuffled.join(' | '));
            if(shuffled.slice(0,-1).includes('The Town Goes Quiet'))throw new Error('Final signoff appeared early');

            await toggle('#repeatSwitch');
            await page.click('.desktop [data-hit="play"]');
            await page.waitForFunction(()=>!document.querySelector('#radioAudio').paused,{timeout:15000});
            await ended();
            await sleep(250);
            if(!(await audioState()).paused)throw new Error('Final signoff did not stop');
            if(await page.$eval('.desktop',e=>e.classList.contains('is-playing')))throw new Error('Final signoff left ON AIR active');

            // Create a real listener state and allow the enhancement layer to save it.
            if(await page.$eval('#repeatSwitch',b=>b.getAttribute('aria-pressed')==='true'))await toggle('#repeatSwitch');
            if(await page.$eval('#shuffleSwitch',b=>b.getAttribute('aria-pressed')==='true'))await toggle('#shuffleSwitch');
            await station('91.7');
            await sleep(250);
            await page.click('.desktop [data-hit="next"]');
            await sleep(200);
            if(await title()!=='Static on the Highway')throw new Error('Persistence setup track is wrong');
            await page.evaluate(()=>window.BBRadio.setVolume(.42));
            await toggle('#repeatSwitch');
            await sleep(650);

            const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('bb-halloween-radio-state-v1')||'null'));
            if(!saved||saved.trackId!=='static-on-the-highway'||saved.currentFreq!==91.7)throw new Error('State was not saved: '+JSON.stringify(saved));
            if(Math.abs(saved.volume-.42)>.02||saved.autoTune!==false||saved.shuffle!==false||saved.repeat!==true)throw new Error('Saved modes are wrong: '+JSON.stringify(saved));

            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.BBRadio&&document.querySelector('.desktop [data-title]')?.textContent.trim()==='Static on the Highway',{timeout:15000});
            await sleep(300);
            const restored=await page.evaluate(()=>({
              paused:document.querySelector('#radioAudio').paused,
              volume:document.querySelector('#radioAudio').volume,
              auto:document.querySelector('#autoSwitch').getAttribute('aria-pressed'),
              shuffle:document.querySelector('#shuffleSwitch').getAttribute('aria-pressed'),
              repeat:document.querySelector('#repeatSwitch').getAttribute('aria-pressed'),
              state:window.BBRadio.snapshot(),
              favorites:JSON.parse(localStorage.getItem('bb-halloween-radio-favorites-v1')||'[]')
            }));
            if(!restored.paused)throw new Error('Saved state restore autoplayed audio');
            if(Math.abs(restored.volume-.42)>.02)throw new Error('Saved volume did not restore: '+JSON.stringify(restored));
            if(restored.auto!=='false'||restored.shuffle!=='false'||restored.repeat!=='true')throw new Error('Saved controls did not restore: '+JSON.stringify(restored));
            if(restored.state.currentFreq!==91.7||restored.state.trackId!=='static-on-the-highway')throw new Error('Saved station/track did not restore: '+JSON.stringify(restored));
            if(!restored.favorites.includes('dead-of-night'))throw new Error('Favorite did not survive reload');
            if(errors.length)throw new Error('Page errors: '+errors.join(' | '));

            console.log('Playback, library, favorites, and persistence regression passed:',shuffled,restored.state);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
