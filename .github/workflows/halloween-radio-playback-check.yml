name: Halloween Radio Playback Check

on:
  push:
    branches: [main]
    paths:
      - 'halloween-radio/**'
      - '.github/workflows/halloween-radio-playback-check.yml'
  workflow_dispatch:

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate playback mode source
        run: |
          node --check halloween-radio/assets/js/skin-radio.js
          python - <<'PY'
          from pathlib import Path
          html=Path('halloween-radio/index.html').read_text()
          css=Path('halloween-radio/assets/css/skin-radio.css').read_text()
          js=Path('halloween-radio/assets/js/skin-radio.js').read_text()
          assert 'id="shuffleSwitch"' in html
          assert 'id="repeatSwitch"' in html
          assert '.desktop .play-symbol{left:48.95%' in css
          assert '.desktop [data-hit="play"]{left:48.55%' in css
          assert 'shuffle:false,repeat:false' in js
          assert "changeTrack(1,{announce:false})" in js
          assert "if(isFinalSignoff(t))" in js
          assert "state.repeat&&state.playbackIntent" in js
          assert "ending=base.find(t=>t.id==='the-town-goes-quiet')" in js
          assert js.count('state.playbackIntent=true') == 1
          print('Playback mode source checks passed.')
          PY

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Browser playback regression
        run: |
          python3 -m http.server 8000 --directory . >/tmp/halloween-playback-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--mute-audio']});
            const page=await browser.newPage();
            await page.setViewport({width:1105,height:1024,deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/halloween-radio/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.desktop [data-title]')?.textContent.trim()==='IRONCLAD');
            if(!(await page.$eval('#radioAudio',a=>a.paused))) throw new Error('Autoplay occurred');
            if(await page.$eval('#shuffleSwitch',b=>b.getAttribute('aria-pressed')!=='false')) throw new Error('Shuffle must default off');
            if(await page.$eval('#repeatSwitch',b=>b.getAttribute('aria-pressed')!=='false')) throw new Error('Repeat must default off');
            if(await page.$eval('#autoSwitch',b=>b.getAttribute('aria-pressed')==='true')) await page.$eval('#autoSwitch',b=>b.click());

            const station=async f=>page.evaluate(f=>{const b=[...document.querySelectorAll('.desktop .station-label')].find(x=>x.textContent.includes(f));if(!b)throw new Error('Missing station '+f);b.click();},f);
            const title=()=>page.$eval('.desktop [data-title]',e=>e.textContent.trim());
            const ended=()=>page.$eval('#radioAudio',a=>a.dispatchEvent(new Event('ended')));
            const toggle=id=>page.$eval(id,b=>b.click());

            await station('88.3'); await sleep(200);
            if(await title()!=='Welcome to the Haunted Roast') throw new Error('Ordered station start is wrong');
            await page.click('.desktop [data-hit="play"]');
            await page.waitForFunction(()=>!document.querySelector('#radioAudio').paused,{timeout:15000});
            await ended(); await sleep(350);
            if(await title()!=='Midnight Static') throw new Error('Ended event did not automatically advance to next song');

            await toggle('#repeatSwitch');
            if(await page.$eval('#repeatSwitch',b=>b.getAttribute('aria-pressed'))!=='true') throw new Error('Repeat did not turn on');
            const repeatTitle=await title();
            await ended(); await sleep(300);
            if(await title()!==repeatTitle) throw new Error('Repeat did not keep the current song');
            await toggle('#repeatSwitch');

            await page.click('.desktop [data-hit="play"]'); await sleep(150);
            if(!(await page.$eval('#radioAudio',a=>a.paused))) throw new Error('Pause failed');
            await station('103.1'); await sleep(200);
            await toggle('#shuffleSwitch');
            if(await page.$eval('#shuffleSwitch',b=>b.getAttribute('aria-pressed'))!=='true') throw new Error('Shuffle did not turn on');
            const seen=[await title()];
            for(let i=0;i<5;i++){await page.click('.desktop [data-hit="next"]');await sleep(80);seen.push(await title());}
            if(seen.at(-1)!=='The Town Goes Quiet') throw new Error('Final signoff was not pinned last in shuffle: '+seen.join(' | '));
            if(seen.slice(0,-1).includes('The Town Goes Quiet')) throw new Error('Final signoff appeared before the end in shuffle');

            await toggle('#repeatSwitch');
            await page.click('.desktop [data-hit="play"]');
            await page.waitForFunction(()=>!document.querySelector('#radioAudio').paused,{timeout:15000});
            await ended(); await sleep(250);
            if(!(await page.$eval('#radioAudio',a=>a.paused))) throw new Error('Final signoff did not stop playback');
            if(await page.$eval('.desktop',e=>e.classList.contains('is-playing'))) throw new Error('Final signoff left ON AIR state active');
            if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
            console.log('Playback regression passed:',seen);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
