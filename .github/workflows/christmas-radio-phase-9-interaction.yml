name: Christmas Radio Phase 15 Interaction Cleanup Gate

on:
  push:
    branches: [christmas-radio-phase-15-interaction-cleanup]
    paths:
      - 'christmas-radio/**'
      - '.github/workflows/christmas-radio-phase-9-interaction.yml'

jobs:
  phone-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cleanup guardrails
        run: |
          set -euo pipefail
          node --input-type=module --check < christmas-radio/assets/js/christmas-radio.js
          node --input-type=module --check < christmas-radio/assets/js/audio-engine.js
          grep -q 'id="interaction-cleanup"' christmas-radio/index.html
          grep -q 'repeat(6,minmax(0,1fr))' christmas-radio/index.html
          grep -q 'id="rulesPanel"' christmas-radio/index.html
          grep -q 'DETENT_PX=32' christmas-radio/index.html
          grep -q 'REVERSAL_HYSTERESIS_PX=14' christmas-radio/index.html
          grep -q 'MIN_STEP_MS=140' christmas-radio/index.html
          grep -q 'preload="none"' christmas-radio/index.html
          ! grep -q '<audio[^>]*autoplay' christmas-radio/index.html
          grep -q 'phase15-interaction-cleanup-v1' christmas-radio/sw.js
          grep -q "pathname.includes('/audio/')" christmas-radio/sw.js
          grep -q 'mp3' christmas-radio/sw.js

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Exercise 430x932 phone interactions
        run: |
          set -euo pipefail
          mkdir -p phase15-output
          python3 -m http.server 8000 --directory . >/tmp/christmas-radio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const expected=[
            ['88.7','Snowfall AM'],['92.5','Fireside'],['96.9','Sleigh Bell Rock'],
            ['100.3','Candlelight'],['103.1','B&B Christmas Radio'],['106.7','North Pole After Hours']
          ];
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME_BIN,
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--mute-audio']
            });
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:3,isMobile:true,hasTouch:true});
            const pageErrors=[],httpErrors=[],mp3Requests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});
            page.on('request',r=>{if(/\.mp3(?:\?|$)/i.test(r.url()))mp3Requests.push(r.url())});

            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            await page.waitForFunction(()=>document.querySelector('#frequencyLabel')?.textContent.trim()==='103.1',{timeout:10000});
            await sleep(250);

            const boot=await page.evaluate(()=>({
              paused:document.querySelector('#christmasRadioAudio').paused,
              preload:document.querySelector('#christmasRadioAudio').preload,
              playText:document.querySelector('#playButton .play-icon').textContent.trim(),
              playPressed:document.querySelector('#playButton').getAttribute('aria-pressed'),
              afterContent:getComputedStyle(document.querySelector('#playButton'),'::after').content,
              beforeBackground:getComputedStyle(document.querySelector('#playButton'),'::before').backgroundImage,
              navCount:document.querySelectorAll('.bottom-nav button').length,
              navLabels:[...document.querySelectorAll('.bottom-nav b')].map(x=>x.textContent.trim()),
              touchAction:getComputedStyle(document.querySelector('.tuner-control')).touchAction
            }));
            if(!boot.paused||boot.preload!=='none'||boot.playText!=='▶'||boot.playPressed!=='false')throw new Error('Paused play state invalid: '+JSON.stringify(boot));
            if(boot.afterContent!=='none'||boot.beforeBackground==='none')throw new Error('Baked play state is not neutralized: '+JSON.stringify(boot));
            if(boot.navCount!==6||boot.navLabels.join('|')!=='Stations|Now Playing|About|Games|Shop|Rules')throw new Error('Bottom nav labels invalid: '+JSON.stringify(boot));
            if(boot.touchAction!=='none')throw new Error('Tuner touch-action is not controlled: '+boot.touchAction);
            if(mp3Requests.length)throw new Error('MP3 requested before explicit Play: '+mp3Requests.join(' | '));
            await page.screenshot({path:'phase15-output/paused-430x932-dpr3.png',fullPage:false});

            const tune=async index=>{
              await page.$eval('#stationTuner',(el,index)=>{el.value=String(index);el.dispatchEvent(new Event('input',{bubbles:true}))},index);
              await page.waitForFunction(f=>document.querySelector('#frequencyLabel')?.textContent.trim()===f,{timeout:5000},expected[index][0]);
            };

            const navStates=[];
            for(let i=0;i<expected.length;i++){
              await tune(i);
              const state=await page.evaluate(()=>{
                const nav=document.querySelector('.bottom-nav'),icon=document.querySelector('.bottom-nav .nav-icon');
                return{
                  station:document.body.dataset.station,
                  frequency:document.querySelector('#frequencyLabel').textContent.trim(),
                  name:document.querySelector('#stationName').textContent.trim(),
                  background:getComputedStyle(nav).backgroundImage,
                  border:getComputedStyle(nav).borderTopColor,
                  iconOpacity:getComputedStyle(icon).opacity,
                  rect:nav.getBoundingClientRect().toJSON()
                };
              });
              if(state.name!==expected[i][1]||state.iconOpacity!=='1'||!state.background.includes('linear-gradient'))throw new Error('Nav/station state invalid: '+JSON.stringify(state));
              if(state.rect.bottom>932.5||state.rect.left<-.5||state.rect.right>430.5)throw new Error('Nav is not phone-safe: '+JSON.stringify(state.rect));
              navStates.push(state);
            }
            if(new Set(navStates.map(x=>x.background)).size!==1)throw new Error('Nav treatment changes between stations: '+JSON.stringify(navStates));

            // Real touch input: one 32px detent at a time, with 14px reversal hysteresis.
            await tune(2);
            const rect=await page.$eval('.tuner-control',el=>el.getBoundingClientRect().toJSON());
            const x=rect.left+rect.width/2,y=rect.top+rect.height/2;
            const cdp=await page.createCDPSession();
            const touch=async(type,yy)=>cdp.send('Input.dispatchTouchEvent',{type,touchPoints:type==='touchEnd'?[]:[{x,y:yy,id:1,radiusX:4,radiusY:4,force:.5}]});
            await touch('touchStart',y);
            await touch('touchMove',y-20);await sleep(40);
            if(await page.$eval('#stationTuner',e=>e.value)!=='2')throw new Error('Tuner crossed deadband too early');
            await touch('touchMove',y-40);
            await page.waitForFunction(()=>document.querySelector('#stationTuner').value==='3',{timeout:3000});
            await sleep(165);
            await touch('touchMove',y-10);await sleep(50);
            if(await page.$eval('#stationTuner',e=>e.value)!=='3')throw new Error('Tuner reversed inside hysteresis band');
            await touch('touchMove',y+12);
            await page.waitForFunction(()=>document.querySelector('#stationTuner').value==='2',{timeout:3000});
            await touch('touchEnd',y);

            // A single large move still advances only one station, never races across the dial.
            await tune(2);
            await touch('touchStart',y);
            await touch('touchMove',y-180);
            await page.waitForFunction(()=>document.querySelector('#stationTuner').value==='3',{timeout:3000});
            await sleep(60);
            if(await page.$eval('#stationTuner',e=>e.value)!=='3')throw new Error('Large touch move skipped multiple detents');
            await touch('touchEnd',y);

            await tune(4);
            await page.click('#playButton');
            await page.waitForFunction(()=>!document.querySelector('#christmasRadioAudio').paused,{timeout:15000});
            const playing=await page.evaluate(()=>({
              paused:document.querySelector('#christmasRadioAudio').paused,
              playText:document.querySelector('#playButton .play-icon').textContent.trim(),
              pressed:document.querySelector('#playButton').getAttribute('aria-pressed'),
              afterContent:getComputedStyle(document.querySelector('#playButton'),'::after').content,
              src:document.querySelector('#christmasRadioAudio').currentSrc
            }));
            if(playing.paused||playing.playText!=='Ⅱ'||playing.pressed!=='true'||playing.afterContent!=='none'||!playing.src.includes('.mp3'))throw new Error('Live pause state invalid: '+JSON.stringify(playing));
            await page.screenshot({path:'phase15-output/playing-430x932-dpr3.png',fullPage:false});

            await page.$eval('#volumeControl',el=>{el.value='0.35';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await sleep(80);
            const volume=await page.$eval('#christmasRadioAudio',a=>a.volume);
            if(Math.abs(volume-.35)>.02)throw new Error('Volume control failed: '+volume);

            await tune(0);
            await page.waitForFunction(()=>document.querySelector('#frequencyLabel').textContent.trim()==='88.7'&&!document.querySelector('#christmasRadioAudio').paused,{timeout:10000});
            const liveSwitch=await page.$eval('#christmasRadioAudio',a=>({paused:a.paused,src:a.currentSrc}));
            if(liveSwitch.paused||!liveSwitch.src.includes('.mp3'))throw new Error('Live station switch failed: '+JSON.stringify(liveSwitch));

            await page.click('#playButton');
            await page.waitForFunction(()=>document.querySelector('#christmasRadioAudio').paused,{timeout:5000});
            const pausedAgain=await page.evaluate(()=>({text:document.querySelector('#playButton .play-icon').textContent.trim(),pressed:document.querySelector('#playButton').getAttribute('aria-pressed')}));
            if(pausedAgain.text!=='▶'||pausedAgain.pressed!=='false')throw new Error('Return-to-play icon failed: '+JSON.stringify(pausedAgain));

            await page.click('button[data-panel="nowPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#nowPanel').hidden,{timeout:3000});
            const beforeNext=await page.$eval('#panelTrack',e=>e.textContent.trim());
            await page.click('#panelNext');
            await page.waitForFunction(t=>document.querySelector('#panelTrack').textContent.trim()!==t,{timeout:5000},beforeNext);
            const afterNext=await page.$eval('#panelTrack',e=>e.textContent.trim());
            if(afterNext===beforeNext)throw new Error('Next control failed');
            await page.click('#nowPanel .panel-close');

            await page.evaluate(()=>navigator.serviceWorker.ready.then(()=>true));
            const beforeReloadMp3=mp3Requests.length;
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            await page.waitForFunction(()=>!!navigator.serviceWorker.controller,{timeout:10000});
            await sleep(250);
            const cacheState=await page.evaluate(async()=>{
              const keys=await caches.keys();
              const urls=[];
              for(const key of keys){const cache=await caches.open(key);for(const req of await cache.keys())urls.push(req.url)}
              return{keys,urls,paused:document.querySelector('#christmasRadioAudio').paused};
            });
            if(!cacheState.keys.includes('bb-christmas-radio-shell-phase15-interaction-cleanup-v1'))throw new Error('Updated shell cache missing: '+JSON.stringify(cacheState.keys));
            if(cacheState.urls.some(u=>/\/audio\/|\.mp3(?:\?|$)/i.test(u)))throw new Error('Audio was cached: '+JSON.stringify(cacheState.urls.filter(u=>/\/audio\/|\.mp3/i.test(u))));
            if(!cacheState.paused)throw new Error('Reload autoplayed audio');
            if(mp3Requests.length!==beforeReloadMp3)throw new Error('Reload requested MP3 before Play');

            const criticalHttp=httpErrors.filter(x=>!x.url.endsWith('/favicon.ico'));
            if(criticalHttp.length)throw new Error('HTTP errors: '+JSON.stringify(criticalHttp));
            if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '));

            const report={status:'PASS',boot,navStates,tuner:{deadbandPx:32,reversalHysteresisPx:14,minStepMs:140,touch:true,largeMoveSingleDetent:true},playing,volume,liveSwitch,next:{beforeNext,afterNext},cacheState:{keys:cacheState.keys,cachedAudio:false},mp3RequestCount:mp3Requests.length,httpErrors:criticalHttp,pageErrors};
            fs.writeFileSync('phase15-output/report.json',JSON.stringify(report,null,2));
            console.log('PHASE 15 INTERACTION CLEANUP PASS',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);fs.writeFileSync('phase15-output/failure.txt',String(e.stack||e));process.exit(1)});
          NODE

      - name: Upload Phase 15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-radio-phase-15-interaction-evidence
          path: phase15-output/
          if-no-files-found: warn
          retention-days: 14
