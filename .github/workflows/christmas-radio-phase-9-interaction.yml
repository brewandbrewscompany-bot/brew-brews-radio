name: Christmas Radio Phase 16 Final Visual QA

on:
  push:
    branches: [christmas-radio-phase-16-visual-audit-fix]
    paths:
      - 'christmas-radio/**'
      - '.github/workflows/christmas-radio-phase-9-interaction.yml'

jobs:
  phone-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify visual guardrails
        run: |
          set -euo pipefail
          grep -q 'phase16-visual-audit-v1' christmas-radio/sw.js
          grep -q "pathname.includes('/audio/')" christmas-radio/sw.js
          grep -q 'Tap Play to begin' christmas-radio/assets/css/stations.css
          grep -q 'Now Playing' christmas-radio/assets/css/stations.css
          ! grep -q "height:13%.*christmas-radio-approved-skin" christmas-radio/assets/css/stations.css
          ! grep -q '<audio[^>]*autoplay' christmas-radio/index.html

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Exercise and capture every station at 430x932 DPR 3
        run: |
          set -euo pipefail
          mkdir -p phase16-final-visual
          python3 -m http.server 8000 --directory . >/tmp/christmas-radio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const expected=[
            ['88.7','Snowfall AM'],['92.5','Fireside'],['96.9','Sleigh Bell Rock'],
            ['100.3','Candlelight'],['103.1','B&B Christmas Radio'],['106.7','North Pole After Hours']
          ];
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME_BIN,
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--mute-audio']
            });
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:3,isMobile:true,hasTouch:true});
            const pageErrors=[],httpErrors=[],mp3Requests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});
            page.on('request',r=>{if(/\.mp3(?:\?|$)/i.test(r.url()))mp3Requests.push(r.url())});

            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'networkidle0'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            if(mp3Requests.length)throw new Error('MP3 requested before Play');

            const report=[];
            for(let i=0;i<expected.length;i++){
              const [freq,name]=expected[i];
              await page.$eval('#stationTuner',(el,index)=>{el.value=String(index);el.dispatchEvent(new Event('input',{bubbles:true}))},i);
              await page.waitForFunction(f=>document.querySelector('#frequencyLabel')?.textContent.trim()===f,{timeout:5000},freq);
              await sleep(220);
              const paused=await page.evaluate(()=>({
                station:document.body.dataset.station,
                frequency:document.querySelector('#frequencyLabel').textContent.trim(),
                name:document.querySelector('#stationName').textContent.trim(),
                icon:document.querySelector('#playButton .play-icon').textContent.trim(),
                pressed:document.querySelector('#playButton').getAttribute('aria-pressed'),
                status:getComputedStyle(document.querySelector('#playButton'),'::after').content,
                maskInset:getComputedStyle(document.querySelector('#playButton'),'::before').inset,
                sceneOverlay:getComputedStyle(document.querySelector('.scene'),'::after').backgroundImage,
                tunerOutline:getComputedStyle(document.querySelector('.tuner-control')).outlineStyle,
                nav:getComputedStyle(document.querySelector('.bottom-nav')).backgroundImage
              }));
              if(paused.name!==name||paused.icon!=='▶'||paused.pressed!=='false'||!paused.status.includes('Tap Play to begin'))throw new Error('Paused state invalid '+JSON.stringify(paused));
              if(i!==4&&paused.sceneOverlay.includes('christmas-radio-approved-skin'))throw new Error('Foreign flagship header still overlays '+freq);
              await page.screenshot({path:`phase16-final-visual/${String(i+1).padStart(2,'0')}-${freq.replace('.','')}-paused.png`,fullPage:false});

              // Give the real tuner surface touch focus and ensure no rectangular focus artifact appears.
              const knob=await page.$eval('.tuner-control',el=>el.getBoundingClientRect().toJSON());
              await page.touchscreen.tap(knob.left+knob.width/2,knob.top+knob.height/2);
              await sleep(80);
              const focused=await page.evaluate(()=>({
                outline:getComputedStyle(document.querySelector('.tuner-control')).outlineStyle,
                focusWithin:document.querySelector('.tuner-control').matches(':focus-within')
              }));
              if(focused.outline!=='none')throw new Error('Tuner focus outline visible '+JSON.stringify(focused));

              await page.click('#playButton');
              await page.waitForFunction(()=>!document.querySelector('#christmasRadioAudio').paused,{timeout:15000});
              await sleep(220);
              const playing=await page.evaluate(()=>({
                icon:document.querySelector('#playButton .play-icon').textContent.trim(),
                pressed:document.querySelector('#playButton').getAttribute('aria-pressed'),
                status:getComputedStyle(document.querySelector('#playButton'),'::after').content,
                paused:document.querySelector('#christmasRadioAudio').paused
              }));
              if(playing.paused||playing.icon!=='Ⅱ'||playing.pressed!=='true'||!playing.status.includes('Now Playing'))throw new Error('Playing state invalid '+JSON.stringify(playing));
              await page.screenshot({path:`phase16-final-visual/${String(i+1).padStart(2,'0')}-${freq.replace('.','')}-playing.png`,fullPage:false});
              await page.click('#playButton');
              await page.waitForFunction(()=>document.querySelector('#christmasRadioAudio').paused,{timeout:5000});
              report.push({freq,name,paused,focused,playing});
            }

            // Existing core controls still work.
            await page.$eval('#volumeControl',el=>{el.value='0.35';el.dispatchEvent(new Event('input',{bubbles:true}))});
            const volume=await page.$eval('#christmasRadioAudio',a=>a.volume);
            if(Math.abs(volume-.35)>.02)throw new Error('Volume failed '+volume);
            await page.click('button[data-panel="nowPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#nowPanel').hidden,{timeout:3000});
            const beforeNext=await page.$eval('#panelTrack',e=>e.textContent.trim());
            await page.click('#panelNext');
            await page.waitForFunction(t=>document.querySelector('#panelTrack').textContent.trim()!==t,{timeout:5000},beforeNext);
            await page.click('#nowPanel .panel-close');

            await page.evaluate(()=>navigator.serviceWorker.ready.then(()=>true));
            await page.reload({waitUntil:'networkidle0'});
            await page.waitForFunction(()=>!!navigator.serviceWorker.controller,{timeout:10000});
            const cache=await page.evaluate(async()=>{
              const keys=await caches.keys(),urls=[];
              for(const key of keys){for(const req of await (await caches.open(key)).keys())urls.push(req.url)}
              return{keys,urls,paused:document.querySelector('#christmasRadioAudio').paused};
            });
            if(!cache.keys.includes('bb-christmas-radio-shell-phase16-visual-audit-v1'))throw new Error('Phase16 cache missing');
            if(cache.urls.some(u=>/\/audio\/|\.mp3(?:\?|$)/i.test(u)))throw new Error('Audio cached');
            if(!cache.paused)throw new Error('Reload autoplayed');
            const criticalHttp=httpErrors.filter(x=>!x.url.endsWith('/favicon.ico'));
            if(criticalHttp.length)throw new Error('HTTP errors '+JSON.stringify(criticalHttp));
            if(pageErrors.length)throw new Error('Page errors '+pageErrors.join(' | '));
            fs.writeFileSync('phase16-final-visual/report.json',JSON.stringify({status:'PASS',report,volume,next:{beforeNext,afterNext:await page.$eval('#panelTrack',e=>e.textContent.trim()).catch(()=>null)},cache:{keys:cache.keys,cachedAudio:false},httpErrors:criticalHttp,pageErrors},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);fs.writeFileSync('phase16-final-visual/failure.txt',String(e.stack||e));process.exit(1)});
          NODE

      - name: Upload Phase 16 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-radio-phase16-final-visual
          path: phase16-final-visual/
          if-no-files-found: warn
          retention-days: 7
