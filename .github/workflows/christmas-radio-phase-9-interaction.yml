name: Christmas Radio Phase 16 Raw Artwork Audit

on:
  push:
    branches: [christmas-radio-phase-16-visual-audit-fix]
    paths:
      - '.github/workflows/christmas-radio-phase-9-interaction.yml'

jobs:
  raw-artwork-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Capture alternate station art without shared header mask
        run: |
          set -euo pipefail
          mkdir -p phase16-raw-art
          python3 -m http.server 8000 --directory . >/tmp/christmas-radio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const stations=[['88.7','snowfall'],['92.5','fireside'],['96.9','sleigh'],['100.3','candlelight'],['106.7','north-pole']];
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'networkidle0'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            await page.addStyleTag({content:`
              body:not([data-station="bb-christmas-radio"]) .scene::after{display:none!important}
            `});
            const indices=[0,1,2,3,5];
            for(let j=0;j<indices.length;j++){
              const i=indices[j]; const [freq,slug]=stations[j];
              await page.$eval('#stationTuner',(el,index)=>{el.value=String(index);el.dispatchEvent(new Event('input',{bubbles:true}))},i);
              await page.waitForFunction(f=>document.querySelector('#frequencyLabel')?.textContent.trim()===f,{timeout:5000},freq);
              await sleep(300);
              await page.screenshot({path:`phase16-raw-art/${String(j+1).padStart(2,'0')}-${slug}.png`,fullPage:false});
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload raw artwork audit
        uses: actions/upload-artifact@v4
        with:
          name: christmas-radio-phase16-raw-art
          path: phase16-raw-art/
          if-no-files-found: error
          retention-days: 7
