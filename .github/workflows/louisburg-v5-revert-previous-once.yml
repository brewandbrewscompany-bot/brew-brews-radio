name: Louisburg V5 revert previous once

on:
  push:
    paths:
      - '.github/workflows/louisburg-v5-revert-previous-once.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous V5
        shell: bash
        run: |
          git checkout a6c91ca9107461fa1334f9756d4e779c110febf9 -- louisburg-local/web-v5/index.html

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('louisburg-local/web-v5/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/v5.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/v5.js

      - name: Commit revert
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add louisburg-local/web-v5/index.html
          git commit -m "Restore V5 previous version" || exit 0
          git push
