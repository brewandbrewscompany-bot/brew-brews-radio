name: Witch Ride 3D Pass 17 Headlight Diagnostic

on:
  push:
    branches: [witch-ride-3d-environment-headlight-bean-pass-17]
    paths:
      - '.github/workflows/witch-ride-3d-pass17-headlight-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source safety
        shell: bash
        run: |
          git fetch origin main witch-ride-3d-environment-headlight-bean-pass-17
          echo "CURRENT_MAIN=$(git rev-parse origin/main)"
          echo "CURRENT_TARGET=$(git rev-parse origin/witch-ride-3d-environment-headlight-bean-pass-17)"
          test "$(git rev-parse origin/witch-ride-3d-environment-headlight-bean-pass-17)" = "$GITHUB_SHA"
          BASE=ea550e5c46db3764de972ce078804783be83dfbf
          for path in halloween-radio/games/witch-ride-3d/game.js halloween-radio/games/witch-ride-3d/index.html halloween-radio/games/witch-ride-3d/witch-centerpiece-pass.js halloween-radio/games/witch-ride-3d/assets/witch-rider.glb; do
            git diff --quiet "$BASE" HEAD -- "$path" || exit 1
          done
          ! git diff --name-only "$BASE" HEAD | grep -q '^louisburg-local/'
      - name: Inventory staged headlight geometry at 430x932
        shell: bash
        run: |
          npm install --no-save puppeteer-core@24.16.0
          python3 -m http.server 8010 --directory . >/tmp/pass17diag.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const fs=require('fs'),puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,protocolTimeout:600000,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--mute-audio']});
            const p=await browser.newPage();p.setDefaultTimeout(60000);await p.setViewport({width:430,height:932,deviceScaleFactor:1,isMobile:true,hasTouch:true});
            await p.goto('http://127.0.0.1:8010/halloween-radio/games/witch-ride-3d/',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForFunction(()=>window.WitchRide3D?.ready&&window.WitchRidePass17Environment?.active&&window.WitchRideWitchCenterpiecePass?.active,{timeout:60000});
            await p.click('#play');await p.waitForFunction(()=>window.WitchRide3D.state.mode==='playing');await sleep(300);await p.click('#pause');await p.waitForFunction(()=>window.WitchRide3D.state.mode==='paused');
            await p.evaluate(async()=>{const pc=await import('playcanvas'),app=pc.app,cam=app.root.findByName('Chase Camera');document.querySelector('#hud')?.classList.add('hidden');for(const el of document.querySelectorAll('.screen'))el.classList.remove('open');for(let i=0;i<7;i++){const c=app.root.findByName(`1938 Coupe ${i}`);if(c)c.enabled=i===0}for(let i=0;i<4;i++){const c=app.root.findByName(`Oncoming Traffic ${i}`);if(c)c.enabled=false}for(let i=0;i<16;i++){const b=app.root.findByName(`Coffee Bean ${i}`);if(b)b.enabled=false}const car=app.root.findByName('1938 Coupe 0');car.enabled=true;car.__active=true;car.setPosition(0,0,-6);});
            await sleep(250);await p.screenshot({path:'diag-before.png'});
            const inventory=await p.evaluate(async()=>{const pc=await import('playcanvas'),app=pc.app,car=app.root.findByName('1938 Coupe 0'),rows=[];const vec=v=>v?[v.x,v.y,v.z]:null;const color=c=>c?[c.r,c.g,c.b]:null;const scan=(n,scope)=>{const m=n.render?.material||n.render?.meshInstances?.[0]?.material||null;if(n.render||n.light||/light|lamp|head|spill|reflect|beam|volume|fog|glow/i.test(n.name||'')){const s=n.getLocalScale?.(),p=n.getLocalPosition?.(),r=n.getLocalEulerAngles?.();rows.push({scope,name:n.name,parent:n.parent?.name||'',enabled:n.enabled,enabledInHierarchy:n.enabledInHierarchy,scale:vec(s),pos:vec(p),rot:vec(r),render:!!n.render,meshInstances:n.render?.meshInstances?.length||0,material:m?{name:m.name||'',opacity:m.opacity,blendType:m.blendType,gloss:m.gloss,diffuse:color(m.diffuse),emissive:color(m.emissive),emissiveIntensity:m.emissiveIntensity}:null,light:n.light?{type:n.light.type,intensity:n.light.intensity,range:n.light.range,color:color(n.light.color)}:null})}for(const c of n.children||[])scan(c,scope)};scan(car,'car');for(const n of app.root.children||[]){if(n===car)continue;const m=n.render?.material||n.render?.meshInstances?.[0]?.material||null,s=n.getLocalScale?.();if(n.render&&n.enabledInHierarchy&&(Math.max(s?.x||0,s?.y||0,s?.z||0)>2||/light|spill|reflect|beam|volume|fog|glow/i.test(n.name||''))){const p=n.getPosition?.(),r=n.getEulerAngles?.();rows.push({scope:'root',name:n.name,parent:n.parent?.name||'',enabled:n.enabled,enabledInHierarchy:n.enabledInHierarchy,scale:vec(s),pos:vec(p),rot:vec(r),render:true,meshInstances:n.render?.meshInstances?.length||0,material:m?{name:m.name||'',opacity:m.opacity,blendType:m.blendType,gloss:m.gloss,diffuse:color(m.diffuse),emissive:color(m.emissive),emissiveIntensity:m.emissiveIntensity}:null,light:null})}}return rows});
            fs.writeFileSync('headlight-inventory.json',JSON.stringify(inventory,null,2));console.log('HEADLIGHT_INVENTORY '+JSON.stringify(inventory));
            const candidates=await p.evaluate(async()=>{const pc=await import('playcanvas'),app=pc.app,car=app.root.findByName('1938 Coupe 0'),out=[];const scan=n=>{const m=n.render?.material||n.render?.meshInstances?.[0]?.material||null,s=n.getLocalScale?.();if(n.render&&n.enabledInHierarchy){const max=Math.max(s?.x||0,s?.y||0,s?.z||0);const warm=(m?.emissive?.r||0)>(m?.emissive?.b||0)*1.5||(m?.diffuse?.r||0)>(m?.diffuse?.b||0)*1.5;if(max>.7&&warm)out.push({name:n.name,parent:n.parent?.name||'',max,material:m?.name||''})}for(const c of n.children||[])scan(c)};scan(car);return out});
            fs.writeFileSync('headlight-candidates.json',JSON.stringify(candidates,null,2));console.log('HEADLIGHT_CANDIDATES '+JSON.stringify(candidates));
            for(let i=0;i<candidates.length;i++){
              await p.evaluate(({name,parent})=>{const find=(n)=>{if(n.name===name&&n.parent?.name===parent)return n;for(const c of n.children||[]){const z=find(c);if(z)return z}return null};const pc=window.pc;},candidates[i]).catch(()=>{});
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass17-headlight-diagnostic
          if-no-files-found: warn
          path: |
            diag-before.png
            headlight-inventory.json
            headlight-candidates.json
