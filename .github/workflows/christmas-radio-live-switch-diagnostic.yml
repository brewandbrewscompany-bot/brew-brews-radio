name: Christmas Radio Live Switch Diagnostic

on:
  push:
    branches: [christmas-radio-phase-6-playback-validation]
    paths:
      - '.github/workflows/christmas-radio-live-switch-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save puppeteer-core@24.16.0
      - name: Trace live station switch
        run: |
          python3 -m http.server 8000 --directory . >/tmp/christmas-radio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--mute-audio']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:1});
            const requests=[];
            const failures=[];
            const consoleLines=[];
            page.on('request',r=>{if(/\.mp3(?:\?|$)/i.test(r.url()))requests.push(r.url())});
            page.on('requestfailed',r=>failures.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('console',m=>consoleLines.push(`${m.type()}: ${m.text()}`));
            page.on('pageerror',e=>consoleLines.push(`pageerror: ${e}`));
            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            const snapshot=label=>page.evaluate(label=>{
              const a=document.querySelector('#christmasRadioAudio');
              return {label,title:document.querySelector('#nowPlayingTitle')?.textContent.trim(),frequency:document.querySelector('#frequencyLabel')?.textContent.trim(),signal:document.querySelector('#signalLabel')?.textContent.trim(),pressed:document.querySelector('#playButton')?.getAttribute('aria-pressed'),audio:{paused:a.paused,src:a.getAttribute('src'),currentSrc:a.currentSrc,readyState:a.readyState,networkState:a.networkState,volume:a.volume,currentTime:a.currentTime,ended:a.ended,error:a.error?{code:a.error.code,message:a.error.message}:null}};
            },label);
            const dump=async label=>console.log('SNAPSHOT '+JSON.stringify(await snapshot(label)));
            const tune=index=>page.$eval('#stationTuner',(el,index)=>{el.value=String(index);el.dispatchEvent(new Event('input',{bubbles:true}))},index);
            const waitTitle=t=>page.waitForFunction(t=>document.querySelector('#nowPlayingTitle')?.textContent.trim()===t,{timeout:10000},t);

            await dump('boot');
            await page.click('#playButton');
            await page.waitForFunction(()=>!document.querySelector('#christmasRadioAudio').paused,{timeout:15000});
            await sleep(500);await dump('flagship-playing');
            await page.$eval('#christmasRadioAudio',a=>a.dispatchEvent(new Event('ended')));
            await waitTitle('Lights in the Roastery');
            await sleep(750);await dump('after-ended-to-m02');

            console.log('REQUESTS BEFORE LIVE TUNE '+JSON.stringify(requests));
            await tune(2);
            for(const ms of [0,50,150,300,750,1500,3000]){
              if(ms)await sleep(ms-(globalThis.__last||0));
              globalThis.__last=ms;
              await dump(`live-tune-${ms}ms`);
            }
            console.log('REQUESTS AFTER LIVE TUNE '+JSON.stringify(requests));
            console.log('REQUEST FAILURES '+JSON.stringify(failures));
            console.log('CONSOLE '+JSON.stringify(consoleLines));
            const final=await snapshot('final');
            if(final.audio.src!=='audio/bbxmas-m03-christmas-on-the-county-line.mp3')throw new Error('Live switch did not commit M03 source: '+JSON.stringify(final));
            if(final.audio.paused)throw new Error('Live switch left audio paused: '+JSON.stringify(final));
            if(!requests.some(u=>u.includes('bbxmas-m03-christmas-on-the-county-line.mp3')))throw new Error('Live switch never requested M03');
            console.log('LIVE SWITCH DIAGNOSTIC PASSED');
            await browser.close();
          })().catch(e=>{console.error('DIAGNOSTIC FAILURE',e);process.exit(1)});
          NODE
