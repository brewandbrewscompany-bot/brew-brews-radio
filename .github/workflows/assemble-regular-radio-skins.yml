name: Assemble Approved Regular Radio Skins

on:
  push:
    branches: [regular-radio-final-website-ready-pass]
    paths:
      - 'asset-stage/READY'

permissions:
  contents: write

env:
  BRANCH: regular-radio-final-website-ready-pass

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safety check current branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main regular-radio-stabilization-pass-1 "$BRANCH"
          START=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse "origin/$BRANCH")
          test "$START" = "$REMOTE"
          ! git diff --name-only origin/regular-radio-stabilization-pass-1...HEAD | grep -Eq '^(halloween-radio|christmas-radio|louisburg-local)/'
          test -f index.html
          test -f player.js
          test -f asset-stage/desktop.b64.part1
          test -f asset-stage/desktop.b64.part2
          test -f asset-stage/desktop.b64.part3
          test -f asset-stage/mobile.b64.part1
          test -f asset-stage/mobile.b64.part2
          echo "$START" > /tmp/start-sha
      - name: Assemble optimized AVIF skins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/regular-radio
          cat asset-stage/desktop.b64.part1 asset-stage/desktop.b64.part2 asset-stage/desktop.b64.part3 | tr -d '\n\r' | base64 -d > assets/regular-radio/radio-desktop-approved.avif
          cat asset-stage/mobile.b64.part1 asset-stage/mobile.b64.part2 | tr -d '\n\r' | base64 -d > assets/regular-radio/radio-mobile-approved.avif
          file assets/regular-radio/radio-desktop-approved.avif | grep -qi 'AVIF\|ISO Media'
          file assets/regular-radio/radio-mobile-approved.avif | grep -qi 'AVIF\|ISO Media'
          test "$(stat -c%s assets/regular-radio/radio-desktop-approved.avif)" -gt 15000
          test "$(stat -c%s assets/regular-radio/radio-mobile-approved.avif)" -gt 10000
      - name: Commit exact approved skins
        shell: bash
        run: |
          set -euo pipefail
          START=$(cat /tmp/start-sha)
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$START"
          git config user.name brewandbrewscompany-bot
          git config user.email brewandbrewscompany@gmail.com
          git add assets/regular-radio/radio-desktop-approved.avif assets/regular-radio/radio-mobile-approved.avif
          git rm -r asset-stage
          git commit -m 'Add approved photoreal regular radio skins'
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$START"
          git push origin HEAD:"$BRANCH"
