name: Louisburg V5 swipe persistence run

on:
  push:
    paths:
      - .github/workflows/louisburg-v5-swipe-persistence-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch files
        run: |
          curl -fsSL https://raw.githubusercontent.com/brewandbrewscompany-bot/brew-brews-radio/main/louisburg-local/web-v5/index.html -o /tmp/v5.html
          curl -fsSL https://raw.githubusercontent.com/brewandbrewscompany-bot/brew-brews-radio/main/.github/scripts/v5_swipe_persistence.py -o /tmp/v5_swipe_persistence.py

      - name: Patch V5
        run: python /tmp/v5_swipe_persistence.py

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/v5.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/v5.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/v5.js

      - name: Update V5 index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          repo='brewandbrewscompany-bot/brew-brews-radio'
          path='louisburg-local/web-v5/index.html'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',headers=headers)
          with urllib.request.urlopen(req) as r: current=json.load(r)
          data=open('/tmp/v5.html','rb').read()
          payload=json.dumps({'message':'Keep V5 swipe active across search and navigation','content':base64.b64encode(data).decode(),'sha':current['sha']}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=payload,method='PUT',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: print(json.load(r)['commit']['sha'])
          PY
