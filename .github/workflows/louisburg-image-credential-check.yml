name: Louisburg Image Credential Check

on:
  push:
    branches: [main]
    paths:
      - '.github/run-markers/image-credential-check.txt'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
    steps:
      - name: Check configured secret presence
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY_PRESENT=yes"; else echo "OPENAI_API_KEY_PRESENT=no"; fi
          if [ -n "$LL_SOCIAL_INGEST_KEY" ]; then echo "LL_SOCIAL_INGEST_KEY_PRESENT=yes"; else echo "LL_SOCIAL_INGEST_KEY_PRESENT=no"; fi
