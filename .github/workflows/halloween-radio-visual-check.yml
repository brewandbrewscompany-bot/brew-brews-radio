name: Halloween Radio Visual Check

on:
  push:
    branches: [main]
    paths:
      - 'halloween-radio/index.html'
      - 'halloween-radio/assets/css/**'
      - 'halloween-radio/assets/js/skin-radio.js'
      - 'halloween-radio/artwork/**'
      - '.github/workflows/halloween-radio-visual-check.yml'
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify skin artwork
        run: |
          test -s halloween-radio/artwork/desktop-skin.webp
          test -s halloween-radio/artwork/phone-skin.webp

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Render desktop and phone layouts
        run: |
          mkdir -p visual-output
          python3 -m http.server 8000 --directory . >/tmp/halloween-visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium not found on runner.'
            exit 1
          fi
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer = require('puppeteer-core');

          async function inspect(page, label, mobile=false) {
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/halloween-radio/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('[data-title]')?.textContent.trim()==='IRONCLAD',{timeout:10000});

            const state = await page.evaluate((mobile)=>{
              const visible=el=>!!el && getComputedStyle(el).display!=='none' && getComputedStyle(el).visibility!=='hidden' && el.getBoundingClientRect().width>0 && el.getBoundingClientRect().height>0;
              const desktop=document.querySelector('.skin-stage.desktop');
              const phone=document.querySelector('.skin-stage.phone');
              const stage=mobile?phone:desktop;
              const hiddenStage=mobile?desktop:phone;
              const q=s=>stage?.querySelector(s);
              return {
                innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                stageVisible:visible(stage),
                hiddenStageVisible:visible(hiddenStage),
                stageWidth:stage?.getBoundingClientRect().width||0,
                stageHeight:stage?.getBoundingClientRect().height||0,
                stageTop:stage?.getBoundingClientRect().top||0,
                background:getComputedStyle(stage).backgroundImage,
                totalNeedles:document.querySelectorAll('.tuner-needle').length,
                visibleNeedles:[...document.querySelectorAll('.tuner-needle')].filter(visible).length,
                desktopStations:document.querySelectorAll('.desktop .station-label').length,
                phoneStations:document.querySelectorAll('.phone .station-label').length,
                liveLampVisible:visible(q('.live-lamp')),
                nowVisible:visible(q('.now-live')),
                playVisible:visible(q('.play-symbol')),
                volumeMarkerVisible:visible(q('.volume-marker')),
                tuneMarkerVisible:visible(q('.tune-marker')),
                tubeVisible:visible(q('.tube-glow')),
                steamVisible:visible(q('.steam')),
                audioPaused:document.querySelector('#radioAudio')?.paused,
                title:q('[data-title]')?.textContent.trim(),
                mobile
              };
            },mobile);

            if(pageErrors.length) throw new Error(`${label} page errors: ${pageErrors.join(' | ')}`);
            if(!state.stageVisible || state.hiddenStageVisible) throw new Error(`${label}: responsive stage visibility is wrong: ${JSON.stringify(state)}`);
            if(state.totalNeedles!==2 || state.visibleNeedles!==1) throw new Error(`${label}: expected one visible tuner needle across two responsive stages: ${JSON.stringify(state)}`);
            if(state.desktopStations!==6 || state.phoneStations!==6) throw new Error(`${label}: each responsive tuner must contain six station labels: ${JSON.stringify(state)}`);
            if(state.audioPaused!==true) throw new Error(`${label}: audio autoplayed`);
            if(state.title!=='IRONCLAD') throw new Error(`${label}: default track is not IRONCLAD`);
            if(!state.liveLampVisible || !state.nowVisible || !state.playVisible || !state.volumeMarkerVisible || !state.tuneMarkerVisible) throw new Error(`${label}: required dynamic overlay is missing: ${JSON.stringify(state)}`);
            if(state.scrollWidth>state.innerWidth+3) throw new Error(`${label}: horizontal overflow ${state.scrollWidth}px > ${state.innerWidth}px`);

            if(mobile){
              if(!state.background.includes('phone-skin.webp')) throw new Error(`${label}: phone skin is not active: ${state.background}`);
              if(state.stageWidth<380) throw new Error(`${label}: phone skin too narrow: ${state.stageWidth}`);
              if(state.tubeVisible || state.steamVisible) throw new Error(`${label}: desktop tube/steam overlays should not exist in the phone stage`);
              if(state.stageTop>1) throw new Error(`${label}: unwanted top padding remains: top=${state.stageTop}`);
            } else {
              if(!state.background.includes('desktop-skin.webp')) throw new Error(`${label}: desktop skin is not active: ${state.background}`);
              if(state.stageWidth<1000) throw new Error(`${label}: desktop radio lost physical scale: ${state.stageWidth}`);
              if(!state.tubeVisible || !state.steamVisible) throw new Error(`${label}: desktop haunted tube/steam overlays are missing`);
            }
            console.log(label,state);
          }

          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--mute-audio']});

            const desktop=await browser.newPage();
            await desktop.setViewport({width:1440,height:1100,deviceScaleFactor:1});
            await inspect(desktop,'desktop',false);
            await desktop.evaluate(()=>document.querySelector('.skin-stage.desktop')?.classList.add('is-playing'));
            await desktop.screenshot({path:'visual-output/halloween-radio-desktop.png',fullPage:true});

            const phone=await browser.newPage();
            await phone.setViewport({width:390,height:844,deviceScaleFactor:1});
            await inspect(phone,'phone',true);
            await phone.evaluate(()=>document.querySelector('.skin-stage.phone')?.classList.add('is-playing'));
            await phone.screenshot({path:'visual-output/halloween-radio-phone.png',fullPage:true});

            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halloween-radio-visuals
          path: visual-output/*.png
          if-no-files-found: warn
