name: Louisburg Local routing hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/louisburg-local-routing-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply routing hotfix from staged patch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          prior='d7631663895ffbc2e8e0ab737bd63f3f48e5f53d:.github/workflows/louisburg-local-routing-hotfix.yml'
          text=subprocess.check_output(['git','show',prior],text=True)
          marker="          python - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY\n",start)
          lines=text[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code,'routing-hotfix.py','exec'),{})
          PY

      - name: Verify patched source
        shell: bash
        run: |
          cp louisburg-local/collector-v1/SocialIntake.gs /tmp/SocialIntake.js
          cp louisburg-local/collector-v1/Collector.gs /tmp/Collector.js
          cp louisburg-local/collector-v1/Config.gs /tmp/Config.js
          node --check /tmp/SocialIntake.js
          node --check /tmp/Collector.js
          node --check /tmp/Config.js
          cd louisburg-local/social-browser-worker
          npm install --no-audit --no-fund
          npm test

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/louisburg-local-routing-hotfix.yml
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Louisburg Local auto-verification routing and source ownership'
          git push origin HEAD:main
