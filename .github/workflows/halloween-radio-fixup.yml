name: Halloween Radio One-Time CSS Fixup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halloween-radio-fixup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply desktop brand and phone layout fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('halloween-radio/assets/css/radio.css')
          s=p.read_text()
          reps={
            '.brand-lockup{justify-self:center;border:0;background:transparent;text-align:center;cursor:pointer;text-transform:uppercase;text-shadow:0 2px #000;transform:rotate(-.5deg)}':'.brand-lockup{justify-self:center;border:0;background:transparent;text-align:center;cursor:pointer;text-transform:uppercase;text-shadow:0 2px #000;transform:rotate(-.5deg);white-space:nowrap;max-width:100%}',
            '.brand-main{display:block;color:#caa26c;font-weight:700;font-size:clamp(42px,5.3vw,74px);':'.brand-main{display:block;color:#caa26c;font-weight:700;font-size:clamp(38px,4.7vw,66px);',
            '.cabinet-front{min-height:100svh;padding:16px 13px calc(16px + env(safe-area-inset-bottom));':'.cabinet-front{min-height:100svh;padding:14px 8px calc(14px + env(safe-area-inset-bottom));',
            '.tuner-outer{padding:9px;border-radius:16px;transform:none}.tuner-bezel{padding:8px;border-radius:11px}.tuner-cavity{padding:10px;border-radius:7px}':'.tuner-outer{padding:6px;border-radius:16px;transform:none}.tuner-bezel{padding:5px;border-radius:11px}.tuner-cavity{padding:5px;border-radius:7px}',
            '.nav-btn:nth-of-type(3),.nav-btn:nth-of-type(4){display:none}.nav-medallion{order:3;':'.nav-btn:nth-of-type(5),.nav-btn:nth-of-type(6){display:none}.nav-btn:nth-of-type(1){order:1}.nav-btn:nth-of-type(2){order:2}.nav-btn:nth-of-type(3){order:4}.nav-btn:nth-of-type(7){order:5}.nav-medallion{order:3;'
          }
          for old,new in reps.items():
            if old not in s:
              raise SystemExit(f'Missing expected CSS fragment: {old[:100]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No CSS changes needed.'
            exit 0
          fi
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add halloween-radio/assets/css/radio.css
          git commit -m 'Fix Halloween desktop branding and phone layout'
          git push origin main
