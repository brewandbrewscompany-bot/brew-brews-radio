name: Louisburg food filter correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/louisburg-food-filter-fix.yml'

permissions:
  contents: write

jobs:
  fix-food-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten Food and Drink filtering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('louisburg-local/web-v3/index.html')
          s=p.read_text()
          old="      if(cat==='FOOD')return tags.has('food')||tags.has('food-drink')||/\\bfood\\b|\\bdrink\\b|\\bcoffee\\b|\\brestaurant\\b|\\bmenu\\b|\\bshake\\b|\\bcider\\b/.test(text);"
          new="""      if(cat==='FOOD'){
                const category=String(i.category||'').toLowerCase();
                const explicitFood=tags.has('food')||tags.has('food-drink')||/\\bfood\\b|\\bdrink\\b|\\bcoffee\\b|\\bcafe\\b|\\bcafé\\b|\\brestaurant\\b|\\bmenu\\b|\\bshake\\b/.test(category);
                const eventLike=type==='event / activity'||/\\bevent\\b|\\bfestival\\b|\\brun\\b|\\bmeeting\\b|\\bregistration\\b|\\bcommunity\\b/.test(category);
                if(explicitFood)return true;
                if(eventLike)return false;
                const foodSignal=/\\bfood\\b|\\bdrink\\b|\\bcoffee\\b|\\bcafe\\b|\\bcafé\\b|\\brestaurant\\b|\\bmenu\\b|\\bshake\\b|\\bmeal\\b|\\bchicken\\b|\\bsteak\\b|\\bburger\\b|\\bcider\\b/.test(text);
                return foodSignal&&(type==='deal / special'||type==='new product / offering'||isBusinessSource(i));
              }"""
          if old not in s:
              raise SystemExit('Expected Food filter line not found; refusing broad rewrite')
          s=s.replace(old,new,1)
          s=s.replace('<button type="button" data-bottom="FOOD"><b>🍽️</b>Food</button>','<button type="button" data-bottom="FOOD"><b>🍽️</b>Food + Drink</button>',1)
          p.write_text(s)
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('script block missing')
          Path('/tmp/louisburg.js').write_text(m.group(1))
          PY
          node --check /tmp/louisburg.js
          git diff --check
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add louisburg-local/web-v3/index.html
          git commit -m 'Tighten Food and Drink filtering'
          git push
