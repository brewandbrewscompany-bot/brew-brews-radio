name: Halloween Radio Check

on:
  push:
    branches: [main]
    paths:
      - 'halloween-radio/**'
      - '.github/workflows/halloween-radio-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and JSON
        run: |
          node --check halloween-radio/assets/js/skin-radio.js
          node --check halloween-radio/assets/js/radio.js
          python -m json.tool halloween-radio/data/tracks.json >/dev/null
          python -m json.tool halloween-radio/data/broadcasts.json >/dev/null
          python -m json.tool halloween-radio/data/remaining-8.json >/dev/null
          python -m json.tool halloween-radio/data/final-upload-audit.json >/dev/null

      - name: Validate manifest audio paths, pacing, and playback-intent rule
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('halloween-radio')
          manifest = json.loads((root/'data/tracks.json').read_text())
          tracks = manifest['tracks']
          assert len(tracks) == manifest['uploadedTrackCount'] == manifest['expectedTrackCount'] == 34, (len(tracks), manifest['uploadedTrackCount'])
          assert manifest.get('plannedTrackCount') == 0, manifest.get('plannedTrackCount')
          missing = [t['file'] for t in tracks if not (root/t['file']).is_file()]
          assert not missing, f'Missing audio files: {missing}'
          names = [t['file'] for t in tracks]
          assert len(names) == len(set(names)), 'Duplicate manifest file paths found'

          for t in tracks:
            assert t.get('contentType') in {'vocal','instrumental'}, f"Missing/invalid contentType: {t['id']}"

          for station in manifest['stations']:
            freq = station['frequency']
            lineup = sorted((t for t in tracks if t['station'] == freq), key=lambda t: t['order'])
            assert lineup, f'Empty station: {freq}'
            orders = [t['order'] for t in lineup]
            assert orders == list(range(1, len(lineup)+1)), f'Bad order sequence on {freq}: {orders}'
            types = [t['contentType'] for t in lineup]
            assert not any(a == b == 'vocal' for a,b in zip(types,types[1:])), f'Back-to-back vocal tracks on {freq}: {types}'
            assert 'instrumental,instrumental,instrumental' not in ','.join(types), f'Three instrumentals in a row on {freq}: {types}'

          closing = [t for t in tracks if t['id'] == 'the-town-goes-quiet']
          assert len(closing) == 1 and closing[0]['station'] == 103.1, 'Final signoff track missing from B&B Radio'
          assert closing[0]['order'] == max(t['order'] for t in tracks if t['station'] == 103.1), 'Final signoff must close 103.1 sequence'

          js = (root/'assets/js/skin-radio.js').read_text()
          assigns = re.findall(r'state\.playbackIntent\s*=\s*true', js)
          assert len(assigns) == 1, f'Expected exactly one playbackIntent=true assignment, found {len(assigns)}'
          assert 'state.playbackIntent=false' in js, 'Skin app must initialize playbackIntent=false'
          print(f"Validated {len(tracks)} uploaded tracks, station pacing, final signoff placement, and skin-app playback-intent invariant.")
          PY

      - name: Install browser test helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Browser smoke test
        run: |
          python3 -m http.server 8000 --directory . >/tmp/halloween-radio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium not found on runner.'
            exit 1
          fi
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const sleep = ms => new Promise(r=>setTimeout(r,ms));

          (async()=>{
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: ['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--mute-audio']
            });
            const page = await browser.newPage();
            await page.setViewport({width:1024,height:900,deviceScaleFactor:1});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/halloween-radio/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('.desktop [data-title]')?.textContent.trim()==='IRONCLAD',{timeout:10000});

            const initial = await page.$eval('#radioAudio',a=>({paused:a.paused,src:a.currentSrc||a.src}));
            if(!initial.paused) throw new Error('Audio autoplayed on page load');
            if(!initial.src.includes('ironclad.mp3')) throw new Error(`Unexpected default source: ${initial.src}`);

            // Disable randomized Haunted Auto Tune only for deterministic testing.
            if(await page.$eval('#autoSwitch',b=>b.getAttribute('aria-pressed')==='true')){
              await page.click('#autoSwitch');
            }

            async function clickStation(freq){
              await page.waitForFunction(f=>[...document.querySelectorAll('.desktop .station-label')].some(b=>b.textContent.includes(f)),{},freq);
              await page.evaluate(f=>{
                const b=[...document.querySelectorAll('.desktop .station-label')].find(x=>x.textContent.includes(f));
                if(!b) throw new Error(`Station button not found: ${f}`);
                b.click();
              },freq);
            }

            await clickStation('88.3');
            await sleep(250);
            if(!(await page.$eval('#radioAudio',a=>a.paused))) throw new Error('Station selection started audio while paused');
            if((await page.$eval('.desktop [data-title]',e=>e.textContent.trim()))!=='Welcome to the Haunted Roast') throw new Error('88.3 did not select its first real track');

            await page.click('.desktop [data-hit="next"]');
            await sleep(200);
            if(!(await page.$eval('#radioAudio',a=>a.paused))) throw new Error('Next started audio while paused');
            if((await page.$eval('.desktop [data-title]',e=>e.textContent.trim()))!=='Midnight Static') throw new Error('Next did not advance to Midnight Static on 88.3');

            await page.click('.desktop [data-hit="play"]');
            await page.waitForFunction(()=>!document.querySelector('#radioAudio').paused && document.querySelector('.desktop').classList.contains('is-playing'),{timeout:10000});

            await clickStation('91.7');
            await page.waitForFunction(()=>{
              const a=document.querySelector('#radioAudio');
              return !a.paused && (a.currentSrc||a.src).includes('haunted-roast.mp3') && document.querySelector('.desktop').classList.contains('is-playing');
            },{timeout:12000});

            await page.click('.desktop [data-hit="play"]');
            await sleep(200);
            if(!(await page.$eval('#radioAudio',a=>a.paused))) throw new Error('Explicit Pause did not stop station audio');
            if(await page.$eval('.desktop',e=>e.classList.contains('is-playing'))) throw new Error('Paused radio still shows playing state');

            await clickStation('106.7');
            await sleep(300);
            if(!(await page.$eval('#radioAudio',a=>a.paused))) throw new Error('Station change after Pause restarted audio');

            const meta = await page.evaluate(()=>({
              title: document.querySelector('.desktop [data-title]')?.textContent.trim(),
              position: document.querySelector('.desktop [data-position]')?.textContent.trim(),
              station: document.querySelector('#drawerStation')?.textContent.trim(),
              freq: document.querySelector('#drawerFreq')?.textContent.trim(),
              playing: document.querySelector('.desktop')?.classList.contains('is-playing')
            }));
            if(meta.title!=='The Witching Hour') throw new Error(`106.7 display mismatch: ${JSON.stringify(meta)}`);
            if(meta.position!=='1 / 5') throw new Error(`106.7 position mismatch: ${JSON.stringify(meta)}`);
            if(meta.station!=='Witching Hour' || meta.freq!=='106.7 FM') throw new Error(`106.7 station metadata mismatch: ${JSON.stringify(meta)}`);
            if(meta.playing) throw new Error(`Paused radio should not be ON AIR: ${JSON.stringify(meta)}`);
            if(pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);

            console.log('Skin radio browser smoke test passed:',meta);
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
