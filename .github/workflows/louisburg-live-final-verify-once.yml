name: Louisburg live final verify once

on:
  push:
    paths:
      - .github/workflows/louisburg-live-final-verify-once.yml

permissions:
  contents: read

jobs:
  verify-live-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENDPOINT: https://script.google.com/macros/s/AKfycbxw9gJBH50L_VZbgp6i_mHHnfPXAkraIqv63BA2XqWtb-XaaczXxdf89WveFkAOwV-azw/exec
      LL_SOCIAL_INGEST_KEY: ${{ secrets.LL_SOCIAL_INGEST_KEY }}
      MARKER: LL_DEPLOY_FINAL_20260916_1342
    steps:
      - name: Verify feed endpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -L --fail --silent --show-error --max-time 45 "$ENDPOINT?action=feed")
          echo "$body" | jq -e '.ok == true and (.items | type == "array")' >/dev/null
          echo "feed_ok=true"

      - name: Verify fresh social intake is processed immediately
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg key "$LL_SOCIAL_INGEST_KEY" \
            --arg marker "$MARKER" \
            '{action:"social_intake",ingestKey:$key,organization:("Louisburg Local Deploy Final Test "+$marker),platform:"TEST",profileUrl:("https://example.com/"+$marker+"/profile"),postUrl:("https://example.com/"+$marker+"/post"),postId:($marker+"-post"),postDate:"2026-09-16T13:42:00-05:00",postText:"Louisburg KS. Today only: final deployment verification special until 8 PM.",activityType:"Deal / Special",louisburgMatch:"YES"}')
          body=$(curl -L --fail --silent --show-error --max-time 45 -H 'Content-Type: application/json' -d "$payload" "$ENDPOINT")
          echo "fresh_response=$body"
          echo "$body" | jq -e '.ok == true and .received == true and .duplicate == false and .immediateProcess == "PROCESSED"' >/dev/null

      - name: Verify duplicate delivery is skipped safely
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg key "$LL_SOCIAL_INGEST_KEY" \
            --arg marker "$MARKER" \
            '{action:"social_intake",ingestKey:$key,organization:("Louisburg Local Deploy Final Test "+$marker),platform:"TEST",profileUrl:("https://example.com/"+$marker+"/profile"),postUrl:("https://example.com/"+$marker+"/post"),postId:($marker+"-post"),postDate:"2026-09-16T13:42:00-05:00",postText:"Louisburg KS. Today only: final deployment verification special until 8 PM.",activityType:"Deal / Special",louisburgMatch:"YES"}')
          body=$(curl -L --fail --silent --show-error --max-time 45 -H 'Content-Type: application/json' -d "$payload" "$ENDPOINT")
          echo "duplicate_response=$body"
          echo "$body" | jq -e '.ok == true and .received == true and .duplicate == true and .immediateProcess == "DUPLICATE_SKIPPED"' >/dev/null
