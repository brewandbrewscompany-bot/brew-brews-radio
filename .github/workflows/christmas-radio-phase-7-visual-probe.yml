name: Christmas Radio Phase 7.2 Crisp Live UI High-DPI Check

on:
  push:
    branches: [christmas-radio-phase-7-1-crisp-accepted-art]
    paths:
      - 'christmas-radio/**'
      - '.github/workflows/christmas-radio-phase-7-visual-probe.yml'
  workflow_dispatch:

jobs:
  visual-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prove atmosphere artwork and crisp live UI wiring
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, hashlib
          p=Path('christmas-radio/artwork/render-430x932(1).png')
          if not p.exists():
              raise SystemExit('atmosphere artwork is missing')
          b=p.read_bytes()
          if b[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('atmosphere artwork is not PNG')
          w,h=struct.unpack('>II', b[16:24])
          if (w,h)!=(430,932):
              raise SystemExit(f'atmosphere artwork dimensions changed: {(w,h)}')
          if len(b)!=572728:
              raise SystemExit(f'atmosphere artwork byte size changed: {len(b)}')
          print(f'atmosphere art: {w}x{h}; bytes={len(b)}; sha256={hashlib.sha256(b).hexdigest()}')
          manifest=json.loads(Path('christmas-radio/manifest.webmanifest').read_text())
          if manifest.get('display')!='standalone' or manifest.get('orientation')!='portrait':
              raise SystemExit('app manifest lost standalone portrait configuration')
          if not Path('christmas-radio/favicon.svg').exists():
              raise SystemExit('Christmas Radio favicon is missing')
          PY
          test "$(grep -o 'render-430x932(1).png' christmas-radio/assets/css/art-skin.css | wc -l)" -ge 1
          grep -q 'artwork/render-430x932(1).png' christmas-radio/index.html
          grep -q 'type="image/png"' christmas-radio/index.html
          grep -q 'rel="manifest" href="manifest.webmanifest"' christmas-radio/index.html
          grep -q 'rel="icon" href="favicon.svg"' christmas-radio/index.html
          grep -q 'Phase 7.2 production vector skin' christmas-radio/assets/css/art-skin.css
          grep -q '\.radio-crown' christmas-radio/assets/css/art-skin.css
          grep -q '\.station-readout' christmas-radio/assets/css/art-skin.css
          grep -q '\.bottom-nav' christmas-radio/assets/css/art-skin.css
          ! grep -Eq 'flagship-roastery-stage-approved\.png|flagship-roastery-stage\.jpg|flagship-roastery-stage\.webp|flagship-roastery\.avif' christmas-radio/index.html christmas-radio/assets/css/art-skin.css

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Validate crisp live UI and interactions at 430x932 DPR 3
        run: |
          set -euo pipefail
          mkdir -p phase7-output
          python3 -m http.server 8000 --directory . >/tmp/christmas-radio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME_BIN,
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:3});
            const httpErrors=[];
            const pageErrors=[];
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});
            page.on('pageerror',e=>pageErrors.push(String(e)));

            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'networkidle0'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            await page.waitForFunction(()=>document.querySelector('#frequencyLabel')?.textContent.trim()==='103.1',{timeout:10000});

            const assetStatus=await page.evaluate(async()=>{
              const [manifest,favicon]=await Promise.all([fetch('manifest.webmanifest'),fetch('favicon.svg')]);
              const manifestJson=await manifest.json();
              return {manifest:manifest.status,favicon:favicon.status,display:manifestJson.display,orientation:manifestJson.orientation};
            });
            if(assetStatus.manifest!==200||assetStatus.favicon!==200||assetStatus.display!=='standalone'||assetStatus.orientation!=='portrait'){
              throw new Error('App shell assets failed: '+JSON.stringify(assetStatus));
            }

            // Exercise Stations panel, station selection, and restore the flagship station.
            await page.click('.bottom-nav button[data-panel="stationsPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#stationsPanel').hidden&&!document.querySelector('#panelScrim').hidden);
            const stationCount=await page.$$eval('#stationGrid .station-card',cards=>cards.length);
            if(stationCount!==6)throw new Error(`Expected 6 station cards, found ${stationCount}`);
            await page.click('#stationGrid .station-card:nth-child(1)');
            await page.waitForFunction(()=>document.body.dataset.station==='snowfall-am'&&document.querySelector('#frequencyLabel')?.textContent.trim()==='88.7');
            const tunedSnowfall=await page.evaluate(()=>({station:document.body.dataset.station,frequency:document.querySelector('#frequencyLabel').textContent.trim()}));

            await page.click('.bottom-nav button[data-panel="stationsPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#stationsPanel').hidden);
            await page.click('#stationGrid .station-card:nth-child(5)');
            await page.waitForFunction(()=>document.body.dataset.station==='bb-christmas-radio'&&document.querySelector('#frequencyLabel')?.textContent.trim()==='103.1');

            // Exercise Now Playing panel and close behavior.
            await page.click('.bottom-nav button[data-panel="nowPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#nowPanel').hidden&&!document.querySelector('#panelScrim').hidden);
            const nowPanelVisible=await page.evaluate(()=>!document.querySelector('#nowPanel').hidden);
            await page.click('#nowPanel .panel-close');
            await page.waitForFunction(()=>document.querySelector('#nowPanel').hidden&&document.querySelector('#panelScrim').hidden);

            // Exercise volume control without starting audio.
            const volumeProbe=await page.evaluate(()=>{
              const input=document.querySelector('#volumeControl');
              const control=input.closest('.knob-control');
              const before=getComputedStyle(control).getPropertyValue('--knob-angle').trim();
              input.value='0.55';
              input.dispatchEvent(new Event('input',{bubbles:true}));
              const after=getComputedStyle(control).getPropertyValue('--knob-angle').trim();
              return {value:input.value,before,after};
            });
            if(volumeProbe.value!=='0.55'||!volumeProbe.after||volumeProbe.after===volumeProbe.before){
              throw new Error('Volume UI did not respond: '+JSON.stringify(volumeProbe));
            }

            const probe=await page.evaluate(async()=>{
              const img=new Image();
              img.src='artwork/render-430x932(1).png?phase7-2-check=1';
              await img.decode();
              const c=document.createElement('canvas');
              c.width=img.naturalWidth;c.height=img.naturalHeight;
              const ctx=c.getContext('2d',{willReadFrequently:true});
              ctx.drawImage(img,0,0);
              const data=ctx.getImageData(0,0,c.width,c.height).data;
              let sum=0,count=0,max=0,bright=0;
              for(let y=0;y<c.height;y+=3){
                for(let x=0;x<c.width;x+=3){
                  const i=(y*c.width+x)*4;
                  const lum=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];
                  sum+=lum;count++;max=Math.max(max,lum);if(lum>55)bright++;
                }
              }
              const scene=document.querySelector('.scene');
              const before=getComputedStyle(scene,'::before');
              const after=getComputedStyle(scene,'::after');
              const rect=s=>document.querySelector(s).getBoundingClientRect();
              const style=s=>getComputedStyle(document.querySelector(s));
              const play=rect('.play-button');
              const nav=rect('.bottom-nav');
              const radio=rect('.radio');
              const crown=rect('.radio-crown');
              const readout=rect('.station-readout');
              const sceneCopy=rect('.scene-copy');
              const panels=[...document.querySelectorAll('.app-panel')].map(p=>({id:p.id,hidden:p.hidden}));
              return {
                image:{width:img.naturalWidth,height:img.naturalHeight,averageLuminance:sum/count,maxLuminance:max,brightSampleFraction:bright/count},
                css:{beforeBackgroundImage:before.backgroundImage,afterBackgroundImage:after.backgroundImage},
                viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight},
                play:{left:play.left,top:play.top,width:play.width,height:play.height},
                nav:{left:nav.left,top:nav.top,right:nav.right,bottom:nav.bottom,width:nav.width,height:nav.height},
                radio:{left:radio.left,top:radio.top,right:radio.right,bottom:radio.bottom,width:radio.width,height:radio.height,display:style('.radio').display},
                crown:{left:crown.left,top:crown.top,width:crown.width,height:crown.height,display:style('.radio-crown').display,visibility:style('.radio-crown').visibility},
                readout:{left:readout.left,top:readout.top,width:readout.width,height:readout.height,display:style('.station-readout').display,visibility:style('.station-readout').visibility},
                sceneCopy:{left:sceneCopy.left,top:sceneCopy.top,width:sceneCopy.width,height:sceneCopy.height,display:style('.scene-copy').display},
                bodyStation:document.body.dataset.station||null,
                frequency:document.querySelector('#frequencyLabel')?.textContent.trim()||null,
                stationName:document.querySelector('#stationName')?.textContent.trim()||null,
                navLabels:[...document.querySelectorAll('.bottom-nav b')].map(x=>x.textContent.trim()),
                panels
              };
            });

            const interactions={assetStatus,tunedSnowfall,nowPanelVisible,volumeProbe};
            const criticalHttp=httpErrors.filter(x=>!x.url.endsWith('/favicon.ico'));
            const report={status:'PASS',...probe,interactions,httpErrors,pageErrors};

            if(probe.image.width!==430||probe.image.height!==932)throw new Error('Atmosphere art dimensions changed');
            if(probe.viewport.dpr!==3)throw new Error('High-DPI gate did not run at DPR 3');
            if(probe.image.averageLuminance<20||probe.image.maxLuminance<100||probe.image.brightSampleFraction<.08)throw new Error('Atmosphere artwork decoded too dark');
            if(!probe.css.beforeBackgroundImage.includes('render-430x932(1).png'))throw new Error('Atmosphere artwork is not loaded behind the live UI');
            if(probe.bodyStation!=='bb-christmas-radio'||probe.frequency!=='103.1')throw new Error('Flagship station was not restored after interaction test');
            if(!probe.stationName.includes('Christmas Radio'))throw new Error('Live station name is missing');
            if(probe.viewport.scrollWidth>430)throw new Error('Horizontal phone overflow detected');
            if(probe.play.width<55||probe.play.height<55)throw new Error('Play target is too small');
            if(probe.radio.width<360||probe.radio.display==='none')throw new Error('Live radio face is not rendered');
            if(probe.crown.display==='none'||probe.crown.visibility==='hidden'||probe.crown.height<35)throw new Error('Crisp live radio crown is not visible');
            if(probe.readout.display==='none'||probe.readout.visibility==='hidden'||probe.readout.height<35)throw new Error('Crisp live station readout is not visible');
            if(probe.sceneCopy.display==='none'||probe.sceneCopy.height<30)throw new Error('Crisp live scene header is not visible');
            if(probe.navLabels.join('|')!=='Stations|Now Playing|About|Games|Shop')throw new Error('Navigation labels changed');
            if(Math.abs(probe.nav.bottom-932)>1||probe.nav.left<0||probe.nav.right>431)throw new Error('Bottom navigation is not fully on-screen');
            if(probe.radio.top>=probe.nav.top)throw new Error('Radio starts below navigation');
            if(probe.panels.some(p=>!p.hidden))throw new Error('A panel remained open after interaction test: '+JSON.stringify(probe.panels));
            if(criticalHttp.length)throw new Error('HTTP resource errors: '+JSON.stringify(criticalHttp));
            if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '));

            await page.screenshot({path:'phase7-output/render-430x932-dpr3.png',fullPage:false});
            fs.writeFileSync('phase7-output/report.json',JSON.stringify(report,null,2));
            console.log('PHASE 7.2 CRISP LIVE UI + INTERACTION CHECK',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('phase7-output/render-430x932-dpr3.png').read_bytes()
          w,h=struct.unpack('>II',b[16:24])
          print(f'physical viewport screenshot: {w}x{h}')
          if (w,h)!=(1290,2796):
              raise SystemExit(f'unexpected DPR3 screenshot dimensions: {(w,h)}')
          PY

      - name: Upload Phase 7.2 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-radio-phase-7-2-crisp-live-ui-evidence
          path: phase7-output/
          if-no-files-found: warn
          retention-days: 14
