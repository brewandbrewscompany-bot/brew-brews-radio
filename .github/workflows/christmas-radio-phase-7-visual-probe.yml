name: Christmas Radio Phase 7.3 Approved Skin Alignment Check

on:
  push:
    branches: [christmas-radio-phase-7-1-crisp-accepted-art]
    paths:
      - 'christmas-radio/**'
      - '.github/workflows/christmas-radio-phase-7-visual-probe.yml'
  workflow_dispatch:

jobs:
  visual-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prove approved skin wiring
        run: |
          set -euo pipefail
          test -s christmas-radio/artwork/christmas-radio-approved-skin.webp
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          p=Path('christmas-radio/artwork/christmas-radio-approved-skin.webp')
          b=p.read_bytes()
          if b[:4] != b'RIFF' or b[8:12] != b'WEBP':
              raise SystemExit('approved skin is not WebP')
          print('approved skin bytes=',len(b),'sha256=',hashlib.sha256(b).hexdigest())
          manifest=json.loads(Path('christmas-radio/manifest.webmanifest').read_text())
          if manifest.get('display')!='standalone' or manifest.get('orientation')!='portrait':
              raise SystemExit('app manifest lost standalone portrait configuration')
          if not Path('christmas-radio/favicon.svg').exists():
              raise SystemExit('Christmas Radio favicon is missing')
          PY
          grep -q 'christmas-radio-approved-skin.webp' christmas-radio/assets/css/art-skin.css
          grep -q 'artwork/christmas-radio-approved-skin.webp' christmas-radio/index.html
          grep -q 'type="image/webp"' christmas-radio/index.html
          grep -q 'Phase 7.3 approved-art overlay skin' christmas-radio/assets/css/art-skin.css
          grep -q 'transparent hit areas' christmas-radio/assets/css/art-skin.css
          grep -q 'rel="manifest" href="manifest.webmanifest"' christmas-radio/index.html
          grep -q 'rel="icon" href="favicon.svg"' christmas-radio/index.html
          ! grep -q 'render-430x932(1).png' christmas-radio/index.html christmas-radio/assets/css/art-skin.css

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Validate skin alignment and interactions at 430x932 DPR 3
        run: |
          set -euo pipefail
          mkdir -p phase7-output
          python3 -m http.server 8000 --directory . >/tmp/christmas-radio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:3});
            const httpErrors=[]; const pageErrors=[];
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'networkidle0'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            await page.waitForFunction(()=>document.querySelector('#frequencyLabel')?.textContent.trim()==='103.1',{timeout:10000});

            const assetStatus=await page.evaluate(async()=>{
              const [manifest,favicon]=await Promise.all([fetch('manifest.webmanifest'),fetch('favicon.svg')]);
              const manifestJson=await manifest.json();
              return {manifest:manifest.status,favicon:favicon.status,display:manifestJson.display,orientation:manifestJson.orientation};
            });
            if(assetStatus.manifest!==200||assetStatus.favicon!==200||assetStatus.display!=='standalone'||assetStatus.orientation!=='portrait') throw new Error('App shell assets failed: '+JSON.stringify(assetStatus));

            const initialAlignment=await page.evaluate(async()=>{
              const img=new Image(); img.src='artwork/christmas-radio-approved-skin.webp?phase7-3-check=1'; await img.decode();
              const rect=s=>{const r=document.querySelector(s).getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height,cx:r.left+r.width/2,cy:r.top+r.height/2}};
              const scene=document.querySelector('.scene'); const before=getComputedStyle(scene,'::before');
              return {
                image:{width:img.naturalWidth,height:img.naturalHeight},
                css:{skin:before.backgroundImage},
                viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio,scrollWidth:document.documentElement.scrollWidth},
                play:rect('.play-button'),volume:rect('.volume-control'),tuning:rect('.tuner-control'),nav:rect('.bottom-nav'),
                readoutVisibility:getComputedStyle(document.querySelector('.station-readout')).visibility,
                navLabels:[...document.querySelectorAll('.bottom-nav b')].map(x=>x.textContent.trim())
              };
            });
            if(initialAlignment.image.width!==852||initialAlignment.image.height!==1846) throw new Error('Approved skin dimensions changed: '+JSON.stringify(initialAlignment.image));
            if(!initialAlignment.css.skin.includes('christmas-radio-approved-skin.webp')) throw new Error('Approved skin is not the rendered scene');
            if(initialAlignment.viewport.dpr!==3||initialAlignment.viewport.scrollWidth>430) throw new Error('Phone viewport gate failed');
            if(Math.abs(initialAlignment.play.cx-215)>8||Math.abs(initialAlignment.play.cy-546)>10) throw new Error('Play hit area is not aligned: '+JSON.stringify(initialAlignment.play));
            if(Math.abs(initialAlignment.volume.cx-106)>9||Math.abs(initialAlignment.volume.cy-556)>11) throw new Error('Volume hit area is not aligned: '+JSON.stringify(initialAlignment.volume));
            if(Math.abs(initialAlignment.tuning.cx-317)>9||Math.abs(initialAlignment.tuning.cy-556)>11) throw new Error('Tuning hit area is not aligned: '+JSON.stringify(initialAlignment.tuning));
            if(initialAlignment.play.width<70||initialAlignment.volume.width<58||initialAlignment.tuning.width<58) throw new Error('Radio hit targets are too small');
            if(Math.abs(initialAlignment.nav.bottom-932)>1||initialAlignment.nav.top>830) throw new Error('Nav overlay is not aligned to baked navigation');
            if(initialAlignment.readoutVisibility!=='hidden') throw new Error('Default 103.1 live plaque should not cover approved baked readout');
            if(initialAlignment.navLabels.join('|')!=='Stations|Now Playing|About|Games|Shop') throw new Error('Navigation labels changed');

            await page.click('.bottom-nav button[data-panel="stationsPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#stationsPanel').hidden&&!document.querySelector('#panelScrim').hidden);
            const stationCount=await page.$$eval('#stationGrid .station-card',cards=>cards.length);
            if(stationCount!==6) throw new Error(`Expected 6 station cards, found ${stationCount}`);
            await page.click('#stationGrid .station-card:nth-child(1)');
            await page.waitForFunction(()=>document.body.dataset.station==='snowfall-am'&&document.querySelector('#frequencyLabel')?.textContent.trim()==='88.7');
            const tunedSnowfall=await page.evaluate(()=>({station:document.body.dataset.station,frequency:document.querySelector('#frequencyLabel').textContent.trim(),plaque:getComputedStyle(document.querySelector('.station-readout')).visibility}));
            if(tunedSnowfall.plaque!=='visible') throw new Error('Non-default station plaque did not appear');

            await page.$eval('#tuningKnob',el=>{el.value='2';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForFunction(()=>document.body.dataset.station==='sleigh-bell-rock');
            await page.click('.bottom-nav button[data-panel="stationsPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#stationsPanel').hidden);
            await page.click('#stationGrid .station-card:nth-child(5)');
            await page.waitForFunction(()=>document.body.dataset.station==='bb-christmas-radio'&&document.querySelector('#frequencyLabel')?.textContent.trim()==='103.1');
            const restoredVisibility=await page.$eval('.station-readout',el=>getComputedStyle(el).visibility);
            if(restoredVisibility!=='hidden') throw new Error('Flagship baked readout was not restored cleanly');

            await page.click('.bottom-nav button[data-panel="nowPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#nowPanel').hidden&&!document.querySelector('#panelScrim').hidden);
            await page.click('#nowPanel .panel-close');
            await page.waitForFunction(()=>document.querySelector('#nowPanel').hidden&&document.querySelector('#panelScrim').hidden);
            const volumeProbe=await page.evaluate(()=>{
              const input=document.querySelector('#volumeControl'); const control=input.closest('.knob-control');
              const before=getComputedStyle(control).getPropertyValue('--knob-angle').trim(); input.value='0.55'; input.dispatchEvent(new Event('input',{bubbles:true}));
              const after=getComputedStyle(control).getPropertyValue('--knob-angle').trim(); return {value:input.value,before,after};
            });
            if(volumeProbe.value!=='0.55'||!volumeProbe.after||volumeProbe.after===volumeProbe.before) throw new Error('Volume control did not respond: '+JSON.stringify(volumeProbe));

            const finalProbe=await page.evaluate(()=>({
              bodyStation:document.body.dataset.station||null,
              frequency:document.querySelector('#frequencyLabel')?.textContent.trim()||null,
              panels:[...document.querySelectorAll('.app-panel')].map(p=>({id:p.id,hidden:p.hidden})),
              playPressed:document.querySelector('#playButton').getAttribute('aria-pressed')
            }));
            const criticalHttp=httpErrors.filter(x=>!x.url.endsWith('/favicon.ico'));
            if(finalProbe.bodyStation!=='bb-christmas-radio'||finalProbe.frequency!=='103.1') throw new Error('Flagship station not restored');
            if(finalProbe.panels.some(p=>!p.hidden)) throw new Error('Panel remained open: '+JSON.stringify(finalProbe.panels));
            if(criticalHttp.length) throw new Error('HTTP resource errors: '+JSON.stringify(criticalHttp));
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));

            await page.screenshot({path:'phase7-output/render-430x932-dpr3.png',fullPage:false});
            const report={status:'PASS',initialAlignment,interactions:{assetStatus,tunedSnowfall,volumeProbe},finalProbe,httpErrors,pageErrors};
            fs.writeFileSync('phase7-output/report.json',JSON.stringify(report,null,2));
            console.log('PHASE 7.3 APPROVED SKIN ALIGNMENT CHECK',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('phase7-output/render-430x932-dpr3.png').read_bytes()
          w,h=struct.unpack('>II',b[16:24])
          print(f'physical viewport screenshot: {w}x{h}')
          if (w,h)!=(1290,2796): raise SystemExit(f'unexpected DPR3 screenshot dimensions: {(w,h)}')
          PY

      - name: Upload Phase 7.3 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-radio-phase-7-3-approved-skin-evidence
          path: phase7-output/
          if-no-files-found: warn
          retention-days: 14
