name: Witch Ride 3D Pass 17 Environment Polish

on:
  push:
    branches: [witch-ride-3d-environment-headlight-bean-pass-17]
    paths:
      - '.github/workflows/witch-ride-3d-pass17-polish.yml'
      - 'halloween-radio/games/witch-ride-3d/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pass17-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify isolated Pass 17 source
        shell: bash
        run: |
          git fetch origin main witch-ride-3d-release-candidate-pass-16 witch-ride-3d-environment-headlight-bean-pass-17
          echo "CURRENT_MAIN=$(git rev-parse origin/main)"
          echo "CURRENT_TARGET=$(git rev-parse origin/witch-ride-3d-environment-headlight-bean-pass-17)"
          test "$(git rev-parse origin/witch-ride-3d-environment-headlight-bean-pass-17)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          base='ea550e5c46db3764de972ce078804783be83dfbf'
          allowed={
            '.github/workflows/witch-ride-3d-pass17-polish.yml',
            'halloween-radio/games/witch-ride-3d/pass15-environment-traffic.js',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          extra=changed-allowed
          if extra: raise SystemExit('Unexpected Pass 17 changes: '+', '.join(sorted(extra)))
          if any(x.startswith('louisburg-local/') for x in changed): raise SystemExit('louisburg-local/ changed')
          protected=[
            'halloween-radio/games/witch-ride-3d/game.js',
            'halloween-radio/games/witch-ride-3d/index.html',
            'halloween-radio/games/witch-ride-3d/witch-centerpiece-pass.js',
            'halloween-radio/games/witch-ride-3d/assets/witch-rider.glb',
          ]
          for path in protected:
            if subprocess.call(['git','diff','--quiet',base,'HEAD','--',path])!=0:
              raise SystemExit('Locked source changed: '+path)
          print('Pass 17 isolated changes:',sorted(changed))
          PY
          node --check halloween-radio/games/witch-ride-3d/pass15-environment-traffic.js
          node --check halloween-radio/games/witch-ride-3d/game.js
          node --check halloween-radio/games/witch-ride-3d/witch-centerpiece-pass.js

      - name: Run real 430x932 PlayCanvas functional and visual gate
        shell: bash
        run: |
          npm install --no-save puppeteer-core@24.16.0
          rm -rf /tmp/pass16-base
          git worktree add --detach /tmp/pass16-base ea550e5c46db3764de972ce078804783be83dfbf
          python3 -m http.server 8000 --directory . >/tmp/pass17-current-http.log 2>&1 &
          CURRENT_PID=$!
          python3 -m http.server 8001 --directory /tmp/pass16-base >/tmp/pass17-base-http.log 2>&1 &
          BASE_PID=$!
          trap 'kill $CURRENT_PID $BASE_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const fs=require('fs'),puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const close=(a,b,t=.0001)=>Math.abs(a-b)<=t;
          const angleClose=(a,b,t=.001)=>Math.abs(((a-b+180)%360+360)%360-180)<=t;
          function samePose(a,b,label){
            for(const n of ['leg_L','leg_R','boot_L','boot_R'])for(let i=0;i<3;i++){
              if(!close(a[n].p[i],b[n].p[i]))throw Error(`${label} ${n} position drift`);
              if(!close(a[n].s[i],b[n].s[i]))throw Error(`${label} ${n} scale drift`);
              if(!angleClose(a[n].e[i],b[n].e[i]))throw Error(`${label} ${n} rotation drift`);
            }
          }
          async function pageReady(browser,port,pass17=false){
            const p=await browser.newPage();
            await p.setViewport({width:430,height:932,deviceScaleFactor:1,isMobile:true,hasTouch:true});
            await p.goto(`http://127.0.0.1:${port}/halloween-radio/games/witch-ride-3d/`,{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForFunction(want17=>window.WitchRide3D?.ready&&window.WitchRideWitchCenterpiecePass?.active&&window.WitchRidePass15Environment?.active&&(!want17||window.WitchRidePass17Environment?.active),{timeout:30000},pass17);
            return p;
          }
          async function scene(p){
            return p.evaluate(async()=>{
              const pc=await import('playcanvas'),app=pc.app,w=app.root.findByName('Witch Rig');
              const pose={};for(const n of ['leg_L','leg_R','boot_L','boot_R']){const e=w.findByName(n),p=e.getLocalPosition(),r=e.getLocalEulerAngles(),s=e.getLocalScale();pose[n]={p:[p.x,p.y,p.z],e:[r.x,r.y,r.z],s:[s.x,s.y,s.z]}}
              const road=app.root.findByName('Road Segment 0')?.findByName('Road'),m=road?.render?.material||road?.render?.meshInstances?.[0]?.material;
              let oncoming=0,halos=0,headlamps=0,headlightPoints=0;
              const walk=n=>{if(/^Oncoming Traffic \d+$/.test(n.name||''))oncoming++;if((n.name||'').startsWith('Pass15 Bean Halo '))halos++;if((n.name||'').startsWith('headlamp_'))headlamps++;if((n.name||'').startsWith('Headlight Glow')&&n.light)headlightPoints++;for(const c of n.children||[])walk(c)};walk(app.root);
              return {pose,detail:window.WitchRidePass15Environment.detail,road:m?{diffuse:[m.diffuse.r,m.diffuse.g,m.diffuse.b],gloss:m.gloss,metalness:m.metalness}:null,oncoming,halos,headlamps,headlightPoints,witchMeta:window.WitchRideWitchCenterpiecePass};
            });
          }
          async function stageBean(p,pos=null){
            return p.evaluate(async(pos)=>{
              const pc=await import('playcanvas'),app=pc.app,s=window.WitchRide3D.state,cam=app.root.findByName('Chase Camera');
              for(let i=0;i<16;i++){const x=app.root.findByName(`Coffee Bean ${i}`);if(x)x.enabled=i===0}
              const b=app.root.findByName('Coffee Bean 0');b.enabled=true;b.__active=true;
              let chosen=pos;
              if(!chosen){
                let best=null;
                for(const dx of [-2.2,-1.4,0,1.4,2.2])for(const z of [-1,-2.5,-4,-6,-8])for(const y of [1.05,1.35,1.65]){
                  const wp=[s.x+dx,y,z];b.setPosition(...wp);const q=cam.camera.worldToScreen(b.getPosition());
                  if(q.x<55||q.x>375||q.y<190||q.y>800)continue;
                  const score=(q.x-292)**2+(q.y-535)**2;if(!best||score<best.score)best={pos:wp,screen:[q.x,q.y],score};
                }
                if(!best)throw Error('could not stage visible bean');chosen=best.pos;
              }
              b.setPosition(...chosen);const q=cam.camera.worldToScreen(b.getPosition());return {pos:chosen,screen:[q.x,q.y]};
            },pos);
          }
          async function stageHeadlight(p,pos=null){
            return p.evaluate(async(pos)=>{
              const pc=await import('playcanvas'),app=pc.app,cam=app.root.findByName('Chase Camera');
              for(let i=0;i<7;i++){const c=app.root.findByName(`1938 Coupe ${i}`);if(c)c.enabled=i===0}
              for(let i=0;i<4;i++){const c=app.root.findByName(`Oncoming Traffic ${i}`);if(c)c.enabled=false}
              const car=app.root.findByName('1938 Coupe 0');car.enabled=true;car.__active=true;
              let chosen=pos;
              if(!chosen){
                let best=null;
                for(const x of [-2.6,-1.8,-1.0,0,1.0,1.8,2.6])for(const z of [-2.5,-4,-5.5,-7]){
                  const wp=[x,0,z];car.setPosition(...wp);const q=cam.camera.worldToScreen(car.getPosition());
                  if(q.x<70||q.x>360||q.y<280||q.y>730)continue;
                  const score=(q.x-215)**2+(q.y-500)**2;if(!best||score<best.score)best={pos:wp,screen:[q.x,q.y],score};
                }
                if(!best)throw Error('could not stage visible headlight car');chosen=best.pos;
              }
              car.setPosition(...chosen);const q=cam.camera.worldToScreen(car.getPosition());return {pos:chosen,screen:[q.x,q.y]};
            },pos);
          }
          async function enterAndPause(p){
            await p.click('#play');await p.waitForFunction(()=>window.WitchRide3D.state.mode==='playing');await sleep(250);await p.click('#pause');await p.waitForFunction(()=>window.WitchRide3D.state.mode==='paused');
          }
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--mute-audio']});
            const current=await pageReady(browser,8000,true),baseline=await pageReady(browser,8001,false);
            const boot=await current.evaluate(()=>({assetMode:window.WitchRide3D.assetMode,engine:window.WitchRide3D.engine,witch:window.WitchRideWitchCenterpiecePass,version:window.WitchRidePass17Environment?.version}));
            if(boot.assetMode!=='glb-pbr'||boot.engine!=='PlayCanvas'||boot.witch.lockedMeshBlob!=='4b6b7009e86a53dc35d9216ea8d29133584b280d'||boot.witch.gameplayScale!==.24)throw Error('locked witch boot contract '+JSON.stringify(boot));
            if(boot.version!=='pass17-environment-headlight-bean-v1')throw Error('wrong Pass 17 version '+boot.version);
            const pre=await scene(current),basePre=await scene(baseline),d=pre.detail;
            samePose(pre.pose,basePre.pose,'accepted RC comparison');
            const exact={roadSegments:9,headlightLensesAdjusted:14,headlightMountsAdjusted:14,headlightPointsAdjusted:14,softWetReflections:14,oncomingTraffic:4,beanHalos:16,beansRescaled:16,beanScale:.92,beanHaloScale:.34,beanHaloOpacity:.045,beanHaloIntensity:.22,beanLightIntensity:.055,beanLightRange:2.1,sceneExposure:1.70,softWetReflectionOpacity:.23,softWetReflectionIntensity:.33};
            if(!d.roadNeutralCharcoal||d.witchTouched!==false||d.reflectionPanels!==0)throw Error('environment flags '+JSON.stringify(d));
            for(const [k,v] of Object.entries(exact))if(!close(d[k],v,1e-6))throw Error(`Pass 17 ${k}: ${d[k]} != ${v}`);
            if(pre.oncoming!==4||pre.halos!==16||pre.headlamps<14||pre.headlightPoints<14)throw Error('scene integration counts '+JSON.stringify(pre));
            if(!pre.road||Math.max(...pre.road.diffuse)-Math.min(...pre.road.diffuse)>.01||pre.road.diffuse[2]>pre.road.diffuse[0]+.005)throw Error('road no longer neutral charcoal '+JSON.stringify(pre.road));

            await current.click('#play');await current.waitForFunction(()=>window.WitchRide3D.state.mode==='playing');await baseline.click('#play');await baseline.waitForFunction(()=>window.WitchRide3D.state.mode==='playing');await sleep(450);
            const start=await scene(current);await current.screenshot({path:'witch-pass17-mobile-gameplay-430x932.png'});await baseline.screenshot({path:'witch-pass17-baseline-mobile-430x932.png'});
            await sleep(850);await current.evaluate(()=>document.querySelector('#hud')?.classList.add('hidden'));await current.screenshot({path:'witch-pass17-environment-430x932.png'});await current.evaluate(()=>document.querySelector('#hud')?.classList.remove('hidden'));

            await current.keyboard.down('ArrowLeft');await sleep(600);await current.keyboard.up('ArrowLeft');await current.keyboard.down('ArrowRight');await sleep(900);await current.keyboard.up('ArrowRight');await sleep(300);
            const steered=await scene(current);samePose(steered.pose,start.pose,'steering');
            await current.click('#pause');await current.waitForFunction(()=>window.WitchRide3D.state.mode==='paused');const paused=await current.evaluate(()=>window.WitchRide3D.state.elapsed);await sleep(450);const paused2=await current.evaluate(()=>window.WitchRide3D.state.elapsed);if(Math.abs(paused2-paused)>.05)throw Error('pause regression');await current.click('#resume');await current.waitForFunction(()=>window.WitchRide3D.state.mode==='playing');
            const beansBefore=await current.evaluate(()=>window.WitchRide3D.state.beans);
            await current.evaluate(async()=>{const pc=await import('playcanvas'),app=pc.app,s=window.WitchRide3D.state,b=app.root.findByName('Coffee Bean 0');b.enabled=true;b.__active=true;b.setPosition(s.x,1.15,2.2)});
            await current.waitForFunction(b=>window.WitchRide3D.state.beans>b,{timeout:2500},beansBefore);
            await current.evaluate(async()=>{const pc=await import('playcanvas'),app=pc.app,s=window.WitchRide3D.state,h=app.root.findByName('1938 Coupe 0');h.enabled=true;h.__active=true;h.setPosition(s.x,0,2)});
            await current.waitForFunction(()=>window.WitchRide3D.state.mode==='over',{timeout:2500});
            const over=await current.evaluate(()=>({mode:window.WitchRide3D.state.mode,open:document.querySelector('#over')?.classList.contains('open'),hudHidden:document.querySelector('#hud')?.classList.contains('hidden')}));if(!over.open||!over.hudHidden)throw Error('game-over regression '+JSON.stringify(over));
            await current.click('#again');await current.waitForFunction(()=>window.WitchRide3D.state.mode==='playing');await sleep(300);const replay=await current.evaluate(()=>({...window.WitchRide3D.state}));if(replay.beans!==0||replay.score>20||replay.distance>.02)throw Error('replay regression '+JSON.stringify(replay));samePose((await scene(current)).pose,start.pose,'replay');

            const beanCurrent=await pageReady(browser,8000,true),beanBase=await pageReady(browser,8001,false);await enterAndPause(beanCurrent);await enterAndPause(beanBase);const beanStage=await stageBean(beanCurrent);const beanBaseStage=await stageBean(beanBase,beanStage.pos);await sleep(250);await beanCurrent.screenshot({path:'witch-pass17-bean-visibility-430x932.png'});await beanBase.screenshot({path:'witch-pass17-baseline-bean-430x932.png'});
            const headCurrent=await pageReady(browser,8000,true),headBase=await pageReady(browser,8001,false);await enterAndPause(headCurrent);await enterAndPause(headBase);const headStage=await stageHeadlight(headCurrent);const headBaseStage=await stageHeadlight(headBase,headStage.pos);await sleep(250);await headCurrent.screenshot({path:'witch-pass17-headlight-reflection-430x932.png'});await headBase.screenshot({path:'witch-pass17-baseline-headlight-430x932.png'});

            const closePage=await pageReady(browser,8000,true);await enterAndPause(closePage);await closePage.evaluate(async()=>{const pc=await import('playcanvas'),app=pc.app,cam=app.root.findByName('Chase Camera');const hide=['Road Segment','Fog Bank','Realism Fog','Atmosphere Ground Mist','Dead Tree','Fence ','Pumpkin ','1938 Coupe','Oncoming Traffic','Coffee Bean','Cinematic Foreground','Pass10','Pass11','Brew & Brews Haunted Roastery','Moon Halo','Moon','Pass15 Soft Wet Light'];for(const e of [...app.root.children])if(hide.some(x=>e.name?.startsWith(x)))e.enabled=false;document.querySelector('#hud')?.classList.add('hidden');for(const el of document.querySelectorAll('.screen'))el.classList.remove('open');cam.setPosition(2.15,3.55,10.25);cam.lookAt(0,3.05,1.80);cam.camera.fov=42});await sleep(300);await closePage.screenshot({path:'witch-pass17-close-witch-430x932.png'});

            const report={boot,environment:d,road:pre.road,baselineEnvironment:basePre.detail,beanStage,beanBaseStage,headStage,headBaseStage,over,replay,acceptedRCPose:basePre.pose,pass17Pose:pre.pose};fs.writeFileSync('witch-pass17-runtime-report.json',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Quantify visual lift and build comparisons
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageStat
          import json,math
          def luma(img):
            s=ImageStat.Stat(img.convert('L'));return s.mean[0]
          def crop_center(path,xy,r=54):
            im=Image.open(path).convert('RGB');x,y=xy
            return im.crop((max(0,int(x-r)),max(0,int(y-r)),min(im.width,int(x+r)),min(im.height,int(y+r))))
          def warm_energy(im):
            vals=[]
            for r,g,b in im.getdata(): vals.append(max(0,r-g)+0.45*max(0,g-b))
            return sum(vals)/max(1,len(vals))
          report=json.load(open('witch-pass17-runtime-report.json'))
          base=Image.open('witch-pass17-baseline-mobile-430x932.png').convert('RGB').crop((0,135,430,915))
          cur=Image.open('witch-pass17-mobile-gameplay-430x932.png').convert('RGB').crop((0,135,430,915))
          base_l,cur_l=luma(base),luma(cur);lift=cur_l/max(base_l,1e-6)
          bean_xy=report['beanStage']['screen'];bean_base_xy=report['beanBaseStage']['screen']
          bean_cur=crop_center('witch-pass17-bean-visibility-430x932.png',bean_xy);bean_base=crop_center('witch-pass17-baseline-bean-430x932.png',bean_base_xy)
          bean_warm,bean_base_warm=warm_energy(bean_cur),warm_energy(bean_base);bean_ratio=bean_warm/max(bean_base_warm,1e-6)
          head_xy=report['headStage']['screen'];head_base_xy=report['headBaseStage']['screen']
          head_cur=crop_center('witch-pass17-headlight-reflection-430x932.png',head_xy,110);head_base=crop_center('witch-pass17-baseline-headlight-430x932.png',head_base_xy,110)
          head_l,head_base_l=luma(head_cur),luma(head_base);head_ratio=head_l/max(head_base_l,1e-6)
          metrics={'baselineSceneLuma':base_l,'pass17SceneLuma':cur_l,'sceneLiftRatio':lift,'baselineBeanWarmEnergy':bean_base_warm,'pass17BeanWarmEnergy':bean_warm,'beanWarmRatio':bean_ratio,'baselineHeadlightZoneLuma':head_base_l,'pass17HeadlightZoneLuma':head_l,'headlightZoneRatio':head_ratio}
          report['visualMetrics']=metrics
          json.dump(report,open('witch-pass17-runtime-report.json','w'),indent=2)
          print(json.dumps(metrics,indent=2))
          if not (lift>1.02 and lift<1.40): raise SystemExit('overall scene lift outside slight-night polish range')
          if cur_l>90: raise SystemExit('scene no longer reads as moody night')
          if bean_ratio<1.10: raise SystemExit('bean halo warm-energy improvement insufficient')
          if head_ratio<1.03: raise SystemExit('headlight/reflection readability improvement insufficient')

          pairs=[
            ('MOBILE GAMEPLAY','witch-pass17-baseline-mobile-430x932.png','witch-pass17-mobile-gameplay-430x932.png'),
            ('BEAN VISIBILITY','witch-pass17-baseline-bean-430x932.png','witch-pass17-bean-visibility-430x932.png'),
            ('HEADLIGHT / REFLECTION','witch-pass17-baseline-headlight-430x932.png','witch-pass17-headlight-reflection-430x932.png'),
          ]
          canvas=Image.new('RGB',(880,3*992),(7,7,7));d=ImageDraw.Draw(canvas)
          for row,(label,a,b) in enumerate(pairs):
            y=row*992;canvas.paste(Image.open(a).convert('RGB'),(5,y+55));canvas.paste(Image.open(b).convert('RGB'),(445,y+55));d.text((10,y+12),label,fill='white');d.text((10,y+34),'PASS 16 ACCEPTED RC',fill='white');d.text((450,y+34),'PASS 17 POLISH',fill='white')
          canvas.save('witch-pass17-comparison-sheet.png')
          PY

      - name: Upload Pass 17 renders and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witch-pass17-environment-polish-renders
          if-no-files-found: warn
          path: |
            witch-pass17-mobile-gameplay-430x932.png
            witch-pass17-environment-430x932.png
            witch-pass17-close-witch-430x932.png
            witch-pass17-bean-visibility-430x932.png
            witch-pass17-headlight-reflection-430x932.png
            witch-pass17-baseline-mobile-430x932.png
            witch-pass17-baseline-bean-430x932.png
            witch-pass17-baseline-headlight-430x932.png
            witch-pass17-comparison-sheet.png
            witch-pass17-runtime-report.json
