name: Witch Ride 3D Pass 19 Bean Witch Material

on:
  push:
    branches: [witch-ride-3d-bean-witch-material-pass-19]
    paths:
      - 'halloween-radio/games/witch-ride-3d/index.html'
      - 'halloween-radio/games/witch-ride-3d/pass19-bean-witch-material.js'
      - '.github/workflows/witch-ride-3d-pass19-bean-witch-material.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pass19-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted Pass 18 source remains locked
        shell: bash
        run: |
          git fetch origin main witch-ride-3d-traffic-collision-cleanup-pass-18 witch-ride-3d-bean-witch-material-pass-19
          BASE=1c47f4e8a1c2554425e1c9a79419de79aaf22304
          test "$(git rev-parse origin/witch-ride-3d-bean-witch-material-pass-19)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/witch-ride-3d-traffic-collision-cleanup-pass-18)" = "$BASE"
          for path in \
            halloween-radio/games/witch-ride-3d/game.js \
            halloween-radio/games/witch-ride-3d/game.css \
            halloween-radio/games/witch-ride-3d/pass15-environment-traffic.js \
            halloween-radio/games/witch-ride-3d/pass18-traffic-cleanup.js \
            halloween-radio/games/witch-ride-3d/witch-centerpiece-pass.js \
            halloween-radio/games/witch-ride-3d/illumination-pass.js \
            halloween-radio/games/witch-ride-3d/composition-pass.js \
            halloween-radio/games/witch-ride-3d/assets/witch-rider.glb \
            halloween-radio/games/witch-ride-3d/assets/coffee-bean.glb; do
            git diff --quiet "$BASE" HEAD -- "$path" || { echo "LOCKED PASS 18 SOURCE CHANGED: $path"; exit 1; }
          done
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "$CHANGED"
          test -z "$(printf '%s\n' "$CHANGED" | grep -Ev '^(halloween-radio/games/witch-ride-3d/index.html|halloween-radio/games/witch-ride-3d/pass19-bean-witch-material.js|.github/workflows/witch-ride-3d-pass19-bean-witch-material.yml)$' || true)"
          ! printf '%s\n' "$CHANGED" | grep -q '^louisburg-local/'
          node --check halloween-radio/games/witch-ride-3d/pass19-bean-witch-material.js
          grep -q 'pass19-bean-witch-material.js' halloween-radio/games/witch-ride-3d/index.html

      - name: Real PlayCanvas 430x932 material and gameplay gate
        shell: bash
        run: |
          npm install --no-save puppeteer-core@24.16.0
          python3 -m http.server 8019 --directory . >/tmp/pass19.log 2>&1 & PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const fs=require('fs'),puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--disable-background-timer-throttling','--disable-renderer-backgrounding','--disable-backgrounding-occluded-windows']});
            const page=await browser.newPage();page.setDefaultTimeout(60000);
            await page.setViewport({width:430,height:932,deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8019/halloween-radio/games/witch-ride-3d/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.WitchRide3D?.ready&&window.WitchRidePass18Traffic?.active===true&&window.WitchRidePass19Material?.active===true);
            const detail=await page.evaluate(()=>window.WitchRidePass19Material.detail);
            fs.writeFileSync('pass19-preflight.json',JSON.stringify({detail,errors},null,2));
            console.log('PASS19_DETAIL',JSON.stringify(detail));
            assert(detail.geometryChanged===false&&detail.poseChanged===false&&detail.scaleChanged===false,'witch geometry/pose/scale flag changed');
            assert(detail.trafficChanged===false&&detail.environmentChanged===false,'locked world flag changed');
            assert(detail.broomFireAdded===false,'broom fire must not be part of Pass 19');
            assert(detail.witch.rootTransformPreserved===true,'witch root transform changed');
            assert(detail.witch.cloned>0,'no witch materials were polished');
            assert(detail.beans.beans===16,'all 16 beans not found');
            assert(detail.beans.scalePreserved===16,'bean gameplay scale changed');
            assert(detail.beans.bodyMaterials>=16,'bean body materials missing');
            assert(await page.evaluate(()=>window.WitchRideWitchCenterpiecePass.materialsApplied===true),'witch material state not marked applied');

            await page.click('#play');await page.waitForFunction(()=>window.WitchRide3D.state.mode==='playing');await sleep(1200);
            const runtime=await page.evaluate(async()=>{const pc=await import('playcanvas'),app=pc.app,s=window.WitchRide3D.state;return {mode:s.mode,score:s.score,traffic:Array.from({length:4},(_,i)=>{const e=app.root.findByName(`Oncoming Traffic ${i}`);return {enabled:e.enabled,z:e.getPosition().z}}),legacy:Array.from({length:7},(_,i)=>{const e=app.root.findByName(`1938 Coupe ${i}`);return {enabled:e.enabled,retired:e.__pass18Retired}})}});
            fs.writeFileSync('pass19-runtime-partial.json',JSON.stringify({detail,runtime,errors},null,2));
            assert(runtime.mode==='playing'&&runtime.score>0,'gameplay did not advance');
            assert(runtime.traffic.every(v=>v.enabled),'moving traffic regression');
            assert(runtime.legacy.every(v=>!v.enabled&&v.retired===true),'stationary traffic regression');

            await page.evaluate(async()=>{const pc=await import('playcanvas'),app=pc.app,s=window.WitchRide3D.state;for(let i=0;i<16;i++){const b=app.root.findByName(`Coffee Bean ${i}`);b.enabled=false;b.__active=false}const b=app.root.findByName('Coffee Bean 0');b.__active=true;b.enabled=true;b.setPosition(s.x,1.15,-3.5);s.spawnClock=999});
            await sleep(220);
            await page.screenshot({path:'pass19-bean-approach-430x932.png'});
            await page.waitForFunction(()=>window.WitchRide3D.state.beans>=1);

            await page.screenshot({path:'pass19-gameplay-430x932.png'});
            const finalState=await page.evaluate(()=>({state:window.WitchRide3D.state,pass19:window.WitchRidePass19Material,pass18:window.WitchRidePass18Traffic.detail}));
            fs.writeFileSync('pass19-runtime.json',JSON.stringify({detail,runtime,finalState,errors},null,2));
            assert(errors.length===0,`console/page errors: ${errors.join(' | ')}`);
            await browser.close();
          })().catch(e=>{console.error('PASS19_GATE_ERROR',e.stack||String(e));process.exit(1)});
          NODE

      - name: Upload Pass 19 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witch-pass19-bean-witch-material-proof
          if-no-files-found: warn
          path: |
            pass19-preflight.json
            pass19-runtime-partial.json
            pass19-bean-approach-430x932.png
            pass19-gameplay-430x932.png
            pass19-runtime.json
