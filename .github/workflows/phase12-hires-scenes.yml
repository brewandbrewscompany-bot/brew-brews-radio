name: Phase 12 High-Resolution Station Scenes

on:
  workflow_dispatch:
  push:
    branches: [christmas-radio-phase-12-hires-station-scenes]
    paths:
      - 'christmas-radio/artwork/stations/**'
      - 'christmas-radio/sw.js'
      - '.github/workflows/phase12-hires-scenes.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate high-resolution AVIFs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names=['snowfall-am','fireside','sleigh-bell-rock','candlelight','north-pole-after-hours']
          for name in names:
              p=Path('christmas-radio/artwork/stations')/(name+'.avif')
              b=p.read_bytes()
              assert len(b) > 70000, (name,len(b))
              assert b[4:8] == b'ftyp', name
              print(name,len(b))
          PY
      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Run 430x932 DPR3 alignment and visual gate
        run: |
          set -euo pipefail
          mkdir -p phase12-output
          python3 -m http.server 8000 --directory . >/tmp/phase12-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const expected=[
              {index:0,id:'snowfall-am',asset:'snowfall-am.avif'},
              {index:1,id:'fireside',asset:'fireside.avif'},
              {index:2,id:'sleigh-bell-rock',asset:'sleigh-bell-rock.avif'},
              {index:3,id:'candlelight',asset:'candlelight.avif'},
              {index:4,id:'bb-christmas-radio',asset:'christmas-radio-approved-skin.avif'},
              {index:5,id:'north-pole-after-hours',asset:'north-pole-after-hours.avif'}
            ];
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:3});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'networkidle0'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            for(const s of expected){
              await page.$eval('#tuningKnob',(el,i)=>{el.value=String(i);el.dispatchEvent(new Event('input',{bubbles:true}))},s.index);
              await page.waitForFunction(({id,asset})=>document.body.dataset.station===id&&getComputedStyle(document.querySelector('.scene'),'::before').backgroundImage.includes(asset),{timeout:5000},s);
              if(s.id!=='bb-christmas-radio'){
                const dims=await page.evaluate(asset=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve([im.naturalWidth,im.naturalHeight]);im.onerror=reject;im.src='artwork/stations/'+asset}),s.asset);
                if(dims[0]!==852||dims[1]!==1846)throw new Error('Wrong dimensions '+s.id+' '+dims);
              }
              const geom=await page.evaluate(()=>{
                const stage=document.querySelector('.scene').getBoundingClientRect();
                const vol=document.querySelector('.volume-control').getBoundingClientRect();
                const play=document.querySelector('.play-button').getBoundingClientRect();
                const tun=document.querySelector('.tuner-control').getBoundingClientRect();
                return {stage,vol,play,tun,paused:document.querySelector('#christmasRadioAudio').paused};
              });
              if(!geom.paused)throw new Error('Tuning started audio');
              const center=r=>({x:r.x+r.width/2,y:r.y+r.height/2});
              const v=center(geom.vol),p=center(geom.play),t=center(geom.tun);
              if(Math.abs(v.x-106.21)>1.5||Math.abs(v.y-556.4)>1.5||Math.abs(p.x-215)>1.5||Math.abs(p.y-545.7)>1.5||Math.abs(t.x-316.91)>1.5||Math.abs(t.y-556.4)>1.5)throw new Error('Hit target geometry moved '+JSON.stringify({v,p,t}));
              await page.screenshot({path:`phase12-output/${String(s.index+1).padStart(2,'0')}-${s.id}-430x932-dpr3.png`,fullPage:false});
            }
            if(errors.length)throw new Error(errors.join(' | '));
            fs.writeFileSync('phase12-output/report.json',JSON.stringify({status:'PASS',expected},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import struct
          shots=list(Path('phase12-output').glob('*.png'))
          assert len(shots)==6, len(shots)
          for p in shots:
              b=p.read_bytes(); w,h=struct.unpack('>II',b[16:24]); assert (w,h)==(1290,2796),(p,w,h)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase12-hires-station-scenes-evidence
          path: phase12-output/
          retention-days: 14
