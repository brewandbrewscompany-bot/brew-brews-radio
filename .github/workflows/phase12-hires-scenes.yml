name: Phase 12 High-Resolution Station Scenes

on:
  workflow_dispatch:
  push:
    branches: [christmas-radio-phase-12-hires-station-scenes]
    paths:
      - 'christmas-radio/**'
      - '.github/workflows/phase12-hires-scenes.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static scope, flagship, AVIF and audio-cache gate
        run: |
          set -euo pipefail
          BASE=184647c049bba266f8d9c5475dba832c25e66b21
          FLAGSHIP_BLOB=d0d57688dfd0264c78b8a3cc161734b39790bcd3
          test "$(git hash-object christmas-radio/artwork/christmas-radio-approved-skin.avif)" = "$FLAGSHIP_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          root=Path('christmas-radio')
          names=['snowfall-am','fireside','sleigh-bell-rock','candlelight','north-pole-after-hours']
          for name in names:
              p=root/'artwork'/'stations'/(name+'.avif')
              b=p.read_bytes()
              assert 60000 <= len(b) <= 170000, (name,len(b))
              assert b[4:8] == b'ftyp' and b'avif' in b[8:32], name
              i=b.find(b'ispe')
              assert i >= 0, name
              w,h=struct.unpack('>II',b[i+8:i+16])
              assert (w,h)==(852,1846),(name,w,h)
              print(name,len(b),f'{w}x{h}')
          sw=(root/'sw.js').read_text()
          assert "phase12-hires-v1" in sw
          assert "pathname.includes('/audio/')" in sw
          assert "request.headers.has('range')" in sw
          html=(root/'index.html').read_text()
          assert 'preload="none"' in html
          print('Static AVIF/cache gate PASS')
          PY
          changed="$(git diff --name-only "$BASE"..HEAD)"
          printf '%s\n' "$changed"
          python3 - <<'PY'
          import subprocess
          base='184647c049bba266f8d9c5475dba832c25e66b21'
          changed=set(subprocess.check_output(['git','diff','--name-only',base+'..HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/phase12-hires-scenes.yml',
            'christmas-radio/sw.js',
            'christmas-radio/artwork/stations/snowfall-am.avif',
            'christmas-radio/artwork/stations/fireside.avif',
            'christmas-radio/artwork/stations/sleigh-bell-rock.avif',
            'christmas-radio/artwork/stations/candlelight.avif',
            'christmas-radio/artwork/stations/north-pole-after-hours.avif',
          }
          assert changed <= allowed, sorted(changed-allowed)
          assert not any(p.startswith('louisburg-local/') for p in changed)
          print('Scope gate PASS',sorted(changed))
          PY

      - name: Install browser helper
        run: npm install --no-save puppeteer-core@24.16.0

      - name: DPR3 visual and full functional regression gate
        run: |
          set -euo pipefail
          rm -rf phase12-output && mkdir -p phase12-output
          python3 -m http.server 8000 --directory . >/tmp/phase12-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const crypto=require('crypto');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const expected=[
              {index:0,id:'snowfall-am',freq:'88.7',asset:'snowfall-am.avif'},
              {index:1,id:'fireside',freq:'92.5',asset:'fireside.avif'},
              {index:2,id:'sleigh-bell-rock',freq:'96.9',asset:'sleigh-bell-rock.avif'},
              {index:3,id:'candlelight',freq:'100.3',asset:'candlelight.avif'},
              {index:4,id:'bb-christmas-radio',freq:'103.1',asset:'christmas-radio-approved-skin.avif'},
              {index:5,id:'north-pole-after-hours',freq:'106.7',asset:'north-pole-after-hours.avif'}
            ];
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--mute-audio']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:3});
            const pageErrors=[],httpErrors=[],mp3Requests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});
            page.on('request',r=>{if(/\.mp3(?:\?|$)/i.test(r.url()))mp3Requests.push(r.url())});

            await page.goto('http://127.0.0.1:8000/christmas-radio/',{waitUntil:'networkidle0'});
            await page.waitForFunction(()=>document.querySelectorAll('#stationGrid .station-card').length===6,{timeout:10000});
            const boot=await page.evaluate(()=>{const a=document.querySelector('#christmasRadioAudio');return{station:document.body.dataset.station,frequency:document.querySelector('#frequencyLabel')?.textContent.trim(),paused:a.paused,src:a.getAttribute('src'),volume:a.volume,scrollWidth:document.documentElement.scrollWidth,innerWidth,innerHeight};});
            if(boot.station!=='bb-christmas-radio'||boot.frequency!=='103.1'||!boot.paused||boot.src||mp3Requests.length)throw new Error('Boot/autoplay regression '+JSON.stringify({boot,mp3Requests}));
            if(boot.scrollWidth>430)throw new Error('Horizontal overflow '+JSON.stringify(boot));

            const screenshots=[];
            for(const s of expected){
              await page.$eval('#tuningKnob',(el,i)=>{el.value=String(i);el.dispatchEvent(new Event('input',{bubbles:true}))},s.index);
              await page.waitForFunction(({id,f,asset})=>document.body.dataset.station===id&&document.querySelector('#frequencyLabel')?.textContent.trim()===f&&getComputedStyle(document.querySelector('.scene'),'::before').backgroundImage.includes(asset),{timeout:5000},{id:s.id,f:s.freq,asset:s.asset});
              if(!(await page.$eval('#christmasRadioAudio',a=>a.paused)))throw new Error('Tuning autoplayed at '+s.freq);
              if(s.id!=='bb-christmas-radio'){
                const dims=await page.evaluate(asset=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve([im.naturalWidth,im.naturalHeight]);im.onerror=reject;im.src='artwork/stations/'+asset}),s.asset);
                if(dims[0]!==852||dims[1]!==1846)throw new Error('Wrong dimensions '+s.id+' '+dims);
              }
              const path=`phase12-output/${String(s.index+1).padStart(2,'0')}-${s.id}-430x932-dpr3.png`;
              await sleep(180);
              await page.screenshot({path,fullPage:false});
              screenshots.push(path);
            }
            if(mp3Requests.length)throw new Error('Tuning fetched audio before Play '+JSON.stringify(mp3Requests));

            const locked='phase12-output/05-bb-christmas-radio-430x932-dpr3.png';
            const flagshipSha=crypto.createHash('sha256').update(fs.readFileSync(locked)).digest('hex');
            const acceptedSha='c4aa01d2ec22166bf07c39ca2af3583c61198aa3eadc1db2cf62ae00853413bf';
            if(flagshipSha!==acceptedSha)throw new Error('103.1 DPR3 screenshot changed: '+flagshipSha+' expected '+acceptedSha);

            await page.$eval('#tuningKnob',el=>{el.value='4';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.click('#playButton');
            await page.waitForFunction(()=>{const a=document.querySelector('#christmasRadioAudio');return !a.paused&&a.currentSrc.includes('.mp3')&&a.readyState>=2},{timeout:15000});
            await sleep(1200);
            const playing=await page.$eval('#christmasRadioAudio',a=>({paused:a.paused,currentTime:a.currentTime,duration:a.duration,src:a.currentSrc,volume:a.volume}));
            if(playing.paused||playing.currentTime<=0||!Number.isFinite(playing.duration)||playing.duration<30||!mp3Requests.length)throw new Error('Playback failed '+JSON.stringify(playing));
            const firstSrc=playing.src;
            await page.click('.bottom-nav button[data-panel="nowPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#nowPanel').hidden,{timeout:3000});
            await page.click('#panelNext');
            await page.waitForFunction(src=>{const a=document.querySelector('#christmasRadioAudio');return !a.paused&&a.currentSrc&&a.currentSrc!==src},{timeout:15000},firstSrc);
            await page.click('#nowPanel .panel-close');
            await page.click('.bottom-nav button[data-panel="stationsPanel"]');
            await page.waitForFunction(()=>!document.querySelector('#stationsPanel').hidden,{timeout:3000});
            if(await page.$$eval('#stationsPanel .station-card',x=>x.length)!==6)throw new Error('Stations panel incomplete');
            await page.click('#stationsPanel .panel-close');
            await page.$eval('#volumeControl',el=>{el.value='0.42';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.click('#playButton');
            await sleep(150);
            if(!(await page.$eval('#christmasRadioAudio',a=>a.paused)))throw new Error('Pause failed');

            await page.evaluate(()=>navigator.serviceWorker.ready.then(()=>true));
            await page.reload({waitUntil:'networkidle0'});
            await page.waitForFunction(()=>!!navigator.serviceWorker.controller,{timeout:10000});
            const warm=await page.evaluate(async()=>{const a=document.querySelector('#christmasRadioAudio');const keys=await caches.keys();const key=keys.find(k=>k==='bb-christmas-radio-shell-phase12-hires-v1');const urls=key?[...(await (await caches.open(key)).keys())].map(r=>r.url):[];return{key,urls,paused:a.paused,volume:a.volume};});
            if(!warm.key||warm.urls.some(u=>u.includes('/audio/'))||!warm.paused||Math.abs(warm.volume-.42)>.02)throw new Error('Warm cache/persistence failed '+JSON.stringify(warm));

            const critical=httpErrors.filter(x=>!x.url.endsWith('/favicon.ico'));
            if(pageErrors.length||critical.length)throw new Error('Browser errors '+JSON.stringify({pageErrors,critical}));
            const report={status:'PASS',viewport:{css:'430x932',dpr:3,physical:'1290x2796'},flagshipSha,acceptedSha,boot,playing:{...playing,src:new URL(playing.src).pathname},warm:{...warm,urls:warm.urls.map(u=>new URL(u).pathname)},mp3RequestCount:mp3Requests.length,pageErrors,httpErrors,screenshots};
            fs.writeFileSync('phase12-output/report.json',JSON.stringify(report,null,2));
            console.log('PHASE 12 GATE PASS',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);fs.writeFileSync('phase12-output/failure.txt',String(e.stack||e));process.exit(1)});
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import struct
          shots=sorted(Path('phase12-output').glob('*.png'))
          assert len(shots)==6, shots
          for p in shots:
              b=p.read_bytes(); w,h=struct.unpack('>II',b[16:24]); assert (w,h)==(1290,2796),(p,w,h)
              print(p.name,w,h)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase12-hires-station-scenes-evidence
          path: phase12-output/
          retention-days: 30
