name: Halloween Radio Persistence Test Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halloween-radio-persistence-test-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix persistence regression setup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/halloween-radio-playback-check.yml')
          s=p.read_text()
          old="""            // Verify saved state restores station, track, volume and modes without autoplay.
            await page.evaluate(()=>localStorage.setItem('bb-halloween-radio-state-v1',JSON.stringify({version:1,currentFreq:91.7,trackId:'static-on-the-highway',volume:.42,autoTune:false,shuffle:false,repeat:true,currentTime:12})));
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.BBRadio&&document.querySelector('.desktop [data-title]')?.textContent.trim()==='Static on the Highway');
            await sleep(300);
"""
          new="""            // Build saved state through the real controls, then reload. This lets pagehide save the same state a listener created.
            if(await page.$eval('#repeatSwitch',b=>b.getAttribute('aria-pressed')==='true')) await toggle('#repeatSwitch');
            if(await page.$eval('#shuffleSwitch',b=>b.getAttribute('aria-pressed')==='true')) await toggle('#shuffleSwitch');
            await station('91.7'); await sleep(250);
            await page.click('.desktop [data-hit=\"next\"]'); await sleep(200);
            if(await title()!=='Static on the Highway') throw new Error('Persistence setup track is wrong');
            await page.evaluate(()=>window.BBRadio.setVolume(.42));
            await toggle('#repeatSwitch');
            await sleep(450);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.BBRadio&&document.querySelector('.desktop [data-title]')?.textContent.trim()==='Static on the Highway',{timeout:15000});
            await sleep(300);
"""
          assert old in s, 'Persistence test block not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add .github/workflows/halloween-radio-playback-check.yml
          git commit -m "Fix persistence browser regression setup"
          git push
