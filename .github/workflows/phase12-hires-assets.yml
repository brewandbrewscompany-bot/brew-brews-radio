name: Phase 12 High-Resolution Asset Builder

on:
  workflow_dispatch:
  push:
    branches: [christmas-radio-phase-12-hires-station-scenes]
    paths:
      - '.github/workflows/phase12-hires-assets.yml'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch state and install renderer
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "c58032f16d9fff7f28875b8c41ee6fbcd60b95da" || { echo "main moved; stop"; exit 1; }
          python -m pip install --disable-pip-version-check pillow numpy >/dev/null
      - name: Render five high-resolution station scenes
        env:
          RENDERER_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$RENDERER_GZ_B64" | base64 -d | gzip -d > /tmp/phase12-render.py
          python /tmp/phase12-render.py
          for f in christmas-radio/artwork/stations/*.png; do
            out="${f%.png}.avif"
            ffmpeg -loglevel error -y -i "$f" -c:v libaom-av1 -still-picture 1 -crf 9 -cpu-used 5 -pix_fmt yuv444p "$out"
            rm "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          names=['snowfall-am','fireside','sleigh-bell-rock','candlelight','north-pole-after-hours']
          for name in names:
              p=Path('christmas-radio/artwork/stations')/(name+'.avif')
              size=p.stat().st_size
              dims=subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-of','csv=s=x:p=0',str(p)],text=True).strip()
              assert dims=='852x1846',(name,dims)
              assert 70000 <= size <= 170000,(name,size)
              print(name,size,dims)
          PY
      - name: Bump shell cache and clean staging
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('christmas-radio/sw.js')
          s=p.read_text()
          old="`${CACHE_PREFIX}phase10-2-v3`"
          new="`${CACHE_PREFIX}phase12-v1`"
          assert old in s and new not in s
          p.write_text(s.replace(old,new))
          PY
          rm -rf .phase12-hires
          rm -f .github/workflows/phase12-hires-assets.yml
      - name: Verify locked scope before commit
        run: |
          set -euo pipefail
          test "$(git hash-object christmas-radio/artwork/christmas-radio-approved-skin.avif)" = "d0d57688dfd0264c78b8a3cc161734b39790bcd3"
          test -z "$(git diff --name-only | grep '^louisburg-local/' || true)"
          git status --short
      - name: Commit rebuilt assets
        run: |
          set -euo pipefail
          git config user.name "brewandbrewscompany-bot"
          git config user.email "brewandbrewscompany@gmail.com"
          git add -A
          git commit -m "Rebuild five Christmas station scenes at high resolution"
          git push origin HEAD:christmas-radio-phase-12-hires-station-scenes
