name: Phase 12 High-Resolution Asset Installer

on:
  workflow_dispatch:
  push:
    branches: [christmas-radio-phase-12-hires-station-scenes]
    paths:
      - '.github/workflows/phase12-hires-assets.yml'

permissions:
  contents: write

jobs:
  install-approved-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard locked Phase 11 application
        shell: bash
        run: |
          set -euo pipefail
          TARGET=christmas-radio-phase-12-hires-station-scenes
          BASE=184647c049bba266f8d9c5475dba832c25e66b21
          TARGET_START="$(git rev-parse HEAD)"
          git fetch origin main "$TARGET" --quiet
          MAIN_START="$(git rev-parse origin/main)"
          test "$TARGET_START" = "$(git rev-parse origin/$TARGET)"
          printf '%s\n' "$TARGET_START" >/tmp/target-start
          printf '%s\n' "$MAIN_START" >/tmp/main-start
          test "$(git hash-object christmas-radio/artwork/christmas-radio-approved-skin.avif)" = d0d57688dfd0264c78b8a3cc161734b39790bcd3
          git diff --exit-code "$BASE" -- christmas-radio/index.html christmas-radio/manifest.webmanifest christmas-radio/favicon.svg christmas-radio/assets/css/christmas-radio.css christmas-radio/assets/css/art-skin.css christmas-radio/assets/css/stations.css christmas-radio/assets/js/christmas-radio.js christmas-radio/assets/js/audio-engine.js christmas-radio/artwork/christmas-radio-approved-skin.avif christmas-radio/data/stations.json christmas-radio/data/tracks.json
      - name: Download approved package
        shell: bash
        env:
          ASSET_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-ec7c-81f6-aa82-4eba1259987a/raw?se=2026-09-15T01%3A00%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=8fca4a60-30dc-57b6-82f7-2eefa633f5f8&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A23%3A04Z&ske=2026-09-15T20%3A23%3A04Z&sks=b&skv=2026-02-06&sig=7fx6ZOX2sslIaVbf7Alt3p7X2bH41ievI%2BlWXBmIKiY%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ASSET_URL" -o /tmp/p12.tar.gz
          echo "1d7b080b14b2117d4fc3ec7a4b1fcdd22c37f36c773e9b9a837a40a0e107e87b  /tmp/p12.tar.gz" | sha256sum -c -
          rm -rf /tmp/p12 && mkdir /tmp/p12
          tar -xzf /tmp/p12.tar.gz -C /tmp/p12
      - name: Verify and install AVIF assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct,shutil
          expected={
          'candlelight.avif':('56efecea9ed309c1bb2b06de9c800e01309b06d3711dad4f42b8a26ae13d5962',71905),
          'fireside.avif':('2dde83f8053d464699c2640d2697618c9e63774b63bf71a10d0be298b24d7e35',88415),
          'north-pole-after-hours.avif':('3b2682d4585ccc692114c29b8e47e75a2fe71dbf3e82d3a69f0b91e461539fb1',84303),
          'sleigh-bell-rock.avif':('33072b2db66d6fb9e645b42537e2703f2a81b69b5a5bad5ef523916ac459c761',86465),
          'snowfall-am.avif':('aa8241e349bd9d1619bacd7fc0bc33f503cc7b7c7caf5a26a7932bf2b92c8e66',80706)}
          dst=Path('christmas-radio/artwork/stations'); dst.mkdir(parents=True,exist_ok=True)
          for name,(sha,size) in expected.items():
              p=Path('/tmp/p12')/name; b=p.read_bytes()
              assert hashlib.sha256(b).hexdigest()==sha
              assert len(b)==size and 60000<=len(b)<=170000
              i=b.find(b'ispe'); assert i>=0
              assert struct.unpack('>II',b[i+8:i+16])==(852,1846)
              shutil.copyfile(p,dst/name)
          PY
      - name: Bump cache and remove staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('christmas-radio/sw.js'); s=p.read_text()
          old="const CACHE_NAME=`${CACHE_PREFIX}phase10-2-v3`;"; new="const CACHE_NAME=`${CACHE_PREFIX}phase12-hires-v1`;"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git rm -rf --ignore-unmatch .phase12-hires .phase12-transfer .phase12-transfer-v2
      - name: Final scope and concurrency guard
        shell: bash
        run: |
          set -euo pipefail
          TARGET=christmas-radio-phase-12-hires-station-scenes
          git fetch origin main "$TARGET" --quiet
          test "$(git rev-parse origin/main)" = "$(cat /tmp/main-start)"
          test "$(git rev-parse origin/$TARGET)" = "$(cat /tmp/target-start)"
          test "$(git hash-object christmas-radio/artwork/christmas-radio-approved-skin.avif)" = d0d57688dfd0264c78b8a3cc161734b39790bcd3
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','184647c049bba266f8d9c5475dba832c25e66b21'],text=True).splitlines())
          allowed={'.github/workflows/phase12-hires-assets.yml','.github/workflows/phase12-hires-scenes.yml','christmas-radio/sw.js','christmas-radio/artwork/stations/snowfall-am.avif','christmas-radio/artwork/stations/fireside.avif','christmas-radio/artwork/stations/sleigh-bell-rock.avif','christmas-radio/artwork/stations/candlelight.avif','christmas-radio/artwork/stations/north-pole-after-hours.avif'}
          assert changed==allowed,(sorted(changed),sorted(allowed))
          PY
      - name: Commit candidate assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name brewandbrewscompany-bot
          git config user.email brewandbrewscompany@gmail.com
          git add christmas-radio/sw.js christmas-radio/artwork/stations/*.avif
          git commit -m 'Install approved Phase 12 high-resolution station assets'
          git push origin HEAD:christmas-radio-phase-12-hires-station-scenes
