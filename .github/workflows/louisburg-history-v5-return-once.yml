name: Louisburg History V5 return once

on:
  push:
    paths:
      - .github/workflows/louisburg-history-v5-return-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch current pages
        run: |
          curl -fsSL https://raw.githubusercontent.com/brewandbrewscompany-bot/brew-brews-radio/main/louisburg-local/web-v4/history.html -o /tmp/history.html
          curl -fsSL https://raw.githubusercontent.com/brewandbrewscompany-bot/brew-brews-radio/main/louisburg-local/web-v5/index.html -o /tmp/v5.html

      - name: Patch History return path and V5 History entry
        run: |
          python - <<'PY'
          from pathlib import Path

          h=Path('/tmp/history.html')
          s=h.read_text()
          count=s.count('href="index.html"')
          if count < 2:
              raise SystemExit(f'Expected at least 2 history return links, found {count}')
          s=s.replace('href="index.html"','href="../web-v5/?v=history-return5"')
          h.write_text(s)

          v=Path('/tmp/v5.html')
          s=v.read_text()
          old="document.getElementById('historyLink').onclick=()=>location.href='../web-v4/history.html'"
          new="document.getElementById('historyLink').onclick=()=>location.href='../web-v4/history.html?from=v5'"
          if old not in s:
              raise SystemExit('V5 history entry marker not found')
          s=s.replace(old,new,1)
          v.write_text(s)
          PY

      - name: Validate patched links and JavaScript
        run: |
          grep -q '../web-v5/?v=history-return5' /tmp/history.html
          grep -q "history.html?from=v5" /tmp/v5.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/v5.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/v5.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/v5.js

      - name: Update History and V5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          repo='brewandbrewscompany-bot/brew-brews-radio'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          for path,local,msg in [
            ('louisburg-local/web-v4/history.html','/tmp/history.html','Return Louisburg History to V5'),
            ('louisburg-local/web-v5/index.html','/tmp/v5.html','Mark V5 history navigation')
          ]:
            url=f'https://api.github.com/repos/{repo}/contents/{path}'
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req) as r: current=json.load(r)
            data=open(local,'rb').read()
            payload=json.dumps({'message':msg,'content':base64.b64encode(data).decode(),'sha':current['sha']}).encode()
            req=urllib.request.Request(url,data=payload,method='PUT',headers={**headers,'Content-Type':'application/json'})
            with urllib.request.urlopen(req) as r: print(json.load(r)['commit']['sha'])
          PY
