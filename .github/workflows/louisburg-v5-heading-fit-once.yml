name: Louisburg V5 heading fit once

on:
  push:
    paths:
      - .github/workflows/louisburg-v5-heading-fit-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch current V5
        run: |
          curl -fsSL https://raw.githubusercontent.com/brewandbrewscompany-bot/brew-brews-radio/main/louisburg-local/web-v5/index.html -o /tmp/v5.html

      - name: Patch dynamic mobile heading fit and preserve history link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v5.html')
          s=p.read_text()

          s=s.replace("document.getElementById('historyLink').onclick=()=>location.href='../web-v4/history.html'","document.getElementById('historyLink').onclick=()=>location.href='../web-v4/history.html?from=v5'",1)

          marker='function installRefresh(x){'
          if 'function fitHomeHeading(x){' not in s:
              fn=r'''function fitHomeHeading(x){
  if(!x)return;
  const bar=x.querySelector('#homeScreen .bar'),h=bar&&bar.querySelector('h2'),status=bar&&bar.querySelector('#feedStatus');
  if(!bar||!h||!status)return;
  const mobile=window.matchMedia('(max-width:899px)').matches;
  if(!mobile){h.style.removeProperty('font-size');return}
  h.style.setProperty('white-space','nowrap','important');
  h.style.setProperty('line-height','1','important');
  h.style.setProperty('min-width','0','important');
  h.style.setProperty('flex','1 1 auto','important');
  const max=25,min=14;
  h.style.setProperty('font-size',max+'px','important');
  const avail=Math.max(0,bar.clientWidth-status.getBoundingClientRect().width-12);
  let size=max;
  while(size>min&&h.scrollWidth>avail){size-=0.5;h.style.setProperty('font-size',size+'px','important')}
  if(!bar.dataset.v5FitWatch){
    bar.dataset.v5FitWatch='1';
    const rerun=()=>requestAnimationFrame(()=>fitHomeHeading(x));
    if(window.ResizeObserver)new ResizeObserver(rerun).observe(bar);
    if(window.MutationObserver)new MutationObserver(rerun).observe(status,{childList:true,subtree:true,characterData:true});
    const win=x.defaultView;if(win)win.addEventListener('resize',rerun,{passive:true});
  }
}
'''
              if marker not in s: raise SystemExit('installRefresh marker missing')
              s=s.replace(marker,fn+marker,1)

          old="const h=x.querySelector('#homeScreen .bar h2');if(h)h.textContent='Happening in Louisburg';const dhead=x.querySelector('#directoryScreen .directoryHeader h1');"
          new="const h=x.querySelector('#homeScreen .bar h2');if(h){h.textContent='Happening in Louisburg';setTimeout(()=>fitHomeHeading(x),0)}const dhead=x.querySelector('#directoryScreen .directoryHeader h1');"
          if old not in s: raise SystemExit('heading assignment marker missing')
          s=s.replace(old,new,1)

          if "history.html?from=v5" not in s: raise SystemExit('history marker missing')
          if 'function fitHomeHeading(x){' not in s: raise SystemExit('fit function missing')
          if 'setTimeout(()=>fitHomeHeading(x),0)' not in s: raise SystemExit('fit call missing')
          p.write_text(s)
          PY

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/v5.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('No script blocks found')
          Path('/tmp/v5.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/v5.js

      - name: Update V5 index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          repo='brewandbrewscompany-bot/brew-brews-radio'
          path='louisburg-local/web-v5/index.html'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          url=f'https://api.github.com/repos/{repo}/contents/{path}'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req) as r: current=json.load(r)
          data=open('/tmp/v5.html','rb').read()
          payload=json.dumps({'message':'Dynamically fit V5 mobile home heading','content':base64.b64encode(data).decode(),'sha':current['sha']}).encode()
          req=urllib.request.Request(url,data=payload,method='PUT',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: print(json.load(r)['commit']['sha'])
          PY
