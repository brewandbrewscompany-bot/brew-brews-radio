name: Halloween Radio Playback Modes Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halloween-radio-playback-modes-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch playback modes and desktop play alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected source for {label}')
              return text.replace(old, new, 1)

          root = Path('halloween-radio')

          # INDEX: add Shuffle and Repeat controls inside the existing receiver drawer.
          p = root/'index.html'
          s = p.read_text(encoding='utf-8')
          old = '''  <div class="drawer-row"><span>Haunted Auto Tune</span><button class="switch on" id="autoSwitch" aria-pressed="true" aria-label="Toggle Haunted Auto Tune"><i></i></button></div>\n  <div class="drawer-row"><span>Frequency</span><strong id="drawerFreq">103.1 FM</strong></div>'''
          new = '''  <div class="drawer-row"><span>Haunted Auto Tune</span><button class="switch on" id="autoSwitch" aria-pressed="true" aria-label="Toggle Haunted Auto Tune"><i></i></button></div>\n  <div class="drawer-row"><span>Shuffle Songs</span><button class="switch" id="shuffleSwitch" aria-pressed="false" aria-label="Toggle Shuffle Songs"><i></i></button></div>\n  <div class="drawer-row"><span>Repeat Song</span><button class="switch" id="repeatSwitch" aria-pressed="false" aria-label="Toggle Repeat Song"><i></i></button></div>\n  <div class="drawer-row"><span>Frequency</span><strong id="drawerFreq">103.1 FM</strong></div>'''
          s = replace_once(s, old, new, 'drawer playback controls')
          p.write_text(s, encoding='utf-8')

          # CSS: move desktop Play overlay right to center it on the physical button.
          p = root/'assets/css/skin-radio.css'
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '.desktop .play-symbol{left:48.4%;top:65.8%;width:12.2%;height:12.0%}', '.desktop .play-symbol{left:48.95%;top:65.8%;width:12.2%;height:12.0%}', 'desktop play symbol')
          s = replace_once(s, '.desktop .play-halo{left:48.4%;top:65.8%;width:12.2%;height:12.0%}', '.desktop .play-halo{left:48.95%;top:65.8%;width:12.2%;height:12.0%}', 'desktop play halo')
          s = replace_once(s, '.desktop [data-hit="play"]{left:48.0%;top:64.7%;width:13.4%;height:14%}', '.desktop [data-hit="play"]{left:48.55%;top:64.7%;width:13.4%;height:14%}', 'desktop play hit target')
          p.write_text(s, encoding='utf-8')

          # JS: ordered auto-advance remains default; add optional shuffle/repeat.
          p = root/'assets/js/skin-radio.js'
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              "const state={playbackIntent:false,currentFreq:103.1,volume:.78,autoTune:true,trackIndex:new Map(),audioCtx:null,staticNode:null,staticGain:null,transitionToken:0,drag:null,toastTimer:null,ghostTimer:null,autoTimer:null,discovered:new Set()};",
              "const state={playbackIntent:false,currentFreq:103.1,volume:.78,autoTune:true,shuffle:false,repeat:false,trackIndex:new Map(),shuffleOrder:new Map(),audioCtx:null,staticNode:null,staticGain:null,transitionToken:0,drag:null,toastTimer:null,ghostTimer:null,autoTimer:null,discovered:new Set()};",
              'playback mode state'
          )

          s = replace_once(
              s,
              "const autoSwitch=document.getElementById('autoSwitch');\nconst toast=document.getElementById('toast');",
              "const autoSwitch=document.getElementById('autoSwitch');\nconst shuffleSwitch=document.getElementById('shuffleSwitch');\nconst repeatSwitch=document.getElementById('repeatSwitch');\nconst toast=document.getElementById('toast');",
              'playback mode controls'
          )

          s = replace_once(
              s,
              "const playlist=f=>tracks.filter(t=>Math.abs(t.station-f)<.01).sort((a,b)=>a.order-b.order);\nconst currentTrack=()=>{const st=nearestStation(state.currentFreq);const list=playlist(st.freq);const i=clamp(state.trackIndex.get(key(st.freq))??0,0,Math.max(0,list.length-1));state.trackIndex.set(key(st.freq),i);return list[i]||null};",
              """const basePlaylist=f=>tracks.filter(t=>Math.abs(t.station-f)<.01).sort((a,b)=>a.order-b.order);\nconst shuffleCopy=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nfunction buildShuffledPlaylist(freq,preserveId=null){const base=basePlaylist(freq);const ending=base.find(t=>t.id==='the-town-goes-quiet')||null;let pool=base.filter(t=>!ending||t.id!==ending.id);let first=null;if(preserveId){first=pool.find(t=>t.id===preserveId)||null;if(first)pool=pool.filter(t=>t.id!==first.id)}const ordered=[...(first?[first]:[]),...shuffleCopy(pool)];if(ending)ordered.push(ending);return ordered}\nfunction playlist(freq){if(!state.shuffle)return basePlaylist(freq);const k=key(freq);let ids=state.shuffleOrder.get(k);if(!ids){const base=basePlaylist(freq),idx=clamp(state.trackIndex.get(k)??0,0,Math.max(0,base.length-1)),preserveId=base[idx]?.id||null;const shuffled=buildShuffledPlaylist(freq,preserveId);ids=shuffled.map(t=>t.id);state.shuffleOrder.set(k,ids);state.trackIndex.set(k,Math.max(0,shuffled.findIndex(t=>t.id===preserveId)))}const byId=new Map(basePlaylist(freq).map(t=>[t.id,t]));return ids.map(id=>byId.get(id)).filter(Boolean)}\nconst currentTrack=()=>{const st=nearestStation(state.currentFreq);const list=playlist(st.freq);const i=clamp(state.trackIndex.get(key(st.freq))??0,0,Math.max(0,list.length-1));state.trackIndex.set(key(st.freq),i);return list[i]||null};\nconst isFinalSignoff=t=>!!t&&t.id==='the-town-goes-quiet'&&Math.abs(nearestStation(state.currentFreq).freq-103.1)<.01;""",
              'playlist engine'
          )

          s = replace_once(
              s,
              "function changeTrack(dir){const st=nearestStation(state.currentFreq),list=playlist(st.freq);if(!list.length)return;let idx=state.trackIndex.get(key(st.freq))??0;idx=(idx+dir+list.length)%list.length;state.trackIndex.set(key(st.freq),idx);setTrackSource(currentTrack());audio.currentTime=0;updateUI();if(state.playbackIntent)playCurrent();showToast(dir>0?'Next Song':'Previous Song',currentTrack()?.title||'')}",
              """function changeTrack(dir,{announce=true}={}){const st=nearestStation(state.currentFreq);let list=playlist(st.freq);if(!list.length)return;let idx=state.trackIndex.get(key(st.freq))??0;if(state.shuffle&&dir>0&&idx===list.length-1&&!isFinalSignoff(list[idx])){const shuffled=buildShuffledPlaylist(st.freq);state.shuffleOrder.set(key(st.freq),shuffled.map(t=>t.id));list=shuffled;idx=0}else{idx=(idx+dir+list.length)%list.length}state.trackIndex.set(key(st.freq),idx);setTrackSource(currentTrack());audio.currentTime=0;updateUI();if(state.playbackIntent)playCurrent();if(announce)showToast(dir>0?'Next Song':'Previous Song',currentTrack()?.title||'')}\nfunction setShuffle(enabled){const saved=new Map();stations.forEach(st=>{const list=playlist(st.freq),idx=clamp(state.trackIndex.get(key(st.freq))??0,0,Math.max(0,list.length-1));saved.set(key(st.freq),list[idx]?.id||null)});state.shuffle=enabled;state.shuffleOrder.clear();stations.forEach(st=>{const id=saved.get(key(st.freq));if(enabled){const shuffled=buildShuffledPlaylist(st.freq,id);state.shuffleOrder.set(key(st.freq),shuffled.map(t=>t.id));state.trackIndex.set(key(st.freq),Math.max(0,shuffled.findIndex(t=>t.id===id)))}else{const base=basePlaylist(st.freq);state.trackIndex.set(key(st.freq),Math.max(0,base.findIndex(t=>t.id===id)))}});setTrackSource(currentTrack());updateUI()}\nfunction setRepeat(enabled){state.repeat=enabled;repeatSwitch.classList.toggle('on',enabled);repeatSwitch.setAttribute('aria-pressed',String(enabled))}""",
              'track navigation and playback modes'
          )

          s = replace_once(
              s,
              "autoSwitch.addEventListener('click',()=>{state.autoTune=!state.autoTune;autoSwitch.classList.toggle('on',state.autoTune);autoSwitch.setAttribute('aria-pressed',String(state.autoTune));showToast('Haunted Auto Tune',state.autoTune?'On':'Off');scheduleAuto(true)});",
              """autoSwitch.addEventListener('click',()=>{state.autoTune=!state.autoTune;autoSwitch.classList.toggle('on',state.autoTune);autoSwitch.setAttribute('aria-pressed',String(state.autoTune));showToast('Haunted Auto Tune',state.autoTune?'On':'Off');scheduleAuto(true)});\nshuffleSwitch.addEventListener('click',()=>{const enabled=!state.shuffle;setShuffle(enabled);shuffleSwitch.classList.toggle('on',enabled);shuffleSwitch.setAttribute('aria-pressed',String(enabled));showToast('Shuffle',enabled?'On · signoff stays last':'Off · station order restored')});\nrepeatSwitch.addEventListener('click',()=>{setRepeat(!state.repeat);showToast('Repeat Track',state.repeat?'On':'Off')});""",
              'playback mode event handlers'
          )

          s = replace_once(
              s,
              "function scheduleAuto(reset=false){if(reset&&state.autoTimer)clearTimeout(state.autoTimer);if(!state.autoTune)return;state.autoTimer=setTimeout(()=>{if(state.autoTune&&!state.drag&&Math.random()<.62){let st=stations[Math.floor(Math.random()*stations.length)];if(st.freq===nearestStation(state.currentFreq).freq)st=stations[(stations.indexOf(st)+1)%stations.length];transitionToStation(st.freq)}scheduleAuto()},19000+Math.random()*26000)}",
              "function scheduleAuto(reset=false){if(reset&&state.autoTimer)clearTimeout(state.autoTimer);if(!state.autoTune)return;state.autoTimer=setTimeout(()=>{if(state.autoTune&&!state.drag&&!isFinalSignoff(currentTrack())&&Math.random()<.62){let st=stations[Math.floor(Math.random()*stations.length)];if(st.freq===nearestStation(state.currentFreq).freq)st=stations[(stations.indexOf(st)+1)%stations.length];transitionToStation(st.freq)}scheduleAuto()},19000+Math.random()*26000)}",
              'final signoff auto tune guard'
          )

          s = replace_once(
              s,
              "function scheduleGhost(){clearTimeout(state.ghostTimer);state.ghostTimer=setTimeout(()=>{const ghost=matchMedia('(max-width:760px)').matches?document.querySelector('.phone [data-ghost]'):document.querySelector('.desktop [data-ghost]');ghost.classList.remove('visit');void ghost.offsetWidth;ghost.classList.add('visit');if(!state.autoTune&&Math.random()<.42){const st=stations[Math.floor(Math.random()*stations.length)];setTimeout(()=>transitionToStation(st.freq),2300)}scheduleGhost()},15000+Math.random()*24000)}",
              "function scheduleGhost(){clearTimeout(state.ghostTimer);state.ghostTimer=setTimeout(()=>{const ghost=matchMedia('(max-width:760px)').matches?document.querySelector('.phone [data-ghost]'):document.querySelector('.desktop [data-ghost]');ghost.classList.remove('visit');void ghost.offsetWidth;ghost.classList.add('visit');if(!state.autoTune&&!isFinalSignoff(currentTrack())&&Math.random()<.42){const st=stations[Math.floor(Math.random()*stations.length)];setTimeout(()=>{if(!isFinalSignoff(currentTrack()))transitionToStation(st.freq)},2300)}scheduleGhost()},15000+Math.random()*24000)}",
              'final signoff ghost guard'
          )

          s = replace_once(
              s,
              "audio.addEventListener('ended',()=>{const t=currentTrack();if(t&&t.id==='the-town-goes-quiet'&&Math.abs(nearestStation(state.currentFreq).freq-103.1)<.01){state.playbackIntent=false;silence();showToast('Transmission Ended','Good night, Louisburg.');updateUI();return}changeTrack(1)});",
              "audio.addEventListener('ended',()=>{const t=currentTrack();if(isFinalSignoff(t)){state.playbackIntent=false;silence();showToast('Transmission Ended','Good night, Louisburg.');updateUI();return}if(state.repeat&&state.playbackIntent){audio.currentTime=0;playCurrent();updateUI();return}changeTrack(1,{announce:false})});",
              'automatic track advance and repeat'
          )

          s = replace_once(
              s,
              "state.playbackIntent=false;setTrackSource(currentTrack());silence();updateUI();scheduleAuto();scheduleGhost();",
              "state.playbackIntent=false;state.shuffle=false;state.repeat=false;shuffleSwitch.classList.remove('on');shuffleSwitch.setAttribute('aria-pressed','false');repeatSwitch.classList.remove('on');repeatSwitch.setAttribute('aria-pressed','false');setTrackSource(currentTrack());silence();updateUI();scheduleAuto();scheduleGhost();",
              'initial playback modes'
          )

          p.write_text(s, encoding='utf-8')
          PY

          node --check halloween-radio/assets/js/skin-radio.js

          python - <<'PY'
          from pathlib import Path
          html=Path('halloween-radio/index.html').read_text()
          css=Path('halloween-radio/assets/css/skin-radio.css').read_text()
          js=Path('halloween-radio/assets/js/skin-radio.js').read_text()
          assert 'id="shuffleSwitch"' in html and 'id="repeatSwitch"' in html
          assert '.desktop .play-symbol{left:48.95%' in css
          assert 'shuffle:false,repeat:false' in js
          assert "changeTrack(1,{announce:false})" in js
          assert "isFinalSignoff(t)" in js
          assert "enabled?'On · signoff stays last'" in js
          assert js.count('state.playbackIntent=true') == 1
          print('Playback mode patch validated.')
          PY

      - name: Commit patch
        run: |
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add halloween-radio/index.html halloween-radio/assets/css/skin-radio.css halloween-radio/assets/js/skin-radio.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add radio shuffle repeat and automatic track advance'
          git push
