name: V5 Release Cleanup

on:
  push:
    paths:
      - '.github/workflows/v5-release-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact V5 release cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('louisburg-local/web-v5/index.html')
          s=p.read_text()
          old=s
          s=s.replace('<title>Louisburg Local V5</title>','<title>Louisburg Local</title>',1)
          s=s.replace('title="Louisburg Local V5"','title="Louisburg Local"',1)
          button='<button class="navButton" id="correctionLink"><span class="navIcon">✎</span>Submit / Correct Info</button>'
          if button not in s:
              raise SystemExit('Expected correctionLink button not found; refusing broad edit')
          s=s.replace(button,'',1)
          js="document.getElementById('correctionLink').onclick=()=>showScreen('more');"
          if js not in s:
              raise SystemExit('Expected correctionLink handler not found; refusing broad edit')
          s=s.replace(js,'',1)
          if s==old:
              raise SystemExit('No changes made')
          p.write_text(s)
          PY
      - name: Verify exact cleanup
        run: |
          ! grep -q 'id="correctionLink"' louisburg-local/web-v5/index.html
          ! grep -q "getElementById('correctionLink')" louisburg-local/web-v5/index.html
          grep -q '<title>Louisburg Local</title>' louisburg-local/web-v5/index.html
          grep -q 'title="Louisburg Local"' louisburg-local/web-v5/index.html
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add louisburg-local/web-v5/index.html
          git commit -m 'Clean V5 release navigation'
          git push
