name: Regular Radio HQ Asset Promote

on:
  push:
    branches: [regular-radio-hq-transfer-final3]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote-hq-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install AVIF validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Reconstruct and verify exact native HQ assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hqout
          : > /tmp/desktop.b64
          : > /tmp/mobile.b64
          fetch_payload() {
            sha="$1"
            tag="$2"
            out="$3"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${sha}" > /tmp/commit.json
            jq -r '.message' /tmp/commit.json > /tmp/message.txt
            test "$(head -n1 /tmp/message.txt | tr -d '\r')" = "$tag"
            tail -n +2 /tmp/message.txt | tr -d '\r\n' >> "$out"
          }

          fetch_payload e9392bdd97c8001fe11ab8f9a3fbdd742bac4ca0 HQ4D00 /tmp/desktop.b64
          fetch_payload d23145de7c05ff62f17fa9f7f6fe60666d3ef6fa HQ4D01 /tmp/desktop.b64
          fetch_payload 76eb468395cec973790a57ed1d57ddf8de117206 HQ4D02 /tmp/desktop.b64

          fetch_payload 984eafe3f565e86bf8dfcd0671411c2b533b8819 HQ5M00 /tmp/mobile.b64
          fetch_payload 840fb41a930ee8b40283d53ac831910294edaaf7 HQ5M01 /tmp/mobile.b64
          fetch_payload 847620fc8bdd65782abc3c0c37a3b7ffc6135175 HQ5M02 /tmp/mobile.b64
          fetch_payload 65c6a78c5bb4a3f48a88698d56b461be608c17cb HQ5M03 /tmp/mobile.b64
          fetch_payload 632d8645d804a499987b4fe833832faeed7cd04f HQ5M04 /tmp/mobile.b64
          fetch_payload 9aad43f1bc14af310c15051c25e2a25442ed4e73 HQ5M05 /tmp/mobile.b64
          fetch_payload 37491c4aa38e3fd111421ff85c1ee3c1f4634406 HQ5M06 /tmp/mobile.b64
          fetch_payload b91b78e391380269bd698ac68c25227cc6e987b9 HQ5M07 /tmp/mobile.b64
          fetch_payload 09358a9cc69001785745967513089374b16a7fa2 HQ5M08 /tmp/mobile.b64

          base64 -d /tmp/desktop.b64 > /tmp/hqout/radio-desktop-approved.avif
          base64 -d /tmp/mobile.b64 > /tmp/hqout/radio-mobile-approved.avif

          test "$(stat -c%s /tmp/hqout/radio-desktop-approved.avif)" -eq 220621
          test "$(stat -c%s /tmp/hqout/radio-mobile-approved.avif)" -eq 169709
          echo '9cbbc9f19b287c18bb64177f8225018dfa908f3347808b41745cd01ef8d18f89  /tmp/hqout/radio-desktop-approved.avif' | sha256sum -c -
          echo '13e44367de9993572a865d62b7f2f31685f1ddc27ec202611c9acdadfeb350b0  /tmp/hqout/radio-mobile-approved.avif' | sha256sum -c -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/hqout/radio-desktop-approved.avif)" = '1536x1152'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/hqout/radio-mobile-approved.avif)" = '864x1536'
          ffmpeg -nostdin -hide_banner -v error -xerror -i /tmp/hqout/radio-desktop-approved.avif -f null -
          ffmpeg -nostdin -hide_banner -v error -xerror -i /tmp/hqout/radio-mobile-approved.avif -f null -

      - name: Promote verified HQ assets and release-gate updates
        shell: bash
        run: |
          set -euo pipefail
          FINAL='regular-radio-final-website-ready-pass'
          TRANSFER='regular-radio-hq-transfer-final3'

          git fetch origin main "$FINAL" "$TRANSFER"
          MAIN0="$(git rev-parse origin/main)"
          BASE="$(git rev-parse origin/$FINAL)"
          TRANSFER0="$(git rev-parse origin/$TRANSFER)"
          test "$TRANSFER0" = "$GITHUB_SHA"
          echo "main=$MAIN0"
          echo "final=$BASE"
          echo "transfer=$TRANSFER0"

          git checkout -B hq-promote "origin/$FINAL"
          cp /tmp/hqout/radio-desktop-approved.avif assets/regular-radio/radio-desktop-approved.avif
          cp /tmp/hqout/radio-mobile-approved.avif assets/regular-radio/radio-mobile-approved.avif

          python3 - <<'PY'
          from pathlib import Path
          sw = Path('service-worker.js')
          text = sw.read_text()
          old = "brew-brews-radio-regular-final-v4"
          new = "brew-brews-radio-regular-final-v5"
          assert text.count(old) == 1, 'unexpected service-worker cache version state'
          sw.write_text(text.replace(old, new))

          wf = Path('.github/workflows/regular-radio-final-release.yml')
          text = wf.read_text()
          replacements = {
              "fs.statSync(desktop).size===20199": "fs.statSync(desktop).size===220621",
              "fs.statSync(mobile).size===15056": "fs.statSync(mobile).size===169709",
              "brew-brews-radio-regular-final-v4": "brew-brews-radio-regular-final-v5",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, f'unexpected release-gate state for {old}'
              text = text.replace(old, new)
          marker = "assert(fs.statSync(mobile).size===169709,'mobile approved skin size changed');"
          assert marker in text
          hash_checks = """
          const crypto=require('crypto');
          assert(crypto.createHash('sha256').update(fs.readFileSync(desktop)).digest('hex')==='9cbbc9f19b287c18bb64177f8225018dfa908f3347808b41745cd01ef8d18f89','desktop HQ hash mismatch');
          assert(crypto.createHash('sha256').update(fs.readFileSync(mobile)).digest('hex')==='13e44367de9993572a865d62b7f2f31685f1ddc27ec202611c9acdadfeb350b0','mobile HQ hash mismatch');"""
          if 'desktop HQ hash mismatch' not in text:
              text = text.replace(marker, marker + hash_checks)
          wf.write_text(text)
          PY

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/regular-radio-final-release.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'assets/regular-radio/radio-desktop-approved.avif'
          printf '%s\n' "${changed[@]}" | grep -Fx 'assets/regular-radio/radio-mobile-approved.avif'
          printf '%s\n' "${changed[@]}" | grep -Fx 'service-worker.js'
          ! printf '%s\n' "${changed[@]}" | grep -Eq '^(halloween-radio|christmas-radio|louisburg-local)/'

          git fetch origin main "$FINAL" "$TRANSFER"
          test "$(git rev-parse origin/main)" = "$MAIN0"
          test "$(git rev-parse origin/$FINAL)" = "$BASE"
          test "$(git rev-parse origin/$TRANSFER)" = "$TRANSFER0"

          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add \
            assets/regular-radio/radio-desktop-approved.avif \
            assets/regular-radio/radio-mobile-approved.avif \
            service-worker.js \
            .github/workflows/regular-radio-final-release.yml
          git commit -m 'Promote exact native HQ Regular Radio artwork'

          git fetch origin main "$FINAL" "$TRANSFER"
          test "$(git rev-parse origin/main)" = "$MAIN0"
          test "$(git rev-parse origin/$FINAL)" = "$BASE"
          test "$(git rev-parse origin/$TRANSFER)" = "$TRANSFER0"
          git push origin HEAD:"$FINAL"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch exact-head final release gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FINAL='regular-radio-final-website-ready-pass'
          git fetch origin "$FINAL"
          test "$(git rev-parse origin/$FINAL)" = "$FINAL_SHA"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/regular-radio-final-release.yml/dispatches" \
            -d "{\"ref\":\"$FINAL\"}"
          echo "Dispatched final gate for $FINAL_SHA"
