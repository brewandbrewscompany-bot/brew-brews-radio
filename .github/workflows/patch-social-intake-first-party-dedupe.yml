name: Patch SocialIntake first-party dedupe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-social-intake-first-party-dedupe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch first-party URL dedupe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('louisburg-local/collector-v1/SocialIntake.gs')
          text = path.read_text()
          old1 = "  const existing=index.byDedupe[plan.dedupeKey]||(!auto.visibleCard?index.byUrl[normalizedUrl]:'')||'';"
          new1 = "  const useUrlDedupe=auto.sourceType!=='FIRST_PARTY'&&!auto.visibleCard;\n  const existing=index.byDedupe[plan.dedupeKey]||(useUrlDedupe?index.byUrl[normalizedUrl]:'')||'';"
          old2 = "  if(normalizedUrl&&!auto.visibleCard)index.byUrl[normalizedUrl]=plan.itemId;"
          new2 = "  if(normalizedUrl&&useUrlDedupe)index.byUrl[normalizedUrl]=plan.itemId;"
          if text.count(old1) != 1:
              raise SystemExit(f'Expected one existing-dedupe line, found {text.count(old1)}')
          if text.count(old2) != 1:
              raise SystemExit(f'Expected one URL-index line, found {text.count(old2)}')
          text = text.replace(old1, new1).replace(old2, new2)
          path.write_text(text)
          PY

      - name: Commit patched SocialIntake
        shell: bash
        run: |
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add louisburg-local/collector-v1/SocialIntake.gs
          git diff --cached --quiet && exit 0
          git commit -m 'Allow multiple first-party activities per source page'
          git push origin HEAD:main
