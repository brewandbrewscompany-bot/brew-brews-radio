name: Witch Ride 3D Witch Asset Build

on:
  push:
    paths:
      - '.github/workflows/witch-ride-3d-witch-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-witch:
    if: github.ref == 'refs/heads/witch-ride-3d-witch-rebuild-pass-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record safety baseline, build and validate Pass 11
        shell: bash
        run: |
          git fetch origin main witch-ride-3d-witch-rebuild-pass-11
          echo "BASE_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          echo "BASE_TARGET=$(git rev-parse origin/witch-ride-3d-witch-rebuild-pass-11)" >> "$GITHUB_ENV"
          test "$(git rev-parse origin/witch-ride-3d-witch-rebuild-pass-11)" = "$GITHUB_SHA"
          git ls-tree origin/witch-ride-3d-witch-rebuild-pass-11 halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
          mkdir -p halloween-radio/games/witch-ride-3d/tools
          tar -xzf .github/witch-pass11-source.tar.gz -C halloween-radio/games/witch-ride-3d/tools
          python -m py_compile halloween-radio/games/witch-ride-3d/tools/build_witch_pass3.py halloween-radio/games/witch-ride-3d/tools/validate_witch_pass3.py
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'Pillow>=11,<12' 'trimesh==4.11.1'
          python halloween-radio/games/witch-ride-3d/tools/build_witch_pass3.py
          python halloween-radio/games/witch-ride-3d/tools/validate_witch_pass3.py
          test "$(stat -c%s halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb)" -ge 900000
          grep -q '"build_version": "witch-realism-pass-v3"' halloween-radio/games/witch-ride-3d/assets/witch-material-pass.json
          grep -q '"broom_bristle_count": 72' halloween-radio/games/witch-ride-3d/assets/witch-material-pass.json
          grep -q '"cape_panel_count": 3' halloween-radio/games/witch-ride-3d/assets/witch-material-pass.json
          grep -q '"hair_lock_count": 5' halloween-radio/games/witch-ride-3d/assets/witch-material-pass.json
      - name: Mobile gameplay gate for generated GLB
        shell: bash
        run: |
          npm install --no-save puppeteer-core@24.16.0
          python3 -m http.server 8000 --directory . >/tmp/wr3d-witch-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--mute-audio','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/halloween-radio/games/witch-ride-3d/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.WitchRide3D?.ready&&document.body.classList.contains('ready'),{timeout:30000});
            const boot=await page.evaluate(()=>({assetMode:window.WitchRide3D.assetMode,engine:window.WitchRide3D.engine,title:document.querySelector('#title')?.classList.contains('open')}));
            console.log('gate boot',JSON.stringify(boot));
            if(boot.assetMode!=='glb-pbr'||boot.engine!=='PlayCanvas'||!boot.title)throw new Error('Pass 11 production boot failed '+JSON.stringify(boot));
            await page.click('#play');
            await page.waitForFunction(()=>window.WitchRide3D?.state?.mode==='playing'&&Number((document.querySelector('#score').textContent||'0').replace(/,/g,''))>0,{timeout:5000});
            const progressStart=await page.evaluate(()=>({
              uiScore:Number((document.querySelector('#score').textContent||'0').replace(/,/g,'')),
              stateScore:window.WitchRide3D.state.score,
              elapsed:window.WitchRide3D.state.elapsed
            }));
            await page.waitForFunction(start=>{
              const wr=window.WitchRide3D,ui=Number((document.querySelector('#score').textContent||'0').replace(/,/g,''));
              return wr?.state?.mode==='playing'&&ui>start.uiScore&&wr.state.score>start.stateScore&&wr.state.elapsed>start.elapsed+.12;
            },{timeout:8000},progressStart);
            const progressEnd=await page.evaluate(()=>({
              uiScore:Number((document.querySelector('#score').textContent||'0').replace(/,/g,'')),
              stateScore:window.WitchRide3D.state.score,
              elapsed:window.WitchRide3D.state.elapsed
            }));
            if(!(progressEnd.uiScore>progressStart.uiScore&&progressEnd.stateScore>progressStart.stateScore&&progressEnd.elapsed>progressStart.elapsed))throw new Error('Score simulation did not advance');
            const score1=progressStart.uiScore,score2=progressEnd.uiScore;
            console.log('gate score',JSON.stringify({progressStart,progressEnd}));

            const box=await page.$eval('#game-canvas',e=>{const r=e.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height}});
            const y=box.y+box.h*.62,x1=box.x+box.w*.50,x2=box.x+box.w*.84;
            await page.evaluate(({x1,x2,y})=>{
              const c=document.querySelector('#game-canvas');
              const base={bubbles:true,cancelable:true,pointerId:17,pointerType:'touch',isPrimary:true,width:10,height:10,pressure:.7};
              c.dispatchEvent(new PointerEvent('pointerdown',{...base,buttons:1,clientX:x1,clientY:y}));
              c.dispatchEvent(new PointerEvent('pointermove',{...base,buttons:1,clientX:x2,clientY:y}));
            },{x1,x2,y});
            await page.waitForFunction(()=>window.WitchRide3D.state.targetX>.5&&window.WitchRide3D.state.x>.02,{timeout:2500});
            await page.evaluate(({x2,y})=>{
              const c=document.querySelector('#game-canvas');
              c.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:17,pointerType:'touch',isPrimary:true,buttons:0,clientX:x2,clientY:y}));
            },{x2,y});
            const touch=await page.evaluate(()=>({x:window.WitchRide3D.state.x,targetX:window.WitchRide3D.state.targetX}));
            console.log('gate touch',JSON.stringify(touch));

            const keyStart=touch.targetX;
            await page.evaluate(()=>window.dispatchEvent(new KeyboardEvent('keydown',{code:'ArrowLeft',key:'ArrowLeft',bubbles:true})));
            await page.waitForFunction(v=>window.WitchRide3D.state.targetX<v-.15,{timeout:2500},keyStart);
            await page.evaluate(()=>window.dispatchEvent(new KeyboardEvent('keyup',{code:'ArrowLeft',key:'ArrowLeft',bubbles:true})));
            const keyboard=await page.evaluate(()=>({x:window.WitchRide3D.state.x,targetX:window.WitchRide3D.state.targetX}));
            console.log('gate keyboard',JSON.stringify(keyboard));

            await page.click('#pause');await sleep(120);
            if(await page.evaluate(()=>window.WitchRide3D.state.mode)!=='paused')throw new Error('Pause failed');
            await page.click('#resume');await sleep(120);
            if(await page.evaluate(()=>window.WitchRide3D.state.mode)!=='playing')throw new Error('Resume failed');
            if(errors.length)throw new Error('Browser errors '+errors.join(' | '));
            console.log('gate pause/resume clean');

            await page.click('#pause');
            await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:10000}),page.evaluate(()=>document.querySelector('#paused .back').click())]);
            if(!page.url().endsWith('/halloween-radio/'))throw new Error('Back to Radio failed '+page.url());
            console.log('Generated Witch Pass 11 gameplay passed',JSON.stringify({boot,score1,score2,touch,keyboard,backUrl:page.url()}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Re-fetch main and branch before generated-asset write
        shell: bash
        run: |
          git fetch origin main witch-ride-3d-witch-rebuild-pass-11
          MAIN_NOW="$(git rev-parse origin/main)"; TARGET_NOW="$(git rev-parse origin/witch-ride-3d-witch-rebuild-pass-11)"
          echo "main before write: $MAIN_NOW"; echo "target before write: $TARGET_NOW"
          git ls-tree origin/witch-ride-3d-witch-rebuild-pass-11 halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb
          test "$MAIN_NOW" = "$BASE_MAIN"; test "$TARGET_NOW" = "$BASE_TARGET"; test "$TARGET_NOW" = "$GITHUB_SHA"
      - name: Commit validated Witch Pass 11 assets
        shell: bash
        run: |
          git config user.name 'brewandbrewscompany-bot'
          git config user.email 'brewandbrewscompany@gmail.com'
          git add halloween-radio/games/witch-ride-3d/tools/build_witch_pass3.py halloween-radio/games/witch-ride-3d/tools/validate_witch_pass3.py \
                  halloween-radio/games/witch-ride-3d/assets/models/witch-rider.glb halloween-radio/games/witch-ride-3d/assets/witch-material-pass.json \
                  halloween-radio/games/witch-ride-3d/assets/textures/witch-hat-felt-*.png halloween-radio/games/witch-ride-3d/assets/textures/witch-cape-wool-*.png \
                  halloween-radio/games/witch-ride-3d/assets/textures/witch-cape-lining-*.png halloween-radio/games/witch-ride-3d/assets/textures/witch-leather-v3-*.png \
                  halloween-radio/games/witch-ride-3d/assets/textures/witch-hair-v3-*.png halloween-radio/games/witch-ride-3d/assets/textures/broom-wood-v3-*.png halloween-radio/games/witch-ride-3d/assets/textures/broom-straw-v3-*.png
          git diff --cached --quiet && { echo 'Generated assets already current'; exit 0; }
          git commit -m 'Build Witch Ride Pass 11 centerpiece asset'
          git push origin HEAD:witch-ride-3d-witch-rebuild-pass-11
