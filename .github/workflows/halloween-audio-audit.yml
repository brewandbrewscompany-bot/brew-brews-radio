name: Halloween Audio Content Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halloween-audio-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audio analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install openai-whisper

      - name: Audit unmanifested uploads
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, tempfile, re
          import whisper

          root = pathlib.Path('halloween-radio')
          manifest = json.loads((root/'data/tracks.json').read_text())
          used = {pathlib.Path(t['file']).name for t in manifest['tracks']}
          candidates = sorted(p for p in (root/'audio').glob('*.mp3') if p.name not in used)
          print('CANDIDATES', len(candidates))
          model = whisper.load_model('tiny.en')

          def duration(path):
              out = subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(path)], text=True).strip()
              return float(out)

          def sample(path,start,length,tmpdir,tag):
              wav=pathlib.Path(tmpdir)/f'{tag}.wav'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f'{max(0,start):.2f}','-t',f'{length:.2f}','-i',str(path),'-ac','1','-ar','16000',str(wav)],check=True)
              r=model.transcribe(str(wav),language='en',fp16=False,verbose=False,condition_on_previous_text=False,temperature=0)
              good=[]
              for s in r.get('segments',[]):
                  if s.get('no_speech_prob',1)<.62 and s.get('avg_logprob',-99)>-1.35:
                      good.append(s)
              text=' '.join(s.get('text','').strip() for s in good).strip()
              words=re.findall(r"\b[\w']+\b",text)
              return {'text':text[:260],'words':len(words)}

          results=[]
          for i,path in enumerate(candidates,1):
              dur=duration(path)
              starts=[0,max(0,dur*.45-15),max(0,dur*.80-12)]
              with tempfile.TemporaryDirectory() as td:
                  a=sample(path,starts[0],min(35,dur),td,'front')
                  b=sample(path,starts[1],min(30,max(1,dur-starts[1])),td,'middle')
                  c=sample(path,starts[2],min(24,max(1,dur-starts[2])),td,'late')
              total=a['words']+b['words']+c['words']
              if total<8: cat='instrumental/mostly music'
              elif a['words']>=5 and b['words']<5 and c['words']<5: cat='spoken intro + mostly music'
              elif b['words']>=5 or c['words']>=5: cat='vocal/spoken throughout'
              else: cat='mixed/uncertain'
              row={'file':path.name,'durationSec':round(dur,1),'category':cat,'frontWords':a['words'],'middleWords':b['words'],'lateWords':c['words'],'frontText':a['text'],'middleText':b['text'],'lateText':c['text']}
              results.append(row)
              print(f"[{i}/{len(candidates)}] {path.name} | {dur:.1f}s | {cat} | words {a['words']}/{b['words']}/{c['words']}")
          print('NEW_AUDIO_AUDIT_JSON_START')
          print(json.dumps(results,ensure_ascii=False))
          print('NEW_AUDIO_AUDIT_JSON_END')
          PY
