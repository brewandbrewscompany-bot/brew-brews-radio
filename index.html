<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0a08">
<title>Brew & Brews Radio</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="hero">
    <div>
      <span>Brew & Brews Radio</span>
      <h1>Pick your next pour</h1>
      <p>Original music for every moment.</p>
      <button id="heroPlayBtn" class="hero-play" type="button">▶ PLAY RADIO</button>
    </div>
  </header>

  <section class="library">
    <input id="searchInput" class="search" type="search" placeholder="Search songs or moods">
    <div id="genreFilters" class="filters"></div>
    <div id="trackGrid" class="grid"></div>
  </section>
</main>

<section id="miniPlayer" class="mini-player">
  <button id="openFullPlayer" class="mini-info" type="button">
    <img id="miniCover" src="love-in-every-brew.png" alt="">
    <span><strong id="miniTitle">Love in Every Brew</strong><small id="miniArtist">Brew & Brews Radio</small></span>
  </button>
  <button id="miniFavorite" class="favorite" type="button">♡</button>
  <div class="controls">
    <button id="shuffleBtn" type="button">⤨</button>
    <button id="prevBtn" type="button">◀</button>
    <button id="playBtn" class="play" type="button">▶</button>
    <button id="nextBtn" type="button">▶</button>
    <button id="repeatBtn" type="button">↻</button>
  </div>
  <div class="progress-row">
    <span id="miniCurrent">0:00</span>
    <input id="miniProgress" type="range" min="0" max="100" value="0">
    <span id="miniDuration">0:00</span>
  </div>
</section>

<section id="fullPlayer" class="full-player" hidden>
  <div id="fullBackdrop" class="backdrop"></div>
  <button id="closeFullPlayer" class="close" type="button">⌄</button>
  <div class="full-inner">
    <div class="now-label">NOW PLAYING</div>
    <img id="fullCover" class="full-cover" src="love-in-every-brew.png" alt="">
    <h2 id="fullTitle">Love in Every Brew</h2>
    <p id="fullArtist">Brew & Brews Radio</p>
    <input id="fullProgress" type="range" min="0" max="100" value="0">
    <div class="full-times"><span id="fullCurrent">0:00</span><span id="fullDuration">0:00</span></div>
    <div class="full-controls">
      <button id="fullShuffle" type="button">⤨</button>
      <button id="fullPrev" type="button">◀</button>
      <button id="fullPlay" class="full-play" type="button">▶</button>
      <button id="fullNext" type="button">▶</button>
      <button id="fullRepeat" type="button">↻</button>
    </div>
    <button id="fullFavorite" class="full-favorite" type="button">♡ Favorite</button>
    <p class="phone-volume-note">Use your phone’s volume buttons to adjust sound.</p>
  </div>
</section>

<audio id="audio" preload="metadata"></audio>
<script src="playlist.js"></script>
<script src="player.js"></script>
</body>
</html>
