<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0a08">
  <title>Brew & Brews Radio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-shell">

    <header class="hero">
      <div class="hero-copy">
        <div class="eyebrow">Brew & Brews Radio</div>
        <h1>Your coffeehouse soundtrack</h1>
        <p>Original music for every moment.</p>

        <div class="hero-actions">
          <button id="heroPlayBtn" class="hero-play" type="button">▶ PLAY RADIO</button>

          <a
            class="shop-link"
            href="https://brewandbrewsco.com/all-products-1"
            target="_blank"
            rel="noopener"
          >
            ☕ SHOP COFFEE
          </a>
        </div>
      </div>
    </header>

    <section class="library">

      <div class="library-head">
        <div>
          <div class="library-kicker">BROWSE THE STATION</div>
          <h2>Pick your next pour</h2>
        </div>

        <div class="library-count">
          <strong id="songCount">0</strong>
          <span>songs</span>
        </div>
      </div>

      <div class="search-wrap">
        <span>⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Search songs or moods"
          autocomplete="off"
        >
      </div>

      <div id="genreFilters" class="filters"></div>

      <div id="trackGrid" class="track-list"></div>

    </section>

  </main>

  <section id="miniPlayer" class="mini-player" aria-label="Now playing">

    <button
      id="openFullPlayer"
      class="mini-info"
      type="button"
      aria-label="Open full player"
    >
      <img id="miniCover" src="love-in-every-brew.png" alt="">

      <span class="mini-copy">
        <strong id="miniTitle">Love in Every Brew</strong>
        <small id="miniArtist">Brew & Brews Radio</small>
      </span>
    </button>

    <div class="mini-controls">
      <button id="prevBtn" type="button" aria-label="Previous">◀</button>
      <button id="playBtn" class="mini-main-play" type="button" aria-label="Play">▶</button>
      <button id="nextBtn" type="button" aria-label="Next">▶</button>
    </div>

    <button
      id="miniFavorite"
      class="mini-favorite"
      type="button"
      aria-label="Favorite"
    >
      ♡
    </button>

    <div class="mini-progress-row">
      <span id="miniCurrent">0:00</span>
      <input id="miniProgress" type="range" min="0" max="100" value="0">
      <span id="miniDuration">0:00</span>
    </div>

  </section>

  <section id="fullPlayer" class="full-player" hidden>

    <div id="fullBackdrop" class="full-backdrop"></div>

    <button
      id="closeFullPlayer"
      class="full-close"
      type="button"
      aria-label="Close full player"
    >
      ⌄
    </button>

    <div class="full-inner">

      <div class="full-label">NOW PLAYING</div>

      <img
        id="fullCover"
        class="full-cover"
        src="love-in-every-brew.png"
        alt="Current album artwork"
      >

      <h2 id="fullTitle">Love in Every Brew</h2>
      <p id="fullArtist">Brew & Brews Radio</p>

      <input id="fullProgress" type="range" min="0" max="100" value="0">

      <div class="full-times">
        <span id="fullCurrent">0:00</span>
        <span id="fullDuration">0:00</span>
      </div>

      <div class="full-controls">
        <button id="fullShuffle" type="button" aria-label="Shuffle">⤨</button>
        <button id="fullPrev" type="button" aria-label="Previous">◀</button>
        <button id="fullPlay" class="full-main-play" type="button" aria-label="Play">▶</button>
        <button id="fullNext" type="button" aria-label="Next">▶</button>
        <button id="fullRepeat" type="button" aria-label="Repeat">↻</button>
      </div>

      <button id="fullFavorite" class="full-favorite" type="button">♡ Favorite</button>

      <a
        class="full-shop"
        href="https://brewandbrewsco.com/all-products-1"
        target="_blank"
        rel="noopener"
      >
        ☕ SHOP BREW & BREWS COFFEE
      </a>

      <p class="phone-volume-note">Use your phone’s volume buttons to adjust sound.</p>

    </div>

  </section>

  <audio id="audio" preload="metadata"></audio>

  <script src="playlist.js"></script>
  <script src="player.js"></script>

</body>
</html>
