<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brew & Brews Radio</title><link rel="manifest" href="manifest.json"><style>body{margin:0;background:#111;color:#fff;font-family:Arial}header{text-align:center;padding:20px;background:#1b1b1b}main{max-width:900px;margin:auto;padding:20px}button{padding:10px 16px;margin:4px}#cover{max-width:280px;width:100%;border-radius:12px}.track{padding:8px;border-bottom:1px solid #333;cursor:pointer}</style></head><body><header><h1>Brew & Brews Radio</h1></header><main><img id="cover"><h2 id="title">Loading...</h2><p id="artist"></p><audio id="audio" controls style="width:100%"></audio><div><button id="prev">Prev</button><button id="play">Play/Pause</button><button id="next">Next</button></div><h3>Playlist</h3><div id="playlist"></div></main><script src="playlist.js"></script><script>const tracks=window.BB_PLAYLIST||[];let current=0;const a=document.getElementById('audio'),c=document.getElementById('cover'),t=document.getElementById('title'),r=document.getElementById('artist'),p=document.getElementById('playlist');function load(i){current=i;const s=tracks[i];if(!s)return;a.src=s.audio;c.src=s.cover;t.textContent=s.title;r.textContent=s.artist||'Brew & Brews';draw()}function draw(){p.innerHTML='';tracks.forEach((s,i)=>{const d=document.createElement('div');d.className='track';d.textContent=(i===current?'▶ ':'')+s.title;d.onclick=()=>{load(i);a.play()};p.appendChild(d)})}play.onclick=()=>a.paused?a.play():a.pause();next.onclick=()=>{load((current+1)%tracks.length);a.play()};prev.onclick=()=>{load((current-1+tracks.length)%tracks.length);a.play()};a.onended=()=>next.click();load(0);</script></body></html>
