<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#341451">
<title>Louisburg Local V5 Swipe Prototype</title>
<style>
:root{--purple:#4b216d;--deep:#321447;--deep2:#251034;--cream:#f8f4ec;--paper:#fffdf8;--ink:#26202b;--muted:#736d78;--line:#e3dbe6;--shadow:0 14px 36px rgba(25,10,35,.28)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:Arial,sans-serif;color:var(--ink)}
button{font:inherit}.stage{position:fixed;inset:0;background:var(--cream)}
#v4frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream)}
.scrim{position:fixed;inset:0;z-index:90;background:rgba(24,10,33,.48);opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;z-index:100;width:min(86vw,380px);background:var(--paper);box-shadow:var(--shadow);transition:transform .24s cubic-bezier(.2,.8,.2,1);overflow:auto;overscroll-behavior:contain}
.drawer.left{left:0;transform:translateX(-103%);background:linear-gradient(165deg,#251034,#3d1957 62%,#4b216d);color:#fff}
.drawer.right{right:0;transform:translateX(103%)}
.drawer.open{transform:translateX(0)}
.drawerInner{min-height:100%;padding:calc(18px + env(safe-area-inset-top)) 17px calc(22px + env(safe-area-inset-bottom))}
.drawerHead{display:flex;align-items:center;gap:10px;margin-bottom:18px}.drawerHead h2{margin:0;flex:1;font:800 22px/1.05 Georgia,serif}.close{width:40px;height:40px;border:0;border-radius:13px;background:rgba(255,255,255,.13);color:inherit;font-size:23px}.right .close{background:#efe8f2;color:var(--deep)}
.brandBlock{padding:8px 4px 19px;border-bottom:1px solid rgba(255,255,255,.17);margin-bottom:10px}.brandBlock b{display:block;font:800 25px Georgia,serif;letter-spacing:.4px}.brandBlock small{display:block;margin-top:6px;opacity:.74;font-size:10px;line-height:1.35}
.navGroup{padding:7px 0}.navButton{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:inherit;padding:13px 8px;border-radius:13px;text-align:left;font-weight:800}.navButton:active{background:rgba(255,255,255,.12)}.navIcon{width:28px;text-align:center;font-size:19px}.navDivider{height:1px;background:rgba(255,255,255,.16);margin:8px 4px}.tagline{margin-top:20px;padding:14px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);font:italic 18px Georgia,serif;line-height:1.35}
.filterTitle{font:800 11px Arial,sans-serif;text-transform:uppercase;letter-spacing:.7px;color:#66576d;margin:16px 0 8px}.choices{display:grid;gap:7px}.choice{width:100%;border:1px solid #ddd2e2;border-radius:13px;background:#fff;color:var(--deep);padding:11px 12px;text-align:left;font-weight:800}.choice.active{background:#eee3f5;border-color:#bba1ca;box-shadow:inset 4px 0 0 var(--purple)}.apply{width:100%;margin-top:18px;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--deep),var(--purple));color:#fff;font-weight:900}
.edgeButton{position:fixed;z-index:70;top:calc(70px + env(safe-area-inset-top));width:38px;height:52px;border:0;color:#fff;background:linear-gradient(145deg,var(--deep),var(--purple));box-shadow:0 5px 16px rgba(30,12,42,.22);font-size:19px;display:grid;place-items:center}.edgeButton.left{left:0;border-radius:0 14px 14px 0}.edgeButton.right{right:0;border-radius:14px 0 0 14px}
.swipeHint{position:fixed;z-index:65;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(15px);background:#251034e8;color:#fff;border:1px solid #ffffff29;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:800;white-space:nowrap;opacity:0;pointer-events:none;transition:.25s}.swipeHint.show{opacity:1;transform:translateX(-50%) translateY(0)}
.testBadge{position:fixed;z-index:66;right:8px;top:calc(8px + env(safe-area-inset-top));background:#fff9;color:var(--deep);border:1px solid #d8cbe0;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:900;backdrop-filter:blur(8px);pointer-events:none}
@media(min-width:900px){.edgeButton{top:90px}.drawer{width:360px}}
@media(prefers-reduced-motion:reduce){.drawer,.scrim,.swipeHint{transition:none}}
</style>
</head>
<body>
<div class="stage"><iframe id="v4frame" title="Louisburg Local V5 prototype" src="../web-v4/?v5=swipe-anywhere"></iframe></div>
<div class="testBadge">V5 SWIPE TEST</div>
<button class="edgeButton left" id="leftHandle" aria-label="Open navigation">☰</button>
<button class="edgeButton right" id="rightHandle" aria-label="Open filters">☷</button>
<div class="swipeHint" id="swipeHint">Swipe anywhere → menu · ← filters</div>
<div class="scrim" id="scrim"></div>

<aside class="drawer left" id="leftDrawer" aria-label="Navigation menu">
  <div class="drawerInner">
    <div class="drawerHead"><h2>Louisburg Local</h2><button class="close" data-close aria-label="Close">×</button></div>
    <div class="brandBlock"><b>LOUISBURG LOCAL</b><small>Local people. Local business. A stronger Louisburg.</small></div>
    <div class="navGroup">
      <button class="navButton" data-screen="home"><span class="navIcon">⌂</span>Home</button>
      <button class="navButton" data-screen="directory"><span class="navIcon">⌕</span>Directory</button>
      <button class="navButton" data-screen="events"><span class="navIcon">▣</span>Events</button>
      <button class="navButton" data-screen="deals"><span class="navIcon">◇</span>Deals &amp; Specials</button>
    </div>
    <div class="navDivider"></div>
    <div class="navGroup">
      <button class="navButton" id="historyLink"><span class="navIcon">◷</span>Louisburg History</button>
      <button class="navButton" data-screen="more"><span class="navIcon">◎</span>Community Resources</button>
      <button class="navButton" id="correctionLink"><span class="navIcon">✎</span>Submit / Correct Info</button>
      <button class="navButton" data-screen="more"><span class="navIcon">ⓘ</span>About Louisburg Local</button>
    </div>
    <div class="tagline">Small town.<br>Big community.</div>
  </div>
</aside>

<aside class="drawer right" id="rightDrawer" aria-label="Feed filters">
  <div class="drawerInner">
    <div class="drawerHead"><h2>Filter Posts</h2><button class="close" data-close aria-label="Close">×</button></div>
    <div class="filterTitle">Category</div>
    <div class="choices" id="categoryChoices">
      <button class="choice active" data-filter-cat="ALL">All activity</button>
      <button class="choice" data-filter-cat="DEALS">Deals &amp; specials</button>
      <button class="choice" data-filter-cat="FOOD">Food &amp; drink</button>
      <button class="choice" data-filter-cat="EVENTS">Events</button>
      <button class="choice" data-filter-cat="FAMILY">Family</button>
      <button class="choice" data-filter-cat="SPORTS">Sports</button>
      <button class="choice" data-filter-cat="HIRING">Hiring</button>
    </div>
    <div class="filterTitle">Time</div>
    <div class="choices" id="timeChoices">
      <button class="choice active" data-filter-time="ALL">All current</button>
      <button class="choice" data-filter-time="TODAY">Today</button>
      <button class="choice" data-filter-time="COMING UP">Coming up</button>
      <button class="choice" data-filter-time="WHAT'S NEXT">What’s next</button>
    </div>
    <div class="filterTitle">Source</div>
    <div class="choices" id="sourceChoices">
      <button class="choice active" data-filter-source="">All sources</button>
      <button class="choice" data-filter-source="Facebook">Facebook</button>
      <button class="choice" data-filter-source="Instagram">Instagram</button>
      <button class="choice" data-filter-source="Website">Local websites</button>
    </div>
    <button class="apply" id="applyFilters">Apply Filters</button>
  </div>
</aside>

<script>
const frame=document.getElementById('v4frame');
const leftDrawer=document.getElementById('leftDrawer');
const rightDrawer=document.getElementById('rightDrawer');
const scrim=document.getElementById('scrim');
const hint=document.getElementById('swipeHint');
let chosenCat='ALL',chosenTime='ALL',chosenSource='';

function closeDrawers(){leftDrawer.classList.remove('open');rightDrawer.classList.remove('open');scrim.classList.remove('open')}
function openDrawer(which){closeDrawers();(which==='left'?leftDrawer:rightDrawer).classList.add('open');scrim.classList.add('open')}
function app(){try{return frame.contentWindow}catch(e){return null}}
function showScreen(name){const w=app();try{if(w&&typeof w.showScreen==='function')w.showScreen(name)}catch(e){}closeDrawers()}
function choose(group,button){group.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===button))}

document.getElementById('leftHandle').onclick=()=>openDrawer('left');
document.getElementById('rightHandle').onclick=()=>openDrawer('right');
scrim.onclick=closeDrawers;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawers);
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));
document.getElementById('historyLink').onclick=()=>{location.href='../web-v4/history.html'};
document.getElementById('correctionLink').onclick=()=>{showScreen('more')};

document.getElementById('categoryChoices').onclick=e=>{const b=e.target.closest('[data-filter-cat]');if(!b)return;chosenCat=b.dataset.filterCat;choose(e.currentTarget,b)};
document.getElementById('timeChoices').onclick=e=>{const b=e.target.closest('[data-filter-time]');if(!b)return;chosenTime=b.dataset.filterTime;choose(e.currentTarget,b)};
document.getElementById('sourceChoices').onclick=e=>{const b=e.target.closest('[data-filter-source]');if(!b)return;chosenSource=b.dataset.filterSource;choose(e.currentTarget,b)};
document.getElementById('applyFilters').onclick=()=>{
  const w=app();
  try{
    if(w&&w.state){w.state.cat=chosenCat;w.state.section=chosenTime;w.state.source=chosenSource;if(typeof w.showScreen==='function')w.showScreen('home');if(typeof w.renderHome==='function')w.renderHome()}
  }catch(e){}
  closeDrawers();
};

function injectPrototypeLayer(){
  let doc,w;try{doc=frame.contentDocument;w=frame.contentWindow;if(!doc||!w)return}catch(e){return}
  if(!doc.getElementById('v5-prototype-css')){
    const style=doc.createElement('style');style.id='v5-prototype-css';
    style.textContent=`html,body{touch-action:pan-y!important;overscroll-behavior-x:none!important}#menuBtn,#focusSearch{opacity:0!important;pointer-events:none!important}.snapshot,#sectionTabs{display:none!important}.main{padding-top:10px!important}.brand small{font-size:9px!important}.quick{padding-top:1px!important}.bar{margin-top:1px!important}`;
    doc.head.appendChild(style);
  }
  const sub=doc.querySelector('.brand small');if(sub)sub.textContent='Louisburg, Kansas · V5 interaction test';
  attachGestures(doc);
}

function attachGestures(doc){
  if(doc.documentElement.dataset.v5Gestures==='2')return;
  doc.documentElement.dataset.v5Gestures='2';
  let sx=0,sy=0,started=false,swipedAt=0;
  const editable=t=>t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]');
  function begin(x,y,target){if(editable(target)){started=false;return}sx=x;sy=y;started=true}
  function finish(x,y){
    if(!started)return;started=false;
    const dx=x-sx,dy=y-sy,ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax<52||ax<ay*1.12||ay>125)return;
    swipedAt=Date.now();
    if(dx>0)openDrawer('left');else openDrawer('right');
  }
  doc.addEventListener('touchstart',e=>{if(e.touches.length!==1){started=false;return}const t=e.touches[0];begin(t.clientX,t.clientY,e.target)},{passive:true,capture:true});
  doc.addEventListener('touchend',e=>{if(!e.changedTouches.length){started=false;return}const t=e.changedTouches[0];finish(t.clientX,t.clientY)},{passive:true,capture:true});
  doc.addEventListener('touchcancel',()=>{started=false},{passive:true,capture:true});
  doc.addEventListener('click',e=>{if(Date.now()-swipedAt<500){e.preventDefault();e.stopImmediatePropagation()}},true);
}

frame.addEventListener('load',()=>{injectPrototypeLayer();setTimeout(injectPrototypeLayer,600)});
setTimeout(()=>{hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),3500)},900);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawers()});
</script>
</body>
</html>
